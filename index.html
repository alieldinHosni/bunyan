.pgpr{flex:0 0 132px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:14px;border-radius:var(--r3);border:1px solid var(--border);color:var(--text);text-align:start;
  transition:transform var(--m-press) var(--e-standard),border-color var(--m-micro) var(--e-standard)}
.pgpr.on{border-color:var(--accent-edge)}
:root:not(.tch) .pgpr:active,.pgpr.tapd{transform:scale(.97)}
.pgpr .pgki{margin-bottom:4px}
.pgpr-n{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pgpr-v{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pgpr-v small{font-family:inherit;font-size:12px;color:var(--dim);margin-inline-start:3px;font-weight:600}
.pgpr-d{font-size:11.5px;color:var(--dim)}
.pgex{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 14px;margin-bottom:8px;
  border-radius:var(--r2);border:1px solid var(--border);color:var(--text);text-align:start;
  transition:transform var(--m-press) var(--e-standard)}
.pgex.on{border-color:var(--accent-edge)}
:root:not(.tch) .pgex:active,.pgex.tapd{transform:scale(.98)}
.pgex .thumbwrap,.pgex .thumb.ph,.pgex img.thumb{border-radius:12px;flex-shrink:0}
.pgex-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pgex-n{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.pgex-s{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.pgex .pgspark{flex:0 0 56px;width:56px;height:24px;margin:0}
.pgex-p{flex:0 0 42px;text-align:end;font-size:12.5px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.pgex-p.ok{color:var(--ok)}
.pgex .ico-chev{color:var(--dim);flex-shrink:0}
.pginsight{display:flex;gap:12px;align-items:flex-start;margin-top:var(--s4);padding:16px;border-radius:var(--r3);border:1px solid var(--border)}
.pginsight-i{flex:0 0 36px;width:36px;height:36px;border-radius:var(--rpill);display:flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--sub);box-shadow:inset 0 0 0 1px var(--border)}
.pginsight-i svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pginsight>span:last-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.pginsight b{font-size:14.5px}
.pginsight span span{font-size:13.5px;color:var(--sub)}
.pginsight small{font-size:11.5px;color:var(--dim)}
@media (max-width:360px){.pgex .pgspark{display:none}.pgbanner-t{padding-inline-start:24%}}
/* ---- Rest (session.js vRest): the countdown and the rest-over choices --------------
   The redesign frames: a dark field with the red swirl (img/rest-swirl.jpg, drawn for
   this) turning slowly behind the ring, the dock's glass and pill language for every
   control. #rest scoping outranks the older .restwrap rules above. */
#rest .restwrap.rt{justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  overflow-y:auto;overflow-x:hidden;background:#050506;background-image:none;isolation:isolate;gap:0}
.rt-art{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.rt-art img{position:absolute;left:50%;top:44%;width:max(150vw,760px);height:auto;transform:translate(-50%,-50%);
  opacity:.9;animation:rtSpin 90s linear infinite}
.rt-done .rt-art img{top:30%;opacity:.35}
@keyframes rtSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
:root.reduced .rt-art img{animation:none}
.rt-art::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 44%,transparent,rgba(5,5,6,.55) 70%,#050506)}
.rt-k{font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accentHi);text-align:center}
.rt-sub{margin-top:8px;font-size:15px;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.rt-ring{position:relative;width:min(64vw,260px);aspect-ratio:1;margin:30px 0 26px}
.rt-ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block;filter:drop-shadow(0 0 14px rgba(var(--glow-rgb),.35))}
.rt-ring-t{fill:none;stroke:rgba(255,255,255,.12);stroke-width:9}
.rt-ring-v{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.rt-ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rt-ct::before{content:"";position:absolute;inset:14%;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,rgba(5,5,6,.72) 30%,rgba(5,5,6,.35) 62%,transparent 72%)}
.rt-ring{isolation:isolate}
.rt-dig{font-family:var(--display);font-size:clamp(48px,15vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1;
  font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.rt-tot{margin-top:8px;font-size:13px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.rt-ctl{display:flex;align-items:center;gap:14px}
.rt-rnd{width:64px;height:64px;border-radius:var(--rpill);border:1px solid var(--hair-hi);background:rgba(20,20,26,.72);
  color:var(--text);font-size:15px;font-weight:700;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:transform var(--m-press) var(--e-standard)}
.rt-main{display:flex;align-items:center;justify-content:center;gap:10px;min-width:150px;height:60px;padding:0 26px;border:0;
  border-radius:var(--rpill);background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--onAccent);font-family:var(--display);
  font-size:18px;font-weight:700;box-shadow:0 12px 30px -10px var(--accent-glow);transition:transform var(--m-press) var(--e-standard)}
.rt-main .ico{width:20px;height:20px;flex-basis:20px}
:root:not(.tch) .rt-rnd:active,.rt-rnd.tapd,:root:not(.tch) .rt-main:active,.rt-main.tapd,:root:not(.tch) .rt-go:active,.rt-go.tapd{transform:scale(.95)}
.rt-next{width:100%;max-width:420px;margin-top:34px;padding:18px;border-radius:var(--r4);text-align:center;
  background:rgba(20,20,26,.78);border:1px solid var(--hair);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.rt-next.sm{margin:14px 0 4px;padding:12px}
.rt-next-k{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.rt-next-v{margin-top:6px;font-family:var(--display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.rt-next-r{margin-top:4px;font-size:14px;color:var(--accentHi);font-weight:600}
.rt-skip{margin-top:18px;min-height:44px;padding:0 16px;border:0;background:none;color:var(--dim);font-size:14px;font-weight:600}
/* Rest over */
.rt-check{width:112px;height:112px;margin:22px 0 18px}
.rt-check svg{width:100%;height:100%;filter:drop-shadow(0 0 16px rgba(var(--glow-rgb),.45))}
.rt-check-t{fill:rgba(20,20,26,.6);stroke:rgba(255,255,255,.1);stroke-width:7}
.rt-check-r{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:40;
  transform:rotate(-90deg);transform-origin:60px 60px}
.rt-check-m{fill:none;stroke:var(--accentHi);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:60;stroke-dashoffset:0;animation:rtTick .5s var(--e-decel) .15s both}
@keyframes rtTick{from{stroke-dashoffset:60}}
:root.reduced .rt-check-m{animation:none}
.rt-h{margin:8px 0 18px;font-family:var(--display);font-size:clamp(24px,7vw,30px);font-weight:800;text-align:center;line-height:1.15}
.rt-go{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:420px;min-height:58px;border:0;
  border-radius:var(--r4);background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--onAccent);font-family:var(--display);
  font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 14px 34px -12px var(--accent-glow);
  transition:transform var(--m-press) var(--e-standard)}
.rt-go svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}











[dir="rtl"] .rt-k,[dir="rtl"] .rt-go{letter-spacing:0}[dir="rtl"] .rt-go svg{transform:scaleX(-1)}
@media (max-width:360px){}
/* ---- The workout (session.js vLogger), in the other tabs' language -------------------
   Same content, same controls; a glass header, the exercise as a hero card over the
   horse, the sets in one card, and the ember glow behind it all. Scoped to .sess. */
.sess{position:relative;isolation:isolate}
.sess-glow{position:absolute;z-index:-1;left:0;right:0;top:-40px;height:520px;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 30%,rgba(var(--glow-rgb),.22),transparent 70%)}
.sess .ss-top{background:rgba(var(--bg-rgb),.72);-webkit-backdrop-filter:saturate(150%) blur(18px);backdrop-filter:saturate(150%) blur(18px);
  border-bottom:1px solid var(--hair)}
.sess .ss-back,.sess .ss-more{width:44px;height:44px;border-radius:var(--rpill);border:1px solid var(--hair-hi);
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;padding:0}
.sess .ss-back{color:var(--accentHi);font-size:18px}
.sess .ss-more{color:var(--text);font-size:18px;letter-spacing:.05em}
.sess .ss-clock{border-radius:var(--r4);border:1px solid var(--accent-edge);background:var(--accent-tint);
  box-shadow:0 8px 22px -10px var(--accent-glow)}
.sess .ss-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.sess .ss-bar i{background:linear-gradient(90deg,var(--accent),var(--accentHi));border-radius:2px}
.exhero{position:relative;isolation:isolate;overflow:hidden;margin:4px 0 var(--s4);padding:18px 16px 16px;border-radius:var(--r5);
  border:1px solid var(--border);box-shadow:var(--shadow-card);
  background:radial-gradient(90% 70% at 100% 0%,rgba(var(--glow-rgb),.20),transparent 60%),
    linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--raised)}
.exhero-art{position:absolute;z-index:-1;top:-24px;inset-inline-end:-40px;width:190px;height:auto;opacity:.16;pointer-events:none;
  filter:drop-shadow(0 0 20px rgba(var(--glow-rgb),.5));-webkit-mask:linear-gradient(200deg,#000 20%,transparent 75%);mask:linear-gradient(200deg,#000 20%,transparent 75%)}
[dir="rtl"] .exhero-art{transform:scaleX(-1)}
.exhero-k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accentHi);margin-bottom:6px}
.exhero .exhead{margin:0 0 14px}
.exhero .ex-name{font-size:clamp(22px,6.6vw,27px);line-height:1.12}
.exhero .formvis{gap:10px;margin:0 0 14px}
.exhero .formvis figure{position:relative;margin:0;border-radius:var(--r3);overflow:hidden;border:1px solid var(--hair);background:var(--surface)}
.exhero .formvis img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.exhero .formvis figcaption{position:absolute;inset-inline-start:8px;bottom:8px;margin:0;padding:3px 9px;border-radius:var(--rpill);
  background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.12em;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.exhero .ex-tags{margin:0;gap:8px}
.exhero .etag{border-radius:var(--rpill);background:rgba(255,255,255,.05);border:1px solid var(--hair-hi)}
.exhero .etag.hot{background:var(--accent-tint);border-color:var(--accent-edge)}
.sess .recbar{border-radius:var(--r4);border:1px solid var(--accent-edge);background:var(--accent-tint)}
/* First time on an exercise: advice, not a number, so it is quieter than a recommendation. */
.sess .recbar.first{background:var(--raised);border-color:var(--border);color:var(--sub)}
/* A pre-filled value is a suggestion until it is touched: dimmer, and white once edited. */
.cell.sg{color:var(--dim)}
.setcard{margin-top:var(--s3);padding:14px 12px 12px;border-radius:var(--r5);border:1px solid var(--border);box-shadow:var(--shadow-card);
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--raised)}
.setcard-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.setcard-h h2{font-family:var(--display);font-size:17px;margin:0}
.setcard-c{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.setcard-c b{color:var(--text)}
.setcard .setgrid{margin-top:4px}
.setcard .setrow{border-radius:var(--r3);background:rgba(255,255,255,.035);border:1px solid var(--hair)}
.setcard .setrow.hd{background:none;border:0}
.setcard .setrow.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(var(--accent-rgb),.18),rgba(var(--accent-rgb),.06));
  box-shadow:0 10px 26px -14px var(--accent-glow)}
.setcard .setrow.pend{opacity:.5}
.setcard .cell{border-radius:12px;background:rgba(0,0,0,.35);border-color:var(--hair-hi)}
/* In light mode a dark well reads as a grey box on the light glass: the cells are the
   light glass of every other field there. Focus still shows, in the accent. */
[data-theme="light"] .setcard .cell{background:var(--glass-btn);border-color:var(--glass-btn-edge);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.setcard .cell:focus{border-color:var(--accent)}
.setcard .logbtn.go{background:linear-gradient(180deg,var(--accent),var(--accent-deep));border:0}
.setcard .addrow{margin-top:4px;display:flex;justify-content:center}
.addset2{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--rpill);border:1px dashed var(--hair-hi);
  background:none;color:var(--sub);font-weight:700;font-size:14px}
.addset2 span{font-size:18px;color:var(--accentHi)}
:root:not(.tch) .addset2:active,.addset2.tapd{transform:scale(.96)}
.btn.ss-next{border-radius:var(--r4);background:linear-gradient(180deg,var(--accent),var(--accent-deep));box-shadow:0 14px 30px -14px var(--accent-glow);margin-top:var(--s4)}
/* ---- The workout screen (docs/design/workout-spec.md, revised by the owner 21 Oct) ----
   Calm and fast to read mid-set: the exercise, the set's numbers, the check, then
   everything else. The page is the theme's flat ground (no drawing behind numbers); the
   set card, the rest, the next exercise and the sets are the theme's translucent card
   glass with its rim, which needs no blur over a flat ground, so the header is the one
   blurred layer. Labels sit on --color-action-fill, never on Machine Red. */
body.wkflat::before,body.wkflat #bgart{display:none}
body.wkflat #app{--gutter:20px}
[dir="rtl"] .sess .flip{transform:scaleX(-1)}
.sess .gl{stroke-width:2}
/* The app's glass (see "Glass, everywhere") stops at the workout's header: fields and
   buttons in the content are flat. */
.sess .wb :is(input,select,textarea,.ready,.btn.g,.card){-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.sess .wb :is(input,select,textarea){background-color:var(--surface);border-color:var(--border)}
.sess .wglass{background:var(--card);border:1px solid var(--card-edge);box-shadow:inset 0 1px 0 var(--glass-hi)}

/* WorkoutHeader: close, day and position (opens today's list), clock, more, a 3px bar. */
.sess .ss-top{margin-bottom:var(--s3);padding-bottom:0;border-bottom:1px solid var(--hair)}
.sess .ss-row{display:grid;grid-template-columns:var(--hit) minmax(0,1fr) auto var(--hit);gap:var(--s3);align-items:center;min-height:52px}
.sess .ss-back,.sess .ss-more{width:var(--hit);height:var(--hit);margin:0;padding:0;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--glass-btn-edge);background:var(--glass-btn);color:var(--text)}
.sess .ss-title{min-height:var(--hit);justify-content:center;padding:0}
.sess .ss-name{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
[dir="rtl"] .sess .ss-name{letter-spacing:0;font-size:13px}
.sess .ss-meta{display:flex;align-items:center;gap:var(--s1);margin:0;font-size:16px;font-weight:700;color:var(--text)}
.sess .ss-caret{width:16px;height:16px}
.sess .ss-clock{margin:0;padding:0 var(--s1);border:0;border-radius:0;background:none;box-shadow:none;align-items:flex-end}
.sess .ss-clock .num{color:var(--sub);font-size:16px}
.sess .ss-bar{height:3px;margin:var(--s2) calc(-1 * var(--gutter)) 0;border-radius:0;background:var(--bar-track)}
.sess .ss-bar i{height:3px;border-radius:0;background:var(--accent)}

.sess .wb{display:grid;gap:var(--s3)}
.sess .wb>*{min-width:0;margin-block:0}

/* ExerciseLine: the exercise is the heading; the prescription under it; how to do it
   and swap beside it; the two adds as one row of quiet chips. */
.wexl{display:grid;grid-template-columns:minmax(0,1fr) var(--hit) var(--hit);gap:var(--s1) var(--s2);align-items:center}
.wexl .ex-name{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0;min-width:0}
.sess .ib{width:var(--hit);height:var(--hit);display:grid;place-items:center;padding:0;border-radius:50%;
  border:1px solid var(--border);background:var(--surface);color:var(--text)}
.wexl-s{grid-column:1/-1;margin:0;color:var(--sub);font-size:15px}
.wexl-s .ex-light{color:var(--text);font-weight:700}
.wexl .adds{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s1)}
.wexl .chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:var(--hit);padding:0 var(--s4);border-radius:var(--rpill);
  border:1px dashed var(--border);background:transparent;color:var(--text);font-weight:600;font-size:14px}
.wexl .chip .gl{width:18px;height:18px}
.wexl .chip.wkwu{border:1px solid var(--border);background:var(--surface)}
.wexl .chip.wkwu .gl{color:var(--gold)}

/* RestBand: compact, above the set. Time up, it fills with the action fill and is the
   alert. */
.rb{display:grid;gap:10px;padding:var(--s3) var(--s4);border-radius:var(--r4)}
.rb-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.rb-l{display:flex;align-items:baseline;gap:var(--s3)}
.rb-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
[dir="rtl"] .rb-k{letter-spacing:0;font-size:13px}
.rb-t{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.01em;color:var(--text)}
.rb-ctl{display:flex;gap:var(--s2)}
.rb-ctl button{width:var(--hit);height:var(--hit);display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-weight:700;font-size:14px}
.rb-ctl .gl{width:18px;height:18px}
.rb-ctl :is(.i-pause,.i-play){fill:currentColor;stroke:none}
.rb .i-play,.rb.paused .i-pause{display:none}
.rb.paused .i-play{display:block}
.rb-bar{height:4px;border-radius:2px;background:var(--bar-track);overflow:hidden}
.rb-bar i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width 1s linear}
.rb.over{background:var(--color-action-fill);border:1.5px solid var(--color-action-edge);color:var(--onAccent);
  display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:var(--s3)}
.rb.over .rb-l{min-width:0;display:block}
.rb.over .rb-ctl{display:flex;gap:var(--s2);flex:none}
.rb.over .rb-ctl button{min-width:var(--hit);height:var(--hit);padding:0 var(--s3);border-radius:var(--rpill);border:1.5px solid currentColor;
  background:transparent;color:inherit;font-weight:800;font-size:15px;display:grid;place-items:center}
.rb.over .rb-close svg,.rb.over .rb-close .gl{width:18px;height:18px}
/* Add a set, under the sets. */
.wsl-add{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--hit);margin:0;padding:var(--s2) var(--s3);
  border:0;border-top:1px dashed var(--border);background:none;color:var(--sub);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.wsl-add svg,.wsl-add .gl{width:18px;height:18px}
.rb-done{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.15}
.rb-sub{font-family:var(--display);font-size:16px;font-weight:700}

/* SetCard: the one thing to read at arm's length. */
.wsc{display:grid;gap:var(--s3);padding:var(--s4);border-radius:var(--r5)}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:24px}
.sg-tag{margin-inline-start:auto;padding:2px 10px;border-radius:var(--rpill);border:1px solid var(--border);
  color:var(--sub);font-size:12px;font-weight:700}
.sg-tag[hidden]{display:none}
.sc-g{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.sc-g.one{grid-template-columns:1fr}
.sc-g:not(.one) .val+.val{border-inline-start:1px solid var(--hair);padding-inline-start:var(--s4)}
.wsc .val{display:grid;gap:var(--s2);justify-items:center;text-align:center;min-width:0}
.wsc .val-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
[dir="rtl"] .wsc .val-k{letter-spacing:0;font-size:13px}
.val-nw{display:flex;align-items:baseline;justify-content:center;gap:6px;max-width:100%;min-width:0}
.sess .wsc .val-n{min-width:1.4ch;max-width:100%;height:auto;margin:0;padding:0;border:0;border-bottom:2px solid transparent;border-radius:0;
  background:none;box-shadow:none;color:var(--text);text-align:center;font-family:var(--display);font-weight:700;font-size:64px;
  line-height:1.05;letter-spacing:-.02em;-moz-appearance:textfield;appearance:textfield}
.sess .wsc .val-n::-webkit-inner-spin-button,.sess .wsc .val-n::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sess .wsc .val-n:focus{outline:none;border-bottom-color:var(--accent)}
/* A suggestion reads one step quieter than numbers the lifter set (and says so in the
   tag above), so it is never taken for something done. */
.sess .wsc .val-n.sg{color:var(--sub)}
.val-u{font-size:18px;font-weight:600;color:var(--sub)}
.wsc .wstp{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);width:100%}
.wsc .wstp button{min-height:52px;display:flex;align-items:center;justify-content:center;gap:2px;padding:0;border-radius:var(--r4);
  border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--display);font-size:17px;font-weight:700}
.wsc .wstp .gl{width:18px;height:18px;stroke-width:2.4}
:root:not(.tch) .wsc .wstp button:active,.wsc .wstp button.tapd{background:var(--accent-tint);border-color:var(--accent-edge)}
.sess .wsc.small .val-n{font-size:min(48px,45cqi)}
/* The figure fits its half of the card at any width: 62.5 and 102.5 step down, and on
   the narrowest phones the unit moves up into the label. */
.wsc .val{container-type:inline-size}
.sess .wsc .val-n{font-size:min(64px,45cqi)}
.sess .wsc .val-n.long{font-size:min(50px,30cqi)}
.sess .wsc.small .val-n.long{font-size:min(40px,30cqi)}
.val-ku{display:none}
@container (max-width:130px){.wsc .val-u{display:none}.wsc .val-ku{display:inline}}
.wsc.small .wstp button{min-height:48px}
.sc-h{display:grid;gap:2px;padding-top:var(--s3);border-top:1px solid var(--hair);color:var(--sub);font-size:14px;line-height:1.4}
.sc-h b{color:var(--text);font-weight:700}
.sc-h .sc-cue{font-style:italic}
.sc-rpe{display:grid;gap:var(--s2);text-align:center}
.sc-rpe-c{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sc-rpe-c button{min-height:var(--hit);border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-weight:700;font-size:15px}
.sc-rpe-c button.on{background:var(--accent-tint);border-color:var(--accent);color:var(--text)}
.sc-wu{display:flex;align-items:center;gap:var(--s2);font-size:14px;font-weight:700;color:var(--text);min-width:0}
.sc-wu p{margin:0;min-width:0}
.sc-wu p span{color:var(--sub);font-weight:600}
.sess .wub{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--gold);color:var(--text);
  display:inline-grid;place-items:center;font-size:12px;font-weight:700}

/* LogControl: the one primary action. A label and the check, on the action fill. */
.sess .log{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);width:100%;min-height:64px;margin:0;
  padding-block:10px;padding-inline:var(--s5) 10px;border:0;border-radius:var(--rpill);
  background:var(--color-action-fill);box-shadow:inset 0 0 0 1.5px var(--color-action-edge);color:var(--onAccent);
  font-family:var(--display);font-size:19px;font-weight:700;text-align:start;
  transition:transform var(--m-press) var(--e-standard),filter var(--m-press) var(--e-standard)}
:root:not(.tch) .sess button.log:active,.sess button.log.tapd{transform:scale(.98);filter:brightness(1.08)}
.log-c{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;border:2px solid currentColor}
.log-c .gl{width:22px;height:22px;stroke-width:2.6}
.sess .log.ok{background:var(--ok);box-shadow:none;color:var(--onOk);padding-inline:10px;justify-content:flex-start;
  animation:wkIn var(--m-comp) var(--e-decel)}
.sess .log.ok .log-c{background:var(--onOk);color:var(--ok);border-color:var(--onOk)}
.sess .log.ok b{flex:1;min-width:0;font-size:19px}
.sess .undo{min-height:var(--hit);padding:0 18px;border-radius:var(--rpill);border:2px solid var(--onOk);background:transparent;
  color:var(--onOk);font-weight:700;font-size:15px}
@keyframes wkIn{from{opacity:0;transform:translateY(4px)}}
.rb{animation:wkIn var(--m-comp) var(--e-decel)}

/* "How do you feel today?" (readiness for the day, before the first set), compact. */
.sess .ready{margin:0;padding:0;border:0;background:none}
.sess .ready-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:14px;font-weight:600;
  letter-spacing:0;text-transform:none;color:var(--sub)}
.sess .ready-skip{color:var(--accentHi);font-weight:700;min-height:var(--hit)}
.sess .ready-c{gap:6px}
.sess .ready-c button{min-height:var(--hit);font-size:13.5px}
.sess .readynote,.sess .painnote{margin:0}
.sess .exalt{margin:0;justify-self:start}

/* NextExercise: secondary, one row. */
/* Next, under the exercise's name: one quiet line, always in view. */
.wexl-nx{grid-column:1/-1;display:flex;align-items:center;gap:var(--s2);max-width:100%;min-height:var(--hit);margin:calc(var(--s1) * -1) 0 0;padding:0;
  border:0;background:none;color:var(--sub);font:inherit;font-size:14px;text-align:start;cursor:pointer}
.wexl-nk{flex:none;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
[dir="rtl"] .wexl-nk{letter-spacing:0;font-size:12.5px}
.wexl-nx b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--text)}
.wexl-nx .gl,.wexl-nx svg{flex:none;width:16px;height:16px;color:var(--dim)}
.wu-then{margin:var(--s2) 0 0;font-size:14px;color:var(--sub)}
.wu-then span{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
[dir="rtl"] .wu-then span{letter-spacing:0;font-size:12.5px}
.wu-then b{color:var(--text)}
.nx{display:grid;grid-template-columns:auto minmax(0,1fr) 20px;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s2) var(--s3);
  border-radius:var(--r4);color:var(--text);text-align:start}
.nx .thumbwrap,.nx .thumb{border-radius:10px}
.nx small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-inline-end:6px}
[dir="rtl"] .nx small{letter-spacing:0;font-size:13px}
.nx b{font-family:var(--display);font-size:16px;font-weight:700}
.nx>span:not(.thumbwrap){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx .gl{width:20px;height:20px;color:var(--dim)}

/* SetHistory: one list, hairlines between rows. Delete leads (settled); the state ends the
   row: a filled tick (done; tap to take it back), the accent ring (now), an empty ring. */
.wsl{display:grid;border-radius:var(--r4);overflow:hidden}
.wsr{display:grid;grid-template-columns:var(--hit) minmax(0,1fr) var(--hit);align-items:center;gap:var(--s1);min-height:52px;
  padding-inline:2px var(--s1);color:var(--sub)}
.wsr+.wsr{border-top:1px solid var(--hair)}
.wsr.did{color:var(--text)}
.wsr.on{background:var(--accent-tint);color:var(--text)}
.wsr .x{width:var(--hit);height:var(--hit);display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:none;color:var(--dim)}
.wsr .x .gl{width:16px;height:16px}
.wsr-t{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.wsr-n{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--text)}
.wsr.pend .wsr-n{color:var(--sub);font-weight:600}
.wsr-v{font-weight:600}
.wsr.on .wsr-v{font-weight:700;color:var(--text)}
.wsr.wkwu .wub{width:20px;height:20px;font-size:11px}
.sess .wsr .wcell{min-width:1.4ch;max-width:6ch;height:auto;padding:0 0 1px;margin:0;border:0;border-bottom:1px dashed var(--border);border-radius:0;
  background:none;color:var(--text);font:inherit;font-weight:700;text-align:center;-moz-appearance:textfield;appearance:textfield}
.sess .wsr .wcell::-webkit-inner-spin-button,.sess .wsr .wcell::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sess .wsr .wcell:focus{outline:none;border-bottom:1px solid var(--accent)}
.wtick{width:28px;height:28px;margin:auto;padding:0;display:grid;place-items:center;border-radius:50%;position:relative;
  border:0;background:var(--ok);color:var(--onOk)}
/* 28px drawn, a 44px target. */
.wsr button.wtick::after{content:"";position:absolute;inset:-8px}
.wtick .gl{width:16px;height:16px;stroke-width:2.6}
.wtick.cur{background:transparent;border:2px solid var(--accent)}
.wtick.off{background:transparent;border:1.5px solid var(--hair-hi)}
.wsr.fresh .wtick{animation:setpop var(--m-pop) var(--e-spring)}
.wsr.ask{grid-template-columns:minmax(0,1fr) auto auto;gap:6px;padding-inline:var(--s4) 6px;background:var(--surface);color:var(--text);
  box-shadow:inset 0 0 0 1px var(--danger)}
.wsr.ask button{min-height:var(--hit);padding:0 var(--s4);border-radius:var(--rpill);font-weight:700;font-size:15px}
.wsr.ask .del{border:1px solid var(--danger);background:transparent;color:var(--danger)}
.wsr.ask .keep{border:1px solid var(--border);background:var(--raised);color:var(--text)}
.sess .bwnote{margin:0}

/* Tools: Skip and Add exercise as tiles; Remove and Something hurts? as quiet links. */
.sess .tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--s2)}
.sess .tools button{min-height:48px;display:flex;align-items:center;justify-content:center;gap:var(--s2);border-radius:var(--r4);
  border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;font-size:14.5px}
.sess .tools .gl{width:18px;height:18px}
.sess .quiet{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s1) var(--s5);margin-bottom:var(--s5)}
.sess .quiet button{min-height:var(--hit);padding:0 var(--s1);border:0;background:none;color:var(--dim);font-size:14px;font-weight:600;
  text-decoration:underline;text-underline-offset:3px}
.sess .quiet button.on{color:var(--warning)}
/* ---- the workout in the mockup's colours (the --wk-* tokens above) ---------------------- */
body.wkflat{background:var(--wk-page)}
.sess{--sub:var(--wk-sub);--dim:var(--wk-dim);--hair:var(--wk-hair)}
.sess .ss-top{background:var(--wk-head);border-bottom-color:var(--wk-rim)}
.sess .ss-back,.sess .ss-more,.sess .ib{background:var(--wk-well);border:1px solid var(--wk-well-rim);color:var(--text)}
.sess .wglass{background:var(--wk-card);border:1px solid var(--wk-rim);border-top-color:var(--wk-rim-hi);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 14px 34px -20px var(--wk-glow),0 0 0 1px rgba(0,0,0,.12)}
.sess .wsc .wstp button,.sess .rb-ctl button,.sess .tools button,.sess .ready-c button,.sess .sc-rpe-c button{
  background:var(--wk-well);border-color:var(--wk-well-rim)}
.sess .wexl .chip.wkwu{background:var(--wk-chip);border-color:var(--wk-chip-rim)}
.sess .wexl .chip{border-color:var(--wk-well-rim)}
.sess button.log{background:linear-gradient(180deg,var(--wk-act-top),var(--wk-act-bot));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1.5px var(--color-action-edge),0 14px 30px -12px var(--wk-act-glow)}
.sess .wsr.on{background:var(--wk-now)}
.sess .wtick{background:var(--wk-tick);color:var(--wk-onTick)}
.sess .wtick.cur{background:transparent;border-color:var(--wk-tick)}
.sess .wtick.off{background:transparent;border:1.5px solid var(--wk-well-rim)}
/* The figures stay white, as in the mockup: the "Suggested" tag above says what they are. */
.sess .wsc .val-n.sg{color:var(--text)}
.sess .rb-bar i,.sess .ss-bar i{background:var(--wk-act-bot)}

.ss-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin:var(--s4) 0 8px}
.ss-act{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 12px;border-radius:var(--r4);
  border:1px solid var(--border);background:var(--raised);color:var(--text);font-weight:600;font-size:14px}
.ss-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--accentHi)}
:root:not(.tch) .ss-act:active,.ss-act.tapd{transform:scale(.97)}
/* The workout's own tools — Replace, Remove, Skip, Add — as one row of equal tiles,
   icon over a one-word label, so four fit a phone without wrapping. The row takes
   however many are offered (Remove and Skip come and go). */
.bwnote{margin:12px 2px 0;font-size:12.5px;line-height:1.45;color:var(--dim)}
/* Today's exercises, from the session title. */
.exl{display:flex;flex-direction:column;gap:8px;margin-bottom:var(--s4)}
.exl-row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;margin:0;
  border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);color:var(--text);
  font:inherit;text-align:start;cursor:pointer}
:root:not(.tch) .exl-row:active,.exl-row.tapd{transform:scale(.99)}
.exl-row.on{border-color:var(--accent-edge);background:var(--accent-tint)}
.exl-n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
  background:var(--surface);color:var(--sub);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.exl-row.on .exl-n{background:var(--accent);color:var(--onAccent)}
.exl-row.did .exl-n{background:var(--ok);color:var(--onOk)}
.exl-n svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.exl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exl-t b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exl-t small{font-size:12.5px;color:var(--dim)}
.exl-cur{flex:none;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accentHi)}
.ss-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin:var(--s4) 0 0}
.ss-tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;min-height:64px;
  padding:8px 4px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);
  color:var(--text);font:inherit;font-weight:600;font-size:13px;line-height:1.15;cursor:pointer;
  transition:transform var(--m-press) var(--e-standard)}
.ss-tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--accentHi)}
.ss-tool span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-tool[data-rmlive] svg{color:var(--danger)}
:root:not(.tch) .ss-tool:active,.ss-tool.tapd{transform:scale(.96)}
.ss-tools+.ss-acts{margin-top:8px}
/* ---- Confirm sheets: centred, compact, pill buttons in sentence case. The ✕ in the
   head is dropped here — Cancel (or "Keep training") sits right beside the choice,
   and a drag or a tap outside still closes a non-destructive one. */
.cfbox .sheethead{border-bottom:none;background:none;margin-bottom:0;padding-bottom:4px;min-height:0}
.cfbox .sheethead .x{display:none}
.cf{text-align:center;padding:6px 8px 4px}
.cf-i{display:grid;place-items:center;width:64px;height:64px;margin:4px auto 16px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.08),rgba(255,255,255,.02) 70%);
  border:1px solid var(--border);box-shadow:0 10px 30px -12px rgba(var(--glow-rgb),.45)}
.cf-i svg{width:28px;height:28px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cf-i.bad svg{stroke:var(--danger)}
.cf h2{font-size:24px;margin:0}
.cf-b{color:var(--dim);font-size:15px;line-height:1.45;margin:8px auto 22px;max-width:30ch}
.cf-acts{display:flex;flex-direction:column;gap:10px}
.cf-acts .btn{margin:0;border-radius:var(--rpill);text-transform:none;letter-spacing:0;font-size:16px;min-height:54px}
.cf-acts .cf-ok{background:linear-gradient(180deg,var(--color-action-fill),var(--accent-deep));
  box-shadow:inset 0 0 0 1.5px var(--color-action-edge),0 10px 26px -12px rgba(var(--glow-rgb),.7),inset 0 1px 0 rgba(255,255,255,.18)}
.cf-acts .cf-no{background:var(--raised);border:1px solid var(--border)}
/* A confirm that deletes (its icon is the bin) asks in the danger colour, which stays
   red in every theme; any other confirm's action is the theme's own primary. */
.cf.bad .cf-acts .cf-ok{background:var(--color-danger-action-fill);color:var(--onDanger);
  box-shadow:0 10px 26px -12px rgba(var(--danger-rgb),.6),inset 0 1px 0 rgba(255,255,255,.18)}
.cf-alt{background:none;border:none;color:var(--accentHi);font-family:inherit;font-weight:600;font-size:15px;
  padding:12px 0 2px;min-height:44px;cursor:pointer}
:root:not(.tch) .cf-alt:active,.cf-alt.tapd{opacity:.6}
.cf-alt.bad{color:var(--danger)}
/* ---- One button language for every sheet and sub-page ------------------------------
   Pills, sentence case, the accent gradient on the primary; .g is the tonal secondary.
   Sheets lose the hairline under their head and gain the app's glow at the top. */
.btn:not(.g):not(.o):not(.ok):not(.danger):not(.d){box-shadow:0 10px 26px -14px rgba(var(--accent-rgb),.75),inset 0 1px 0 rgba(255,255,255,.16)}
.btn.danger{border-radius:var(--rpill)}
.sheethead{border-bottom:none}
.sheethead .x{width:34px;height:34px;flex-basis:34px;background:var(--raised)}
.sheetbox{background:radial-gradient(120% 50% at 50% 0%,rgba(var(--glow-rgb),.10),transparent 60%),var(--bg)}
/* Glass pop-ups (the owner's FitPulse reference: a frosted sheet with the picture behind
   it). Where the browser can blur, a sheet, a dialog and a toast are the page's ground
   made translucent and frosted, so what they open over shows through, softened; the
   veil above a sheet is lighter for the same reason. Without blur they stay solid, as
   above, since translucent without blur only muddies the text. */
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .sheet{background:rgba(var(--bg-rgb),.38)}
  .sheetbox{background:radial-gradient(120% 50% at 50% 0%,rgba(var(--glow-rgb),.12),transparent 60%),rgba(var(--bg-rgb),.74);
    -webkit-backdrop-filter:saturate(160%) blur(30px);backdrop-filter:saturate(160%) blur(30px);
    border-color:var(--card-edge);box-shadow:inset 0 1px 0 var(--hair-hi),0 -18px 48px -12px rgba(0,0,0,.35)}
  .sheetbox.dlgbox{background:rgba(var(--bg-rgb),.80);-webkit-backdrop-filter:saturate(160%) blur(30px);backdrop-filter:saturate(160%) blur(30px);
    box-shadow:0 24px 60px -12px rgba(0,0,0,.5),0 0 0 1px var(--card-edge),inset 0 1px 0 var(--hair-hi)}
  .toast{background:rgba(var(--bg-rgb),.80);-webkit-backdrop-filter:saturate(160%) blur(24px);backdrop-filter:saturate(160%) blur(24px);border-color:var(--card-edge)}
}

/* ---- Rest over (session.js vRest, restDone): built for a glance mid-workout ------- */
#rest .rt2{justify-content:space-between}
.rt2-top{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:auto}
.rt2 .rt-check{width:92px;height:92px;margin:18px 0 14px}
.rt2 .rt-h{margin:0;font-size:clamp(28px,8vw,34px)}
.rt2-next{margin:10px 0 0;font-size:17px;color:var(--text);text-align:center;font-variant-numeric:tabular-nums;opacity:.85}
/* How long ago the rest ran out, counting up (paintOver). Quiet: a number to glance at,
   not a second alarm, so the next action stays the loudest thing on the screen. */
.rt-over{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:10px 0 0}
.rt-over-t{font-family:var(--display);font-size:24px;font-weight:700;color:var(--color-text-primary);font-variant-numeric:tabular-nums}
.rt-over-k{font-size:14px;color:var(--color-text-secondary)}
.rt2-acts{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:100%;max-width:420px;margin:28px auto 0}
.rt2 .rt-go{max-width:none;min-height:68px;border-radius:var(--rpill);font-size:19px;letter-spacing:0;text-transform:none}
.rt2-k{margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
.rt2-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rt2-b{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:var(--rpill);
  background:rgba(28,28,34,.78);border:1px solid var(--hair-hi);color:var(--text);font-family:var(--display);
  font-size:18px;font-weight:700;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform var(--m-press) var(--e-standard)}
.rt2-b.wide{font-size:16px}
.rt2-b svg,.rt2-end svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt2-end{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;margin-top:6px;border-radius:var(--rpill);
  background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accentHi-rgb),.45);color:var(--accentHi);font-family:var(--display);
  font-size:16px;font-weight:700;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .rt2-b:active,.rt2-b.tapd,:root:not(.tch) .rt2-end:active,.rt2-end.tapd{transform:scale(.96)}
[dir="rtl"] .rt2-b svg,[dir="rtl"] .rt2-end svg{transform:scaleX(-1)}
/* The countdown's own labels in the same case as everything else. */
.rt-skip,.rt-main{text-transform:none;letter-spacing:0}

/* ---- Workout complete (sheets.js "done") ------------------------------------------ */
/* Workout complete (workout-spec.md): the ok check, the figures on raised, the record
   card in gold, Done in the log control's style, then the questions under it. */
.wfin{display:grid;gap:var(--s4);justify-items:center;text-align:center;padding-top:var(--s4)}
.wfin-c{width:96px;height:96px;display:grid;place-items:center;border-radius:50%;background:var(--ok);color:var(--onOk)}
.wfin-c svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.wfin-h{margin:0;font-family:var(--display);font-size:30px;font-weight:700}
.wfin-sub{margin:calc(-1 * var(--s3)) 0 0;color:var(--sub)}
.wfin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);width:100%}
.wfin-stats .stat{display:grid;gap:2px;padding:14px 6px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised)}
.wfin-stats b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;white-space:nowrap;color:var(--text)}
.wfin-stats b small{font-size:15px;color:var(--dim)}
.wfin-stats>.stat>small{font-size:13px;font-weight:700;color:var(--dim)}
.wfin-rec{width:100%;display:grid;gap:2px;padding:14px var(--s4);border-radius:var(--r4);border:1.5px solid var(--gold);
  background:var(--raised);text-align:start}
.wfin-rec b{color:var(--gold);font-size:15px}
.wfin-rec span{font-size:16px;font-weight:600;color:var(--text)}
.wfin-up{margin:0;color:var(--sub);font-weight:600}
.wfin-done{width:100%;min-height:76px;display:flex;align-items:center;justify-content:center;padding:0 var(--s5);
  border:0;border-radius:var(--rpill);background:var(--color-action-fill);box-shadow:inset 0 0 0 1.5px var(--color-action-edge);
  color:var(--onAccent);font-family:var(--display);font-size:20px;font-weight:700}
.wfin .wc2-effort{width:100%;margin-top:0}
.wc2{position:relative;text-align:center;padding:8px 4px 0;isolation:isolate}
.wc2-art{position:absolute;z-index:-1;top:-40px;left:50%;width:300px;height:auto;transform:translateX(-50%);opacity:.10;pointer-events:none}
.wc2-medal{display:grid;place-items:center;width:84px;height:84px;margin:6px auto 16px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,var(--accent),var(--accent-deep) 78%);border:1.5px solid var(--accentHi);
  box-shadow:0 0 0 8px rgba(var(--accent-rgb),.10),0 18px 40px -14px rgba(var(--glow-rgb),.8)}
.wc2-medal svg{width:38px;height:38px;fill:none;stroke:var(--onAccent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wc2-h{margin:0;font-size:28px}
.wc2-sub{margin:6px 0 20px;color:var(--dim);font-size:15px}
.wc2-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r4);
  background:var(--raised);overflow:hidden}
.wc2-stats>div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px}
.wc2-stats>div+div{border-inline-start:1px solid var(--border)}
.wc2-stats b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.wc2-stats small{font-size:13px;font-weight:600;color:var(--dim);margin-inline-start:3px}
.wc2-stats>div>span{font-size:12px;color:var(--dim)}
.wc2-hl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:12px 14px;border-radius:var(--rpill);
  background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accentHi-rgb),.3);font-size:14px;font-weight:600}
.wc2-acts{margin-top:22px}
.wc2-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.wc2-row .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- Edit a logged workout (sheets.js "sessedit") ---------------------------------- */
.se-top{margin-bottom:14px}
.se-k{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accentHi)}
.se-top h2{margin:4px 0 12px;font-size:24px}
.se-date{display:inline-flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:var(--rpill);
  background:var(--raised);border:1px solid var(--border);font-size:14px;color:var(--dim)}
.se-date input{width:auto;min-height:38px;margin:0;padding:0 12px;border-radius:var(--rpill);background:var(--surface);color-scheme:dark}
.se-ex{margin-top:12px;padding:14px;border-radius:var(--r4);background:var(--raised);border:1px solid var(--border)}
.se-exh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.se-exh h3{margin:0;font-size:16px;min-width:0}
.se-rm{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);background:none;color:var(--dim)}
.se-rm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.se-hd,.se-row{display:grid;grid-template-columns:28px minmax(0,1fr) 16px minmax(0,1fr) 40px;align-items:center;gap:8px}
.se-hd{margin:10px 0 4px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:center}
.se-row{margin-top:8px}
.se-n{font-family:var(--display);font-weight:800;color:var(--accentHi);text-align:center}
.se-row input{margin:0;min-height:46px;text-align:center;font-size:17px;font-weight:700;border-radius:14px;font-variant-numeric:tabular-nums}
.se-x{color:var(--dim);text-align:center}
.se-del{width:40px;height:40px;border-radius:50%;border:none;background:none;color:var(--dim);font-size:15px}
.se-empty{text-align:center;color:var(--dim);margin:24px 0}
.se-acts{margin-top:20px}
.se-edit{display:block;width:100%;margin-top:12px;min-height:44px;border-radius:var(--rpill);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-weight:600;font-size:14px}
/* ---- Train: My Training and the library as two equal tiles ------------------------- */
.ttiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.ttile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;min-height:128px;
  padding:16px;border-radius:var(--r4);border:1px solid var(--border);text-align:start;color:var(--text);overflow:hidden;
  background:radial-gradient(90% 70% at 100% 0%,rgba(var(--glow-rgb),.14),transparent 70%),var(--raised);
  transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .ttile:active,.ttile.tapd{transform:scale(.97)}
.ttile:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.ttile-i{display:grid;place-items:center;width:40px;height:40px;margin-bottom:auto;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);color:var(--sub)}
.ttile-i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ttile-i .ico{width:18px;height:18px;background:currentColor}
.ttile-n{margin-top:14px;font-family:var(--display);font-weight:800;font-size:16px}
.ttile-s{font-size:12.5px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- Day details (sheets.js "dayview") ----------------------------------------------- */
.dv-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.dv-stats b{font-size:19px}
.dv-h{margin:22px 0 10px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dv-card{display:block;width:100%;margin-top:10px;padding:14px 16px;border-radius:var(--r4);border:1px solid var(--border);
  background:var(--raised);color:var(--text);text-align:start;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) button.dv-card:active,button.dv-card.tapd{transform:scale(.98)}
.dv-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dv-row b{font-family:var(--display);font-size:15.5px}
.dv-k{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px}
.dv-it{margin-top:6px;font-size:13.5px;color:var(--dim)}
.dv-it span:last-child{font-variant-numeric:tabular-nums}
.dv-edit{color:var(--accentHi);font-weight:600}
.dv-none{margin:4px 0 0;color:var(--dim);font-size:14px}
/* ---- Every sheet, one structure (after My Training) ---------------------------------
   Kicker, large title, subtitle; grouped rows in one rounded card; labels in the same
   small caps; the head carries only the grab and the close, with no band behind it. */
.sheethead{background:transparent}
.shh,.se-top{margin:0 0 18px}
.shk,.se-k{display:block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accentHi);margin-bottom:6px}
.shh h2,.se-top h2{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.15;margin:0}
.shsub{color:var(--dim);font-size:14.5px;line-height:1.45;margin:6px 0 0}
.afhead-t h2{font-size:24px}
.sheetbox .list{border-radius:var(--r4)}
.sheetbox .list .item{min-height:58px;padding-top:14px;padding-bottom:14px}
.sheetbox .sec,.sheetbox .overline,.sheetbox .aflbl{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--dim)}
.sheetbox .card{border-radius:var(--r4)}
.se-date{margin-top:12px}
.sheetbox input:not([type=checkbox]):not([type=radio]):not([type=range]),.sheetbox select,.sheetbox textarea{border-radius:14px}
/* Intervals: rounds × work / rest on one line. */
.act-iv{display:flex;align-items:center;gap:8px}
.act-iv input{flex:1;min-width:0;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.act-iv span{color:var(--dim);font-weight:700}
.act-iv i{font-style:normal;color:var(--dim);font-size:13px}
.act-ivon{display:block;margin:14px 0 0}
/* Storage could not open: said once, at the top, calmly. */
.warnbar{display:flex;flex-direction:column;gap:4px;margin:0 0 14px;padding:12px 14px;border-radius:var(--r4);
  border:1px solid rgba(var(--gold-rgb),.5);background:rgba(var(--gold-rgb),.08);font-size:13px;line-height:1.45;color:var(--dim)}
.warnbar b{color:var(--text);font-size:14px}
/* ---- Progress: the weight trend against the goal ----------------------------------- */
.pgtrend-r{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pgtrend .pgbig{font-size:30px;white-space:nowrap}
.pgtrend-g{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pgtrend-g b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pgtrend-g small{font-size:12px;color:var(--dim)}
.pgtrend.ok .pgnote{color:var(--ok)}
/* ---- Train: a lighter week, suggested or running ----------------------------------- */
.dlcard{margin-top:14px;padding:16px;border-radius:var(--r4);border:1px solid rgba(var(--gold-rgb),.45);
  background:radial-gradient(90% 90% at 100% 0%,rgba(var(--gold-rgb),.12),transparent 70%),var(--raised)}
.dlcard-h{display:flex;align-items:center;gap:10px}
.dlcard-h b,.dlcard-t b{font-family:var(--display);font-size:16px}
.dlcard p{margin:8px 0 12px;color:var(--dim);font-size:14px;line-height:1.45}
.dlcard-i{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:50%;
  background:rgba(var(--gold-rgb),.14);color:var(--gold)}
.dlcard-i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dlcard-a{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.dlcard-a .btn{margin:0}
.dlcard-later{align-self:center;min-height:44px;padding:0 16px;background:none;border:none;color:var(--dim);font-size:14px;font-weight:600}
.dlcard.on{display:flex;align-items:center;gap:12px;padding:12px 14px}
.dlcard-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dlcard-t span{font-size:13px;color:var(--dim)}
.dlcard-x{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:var(--rpill);border:1px solid var(--border);
  background:none;color:var(--text);font-size:13px;font-weight:600}
/* ---- Train: where the training block stands ------------------------------------------
   Four segments, one per week: done ones filled, this one in the accent, the lighter
   week (the fourth) drawn in the deload card's gold so the two read as one idea. */
.blk{margin-top:14px;padding:14px 16px;border-radius:var(--r4);border:1px solid var(--color-border-subtle);background:var(--color-surface-1)}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.blk-h b{font-family:var(--display);font-size:15px;letter-spacing:.01em}
.blk-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 8px}
.blk-bar i{height:6px;border-radius:2px;background:var(--color-surface-well)}
.blk-bar i.done{background:rgba(var(--accent-rgb),.45)}
.blk-bar i.on{background:var(--color-action-primary)}
.blk-bar i.lt{background:rgba(var(--gold-rgb),.25)}
.blk-bar i.lt.on{background:var(--gold)}
.blk-l{margin:0;font-size:14px;color:var(--color-text-secondary);line-height:1.45}
.blk-m{margin:6px 0 0;font-size:13px;color:var(--color-text-tertiary);line-height:1.4}
.blk.light{border-color:rgba(var(--gold-rgb),.45);background:radial-gradient(90% 90% at 100% 0%,rgba(var(--gold-rgb),.10),transparent 70%),var(--color-surface-1)}
/* The complete sheet's second question: three answers, not five. */
.ready-c.feel-c{grid-template-columns:repeat(3,minmax(0,1fr))}
.wc2-feel-n{margin:8px 0 0;font-size:12px;color:var(--color-text-tertiary);line-height:1.4}
/* ---- Train: switch the day's workout ----------------------------------------------- */
.thero2-swap{position:absolute;top:14px;inset-inline-end:14px;z-index:2;display:flex;align-items:center;gap:6px;
  min-height:36px;padding:0 14px;border-radius:var(--rpill);border:1px solid var(--hair-hi);
  background:rgba(var(--bg-rgb),.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--text);font-size:13px;font-weight:700;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .thero2-swap:active,.thero2-swap.tapd{transform:scale(.95)}
.thero2-swap svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thero2:has(.thero2-swap) .thero2-t{padding-inline-end:86px}
.trow.on{background:rgba(var(--accent-rgb),.08)}
.trow.on .trow-n{color:var(--accentHi)}
/* ---- Exercise library (train.js vLibrary) and exercise sheet ------------------------ */
.libhero{position:relative;isolation:isolate;margin:0 0 14px;padding:18px 16px 16px;border-radius:var(--r5);
  border:1px solid var(--border);overflow:hidden;
  background:radial-gradient(90% 80% at 100% 0%,rgba(var(--glow-rgb),.18),transparent 65%),var(--raised)}
.libhero-art{position:absolute;z-index:-1;top:-30px;inset-inline-end:-40px;width:210px;height:auto;opacity:.12;pointer-events:none}
/* ---- The drawings (js/ui/art.js) ----------------------------------------------
   The mark's single red stroke, a fainter second line, a few embers, a soft glow.
   Placement is the screen's own rule; this is only how a line looks and arrives. */
.art{display:block;overflow:visible;fill:none;stroke:var(--accentHi);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;
  filter:drop-shadow(0 0 6px var(--accent-glow))}
.art .a{stroke:url(#artStroke) var(--accentHi);stroke-width:2}
.art .a.c{fill:url(#artFill) none}
.art .b{opacity:.42;stroke-width:1.2}
.art .e{fill:var(--accentHi);stroke:none;opacity:.8}
/* Layers of a scene: hills filled with the accent's glass, a glowing disc. */
.art .h1,.art .h2,.art .h3{stroke:none;fill:url(#artHill) none}
.art .h1{opacity:.45}.art .h2{opacity:.7}.art .h3{opacity:1}
.art .ridge{stroke:url(#artStroke) var(--accentHi);stroke-width:1.3;opacity:.8}
.art .dsk{stroke:none;fill:url(#artGlow) none}
.art.draw .a.c,.art.draw .h1,.art.draw .h2,.art.draw .h3,.art.draw .dsk{animation:artDraw 1.6s var(--e-decel) forwards,artFillIn 1.4s var(--e-standard) both}
@keyframes artFillIn{from{fill-opacity:0}to{fill-opacity:1}}
.art .lvl{stroke-width:2.6;opacity:1}
.art.draw path{stroke-dasharray:1 1;stroke-dashoffset:1;animation:artDraw 1.6s var(--e-decel) forwards}
.art.draw path.b{animation-delay:.18s}
.art.draw .sword path{animation-delay:.3s}
.art.draw .e{opacity:0;animation:artEmber .9s var(--e-standard) .9s forwards}
@keyframes artDraw{to{stroke-dashoffset:0}}
@keyframes artEmber{to{opacity:.8}}
.art .sword{transition:transform var(--m-screen) var(--e-ios)}
/* On a button: at the far edge, behind the label, faded out toward it. One per big tile
   or build button, never on a button whose job is a number, never on the main action.
   The button isolates so the drawing paints over its background and under its text. */
.ttile,.bnew{position:relative;isolation:isolate;overflow:hidden}
.btn-art{position:absolute;z-index:-1;inset-inline-end:-6px;top:-4px;width:84px;height:auto;opacity:.38;
  -webkit-mask:linear-gradient(200deg,#000 35%,transparent 90%);mask:linear-gradient(200deg,#000 35%,transparent 90%)}
/* A wide button: in the chevron's zone at the far end, and the text stops short of it. */
.ttile.wide .btn-art,.bnew .btn-art{width:88px;top:50%;inset-inline-end:2px;transform:translateY(-50%);opacity:.34;
  -webkit-mask:linear-gradient(90deg,transparent,#000 60%);mask:linear-gradient(90deg,transparent,#000 60%)}
.bnew:has(.btn-art) .bnew-t,.ttile.wide:has(.btn-art) .ttile-tx{padding-inline-end:28px}
[dir="rtl"] .btn-art{transform:scaleX(-1)}
[dir="rtl"] .ttile.wide .btn-art,[dir="rtl"] .bnew .btn-art{transform:translateY(-50%) scaleX(-1)}
@media (prefers-reduced-motion:reduce){.art.draw path{animation:none;stroke-dashoffset:0}.art.draw .e{animation:none;opacity:.8}}
body.noanim .art.draw path{animation:none;stroke-dashoffset:0}
body.noanim .art.draw .e{animation:none;opacity:.8}
/* Food. Today's loaf and frond sit at the header's far edge, clear of the title. */
.fthead{position:relative;isolation:isolate}
.fthead-art{position:absolute;z-index:-1;inset-inline-end:-6px;top:-10px;width:118px;height:auto;opacity:.75}
[dir="rtl"] .fthead-art{transform:scaleX(-1)}
/* The water's strands, the day's share bright. */
.fwater-art{margin:10px -4px -2px}
.fwater-art .art{width:100%;height:30px}
.art-wave .lvl{animation:none!important;stroke-dashoffset:0!important;transition:stroke-dasharray var(--m-screen) var(--e-ios)}
[dir="rtl"] .fwater-art .art{transform:scaleX(-1)}
/* A saved meal's + : one tap logs it whole. */
.dquick{flex:0 0 52px;display:grid;place-items:center;padding:0;background:none;border:none;color:var(--accentHi)}
.dquick svg{width:30px;height:30px;padding:7px;border-radius:50%;fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent-edge)}
:root:not(.tch) .dquick:active svg,.dquick.tapd svg{transform:scale(.92)}
/* An empty state with a drawing in place of the small icon. */
.artempty{padding-top:18px}
.empty-art{width:132px;height:auto;margin:0 auto 6px}
/* Targets: the gauge and its sword over today's numbers. */
.tghero{text-align:center;padding-top:14px}
.tghero-art{width:210px;max-width:70%;height:auto;margin:0 auto 4px}
.tghero-n{display:flex;align-items:baseline;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}
.tghero-n b{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em}
.tghero-n span{color:var(--dim);font-size:14px}
.tghero-s{margin:4px 0 0;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.tghero-s.over{color:var(--gold)}
.tgsug-r{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
.tgsug-r b{display:block;font-family:var(--display);font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.tgsug-r b.a{color:var(--text)}
.tgsug-r small{color:var(--dim);font-size:12px}
.tgsug .pgnote{margin:0;color:var(--ok)}
/* Home. The time of day's drawing rises behind the greeting's far side. */
.hgreet{position:relative;isolation:isolate}
.hgreet-art{position:absolute;z-index:-1;inset-inline-end:-10px;top:-18px;width:190px;height:auto;opacity:.7;
  -webkit-mask-image:radial-gradient(130% 115% at 100% 0%,#000 42%,transparent 78%);mask-image:radial-gradient(130% 115% at 100% 0%,#000 42%,transparent 78%)}
[dir="rtl"] .hgreet-art{-webkit-mask-image:radial-gradient(130% 115% at 0% 0%,#000 42%,transparent 78%);mask-image:radial-gradient(130% 115% at 0% 0%,#000 42%,transparent 78%)}
.hnote.gold{border-color:var(--gold)}
.hnote.gold h3{color:var(--gold)}
.hstack>.thero2,.hstack>.twk{margin:0}
/* Four tiles, each one tap. */
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.htile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:112px;padding:14px;
  border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);color:var(--text);text-align:start;
  box-shadow:var(--shadow-card);transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .htile:active,.htile.tapd{transform:scale(.97)}
.htile-i{display:grid;place-items:center;width:32px;height:32px;margin-bottom:6px;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);color:var(--sub)}
.htile-i svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Training's two tiles: the icon sits in a round glass button at the top corner, as
   the reference's stat tiles have it. With a goal (steps) a ring runs round it, the arc
   its share of the goal in the accent, and at the goal a "Goal met" pill in ok. */
.htile.ringed{position:relative}
.htile.ringed .htile-i{position:absolute;top:12px;inset-inline-end:12px;width:46px;height:46px;margin:0;
  background:var(--well);box-shadow:inset 0 0 0 1px var(--card-edge);color:var(--accentHi)}
.htile.ringed .htile-i svg:not(.htile-ring){width:19px;height:19px}
.htile-ring{position:absolute;inset:0;width:100%!important;height:100%!important;transform:rotate(-90deg);stroke-linecap:round}
[dir="rtl"] .htile-ring{transform:rotate(-90deg) scaleY(-1)}
.htile-ring circle{fill:none;stroke-width:4}
.htile-ring .t{stroke:var(--bar-track)}
.htile-ring .a{stroke:var(--accent)}
.htile.ringed .htile-k{margin-top:10px}
.htile-met{margin-top:6px;padding:3px 9px;border-radius:var(--rpill);background:var(--okSoft);color:var(--ok);font-size:11.5px;font-weight:700}
.htile-k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.htile-v{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.htile-v b{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.01em}
.htile-v small{font-size:12.5px;color:var(--dim)}
.htile-s{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.htile.water .htile-s{color:var(--accentHi);font-weight:700}
/* The water tile, split: two buttons stacked in the tile's frame, each the full width.
   The tile itself no longer presses as one; each half lights on its own. */
.htile.hsplit{padding:0;gap:0;overflow:hidden}
:root:not(.tch) .htile.hsplit:active,.htile.hsplit.tapd{transform:none}
.hsplit-b{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
  flex:1 1 50%;margin:0;border:none;background:none;color:inherit;text-align:start;font:inherit;
  transition:background var(--m-press) var(--e-standard)}
.hsplit-top{padding:14px 14px 4px}
.hsplit-bot{padding:4px 14px 14px;justify-content:flex-end}
:root:not(.tch) .hsplit-b:active,.hsplit-b.tapd{background:var(--surface)}
.hsplit-top .htile-i{margin-bottom:6px}
.hsplit-m{position:absolute;top:14px;inset-inline-end:14px;display:grid;place-items:center;width:32px;height:32px;
  border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);
  color:var(--sub);font-size:20px;font-weight:600;line-height:1}
:root:not(.tch) .hsplit-top:active .hsplit-m,.hsplit-top.tapd .hsplit-m{color:var(--text)}
.hsplit-top:disabled{opacity:1}
.hsplit-top:disabled .hsplit-m{opacity:.35}
/* Progress: the trend running into the mane, where the banner's photo was. */
.pgbanner-art{position:absolute;z-index:-1;inset-inline-start:8px;top:50%;width:34%;height:auto;transform:translateY(-50%);opacity:.9}
[dir="rtl"] .pgbanner-art{transform:translateY(-50%) scaleX(-1)}
.pgbody-art{width:64px;height:auto;margin:10px auto 0;opacity:.8}
.phcal{margin-bottom:18px}
.phcal .dbday:disabled{opacity:.3}
/* Train → Today: the recovery check-in. */
.rchk{margin-top:14px;padding:14px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised)}
.rchk-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rchk-h b{font-family:var(--display);font-size:15px}
.rchk-x{min-height:36px;padding:0 4px;background:none;border:none;color:var(--dim);font-size:13px}
.rchk-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.rchk-r>span{font-size:13px;color:var(--sub);flex:0 0 auto}
.rchk-c{display:flex;gap:6px}
.rchk-c button{min-width:44px;min-height:36px;padding:0 10px;border-radius:var(--rpill);border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--text);font-size:13px;font-weight:600}
.rchk-c button.on{background:var(--accent-tint);border-color:var(--accent-edge);color:var(--accentHi)}
.rchk-more{margin-top:6px}
.bauto{margin-top:10px}
.bauto .bnew-i{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent-edge)}
.bauto .bnew-i svg{fill:var(--accentHi);stroke:none}
.dset{color:var(--sub)}
.libhero .libhead{margin-bottom:14px}
.libhero .shk{margin-bottom:4px}
.libhero h1{font-size:30px}
.libq{margin-bottom:0}
.libq input{height:52px;border-radius:var(--rpill);padding-inline:46px 46px;font-size:16px;background:var(--bg);
  -webkit-appearance:none;appearance:none}
.libq input::-webkit-search-cancel-button,.libq input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.libq input:focus{border-color:var(--accentHi);box-shadow:0 0 0 3px rgba(var(--accentHi-rgb),.18);outline:none}
.libq .ico-search{inset-inline-start:18px}
/* ---- Food: what the body needs (js/ui/bodyneeds.js) --------------------------------
   The reference's body diagram in the theme's pen: a headline, the figure with the four
   nodes on an ellipse around it, the one furthest behind lit in the accent; then what
   is left of it and three foods for it, drawn on plates. */
.fbody{position:relative;margin:var(--s4) 0 0;padding:18px 16px 16px;border-radius:var(--r5);border:1px solid var(--card-edge);
  background:radial-gradient(90% 60% at 50% 34%,rgba(var(--accent-rgb),.12),transparent 70%),var(--card);box-shadow:var(--shadow-card);overflow:hidden}
.fbody-h{margin:6px 0 6px;font-family:var(--display);font-size:25px;line-height:1.15;max-width:16ch}
.fbody-s{margin:0;font-size:14px;line-height:1.5;color:var(--sub);max-width:34ch}
.fbody-d{position:relative;width:100%;max-width:340px;aspect-ratio:340/300;margin:14px auto 4px}
.fbody-orbit{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fbody-orbit ellipse{fill:none;stroke:var(--accentHi);stroke-width:1;opacity:.35;stroke-dasharray:2 5}
.fbody-orbit ellipse.in{opacity:.16;stroke-dasharray:none}
.fbody-orbit circle{fill:var(--accentHi);opacity:.7}
.fbody-fig{position:absolute;left:50%;top:2%;height:96%;width:auto;transform:translateX(-50%);opacity:.9;
  filter:drop-shadow(0 0 14px rgba(var(--accent-rgb),.25))}
.fbn{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;width:96px;margin-top:-28px;margin-inline-start:-48px;text-align:center}
.fbn-c{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;border:1px solid var(--card-edge);
  background:var(--raised);color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fbn-c .gl{width:24px;height:24px}
.fbn-k{margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
[dir="rtl"] .fbn-k{letter-spacing:0;font-size:12px}
.fbn b{font-family:var(--display);font-size:17px;font-weight:800;color:var(--figure);font-variant-numeric:tabular-nums}
.fbn.full b{color:var(--ok)}
.fbn.on .fbn-c{width:68px;height:68px;margin-top:-6px;background:var(--accent);color:var(--onAccent);border-color:transparent;
  box-shadow:0 0 0 7px var(--accent-tint),0 0 34px var(--accent-glow)}
.fbn.on .fbn-c .gl{width:28px;height:28px;stroke-width:2}
.fbn.on .fbn-k,.fbn.on b{color:var(--accentHi)}
.fbody-need{display:flex;flex-direction:column;gap:8px;margin:10px 0 0;padding:14px;border-radius:var(--r4);
  border:1px solid var(--card-edge);background:var(--well)}
.fbody-nk{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.fbody-nk b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;color:var(--accentHi);font-variant-numeric:tabular-nums}
.fbody-nk b small{font-size:20px}
.fbody-pill{padding:5px 11px;border-radius:var(--rpill);border:1px solid var(--accent-edge);font-size:12.5px;font-weight:700;color:var(--text)}
.fbody-need p{margin:0;font-size:14px;line-height:1.5;color:var(--sub)}
.fsug-h{margin:16px 0 10px}
.fsug{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fsug-t{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;margin:0;padding:8px 8px 10px;
  border-radius:var(--r4);border:1px solid var(--card-edge);background:var(--card);color:var(--text);font:inherit;text-align:start;
  transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .fsug-t:active,.fsug-t.tapd{transform:scale(.96)}
.fsug-art{display:grid;place-items:center;width:100%;aspect-ratio:4/3;margin-bottom:6px;border-radius:calc(var(--r4) - 4px);
  background:radial-gradient(60% 60% at 50% 55%,rgba(var(--accent-rgb),.14),transparent 72%),var(--well)}
.fsug-art .art{width:88%;height:auto}
.fsug-n{max-width:100%;font-size:13.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.fsug-v{font-size:12.5px;font-weight:700;color:var(--accentHi)}
.fsug-s{font-size:11px;color:var(--dim)}
.fbody-glass{margin:12px 0 0;gap:8px}
.fbody-glass .gl{width:18px;height:18px}
.fnoticed{display:flex;align-items:flex-start;gap:12px;margin:12px 0 0;padding:14px 16px;border-radius:var(--r4);
  border:1px solid var(--card-edge);background:var(--card)}
.fnoticed-i{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--accent-edge);color:var(--accentHi)}
.fnoticed-i .gl{width:22px;height:22px}
.fnoticed b{display:block;font-size:15px}
.fnoticed p{margin:3px 0 0;font-size:13.5px;line-height:1.5;color:var(--sub)}
.btn.fbuild{margin:12px 0 0;gap:8px;border-color:var(--accent-edge);color:var(--accentHi)}
.btn.fbuild .gl{width:18px;height:18px}
[dir="rtl"] .btn.fbuild .gl{transform:scaleX(-1)}
/* ---- Running mode (js/ui/run.js) ------------------------------------------------
   The reference's running screen in the theme's dark: the route on a quiet grid, the
   time large, the distance, and calories and pace either side of the round pause. The
   screen fills the page edge to edge (it is a focus mode; the dock is away). */
.run{position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:100dvh;
  margin:calc(-20px - env(safe-area-inset-top)) calc(-1 * var(--gutter)) 0;
  padding:calc(14px + env(safe-area-inset-top)) var(--gutter) calc(24px + env(safe-area-inset-bottom));
  background:var(--ground),var(--bg);color:var(--text)}
.run-top{display:flex;align-items:center;gap:10px}
.run-x{display:grid;place-items:center;flex:none;width:44px;height:44px;padding:0;border-radius:50%;
  border:1px solid var(--card-edge);background:var(--card);color:var(--text)}
.run-x svg,.run-play svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.run-h{flex:1;font-family:var(--display);font-size:22px;font-weight:800}
.run-gps{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rpill);
  border:1px solid var(--card-edge);background:var(--card);font-size:12px;font-weight:700;color:var(--sub)}
.run-gps::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dim)}
.run-gps.on::before{background:var(--ok);box-shadow:0 0 0 3px var(--okSoft)}
.run-gps.weak::before,.run-gps.wait::before{background:var(--warning);animation:wbPulse 1.6s ease-in-out infinite}
.run-gps.denied::before,.run-gps.off::before{background:var(--danger)}
.run-map{position:relative;margin:14px calc(-1 * var(--gutter)) 0;height:min(46vh,340px);height:min(46dvh,340px);overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 82%,transparent);mask-image:linear-gradient(180deg,transparent,#000 12%,#000 82%,transparent)}
.run-map svg{display:block;width:100%;height:100%}
/* The drawn city (js/ui/runmap.js): streets are the ground showing between blocks,
   the blocks a shade lighter, buildings lighter again; water and parks are the
   theme's own tints. The route is the only thing in the accent. */
.rm-bg{fill:var(--bg)}
.rm-blk rect{fill:rgba(255,255,255,.035)}
.rm-bld rect{fill:rgba(255,255,255,.055)}
.rm-park rect{fill:var(--map-park)}
.rm-tree circle{fill:var(--map-park);opacity:.9}
.rm-river{fill:none;stroke:var(--map-water);stroke-linecap:round}
.rm-bank{fill:none;stroke:rgba(255,255,255,.04);stroke-linecap:round}
.rm-ripple{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1;stroke-dasharray:2 7}
.rm-av path{fill:none;stroke:rgba(255,255,255,.07)}
/* The other grounds (js/ui/runmap.js): a park for a walk, the countryside for a ride,
   hills for a hike. The same few tones of the theme as the city. */
.rm-park path{fill:var(--map-park)}
.rm-pond path{fill:var(--map-water)}
.rm-path path{fill:none;stroke:rgba(255,255,255,.08);stroke-linecap:round;stroke-linejoin:round}
.rm-field .f0{fill:rgba(255,255,255,.03)}
.rm-field .f1{fill:rgba(255,255,255,.06)}
.rm-field .f2{fill:var(--map-park)}
.rm-hedge path{fill:none;stroke:var(--map-park);opacity:.9}
.rm-road path{fill:none;stroke:rgba(255,255,255,.075);stroke-linecap:round}
.rm-roadc path{fill:none;stroke:rgba(255,255,255,.15);stroke-width:1;stroke-dasharray:6 7}
.rm-contour path{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1}
.rm-contour.ix path{stroke:rgba(255,255,255,.13);stroke-width:1.5}
.rm-stream path{fill:none;stroke:var(--map-water);stroke-linecap:round;stroke-linejoin:round}
.rm-peak path{fill:rgba(255,255,255,.24)}
[data-theme="light"] .trun-map .rm-field .f0{fill:rgba(0,0,0,.025)}
[data-theme="light"] .trun-map .rm-field .f1{fill:rgba(0,0,0,.045)}
[data-theme="light"] .trun-map .rm-field .f2{fill:var(--map-park)}
[data-theme="light"] .trun-map .rm-path path,[data-theme="light"] .trun-map .rm-road path{stroke:rgba(255,255,255,.75)}
[data-theme="light"] .trun-map .rm-roadc path{stroke:rgba(0,0,0,.14)}
[data-theme="light"] .trun-map .rm-contour path{stroke:rgba(0,0,0,.09)}
[data-theme="light"] .trun-map .rm-contour.ix path{stroke:rgba(0,0,0,.16)}
[data-theme="light"] .trun-map .rm-peak path{fill:rgba(0,0,0,.25)}
[data-theme="light"] .trun-map .rm-blk rect{fill:rgba(0,0,0,.045)}
[data-theme="light"] .trun-map .rm-bld rect{fill:rgba(0,0,0,.06)}
[data-theme="light"] .trun-map .rm-av path{stroke:rgba(255,255,255,.7)}
[data-theme="light"] .trun-map .rm-bank{stroke:rgba(255,255,255,.5)}
.run-map .rt{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.run-map .rt-glow{fill:none;stroke:var(--accent);stroke-width:16;stroke-linecap:round;stroke-linejoin:round;opacity:.2}
.run-map .rt-hi{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.run-map .km circle{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.run-map .km text{fill:var(--text);font:800 9px/1 var(--display);text-anchor:middle}
.run-map .st{fill:var(--bg);stroke:var(--accent);stroke-width:3}
.run-map .now{fill:var(--accent);stroke:var(--bg);stroke-width:2.5}
.run-map .now-r{fill:rgba(var(--accent-rgb),.22);stroke:none;transform-box:fill-box;transform-origin:center;animation:runPulse 2s ease-out infinite}
.run.paused .now-r{animation:none;opacity:0}
@keyframes runPulse{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
body.noanim .run-map .now-r,body.noanim .run-gps::before{animation:none}
@media (prefers-reduced-motion:reduce){.run-map .now-r,.run-gps::before{animation:none}}
.run-big{display:flex;flex-direction:column;align-items:center;margin-top:-6px}
.run-big b{font-family:var(--display);font-size:clamp(52px,17vw,72px);font-weight:800;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.run-big span{margin-top:6px;font-size:13px;color:var(--sub)}
.run.paused .run-big b{color:var(--dim)}
.run-mid{display:flex;flex-direction:column;align-items:center;margin-top:14px}
.run-pin{display:grid;place-items:center;width:40px;height:40px;margin-bottom:6px;border-radius:50%;border:1px solid var(--card-edge);background:var(--card);color:var(--accentHi)}
.run-pin .gl{width:19px;height:19px}
.run-mid b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.run-mid>span:last-child{font-size:12.5px;color:var(--sub)}
.run-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:18px}
.run-pill{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 12px 8px 8px;border-radius:var(--rpill);
  border:1px solid var(--card-edge);background:var(--card)}
.run-pi{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--well);color:var(--accentHi)}
.run-pi .gl{width:17px;height:17px}
.run-pt{display:flex;flex-direction:column;min-width:0}
.run-pt span{font-size:11px;color:var(--dim)}
.run-pt b{font-family:var(--display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.run-play{display:grid;place-items:center;width:72px;height:72px;padding:0;border-radius:50%;border:0;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--onAccent);
