.fitemrow-x:active{background:var(--accent);color:var(--onAccent)}
.fitemrow-x .ico-trash{width:20px;height:20px;flex-basis:20px}

/* ================= Rest — canvas screen 5, set completion (node 2:1149)
   The rest surface already existed; this is the frame applied to it. What the frame
   adds is the confirmation banner, the smaller ring, and controls that are icons
   rather than words. What it leaves out — the total beside the digits, the superset
   label, the RPE target — is kept, because each is a figure the frame had no data
   for and the screen is the only place it appears. */
.ico-check{--ico:url(icons/check.svg)}
.ico-pause{--ico:url(icons/pause.svg)}

/* "SET 2 COMPLETE" — the receipt for the set just logged, which the surface never
   gave before. It sits at the top edge, out of the timer's way. */
.restbanner{position:absolute;top:0;left:0;right:0;height:44px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--okSoft);color:var(--ok);
  font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.04em}
.restbanner{text-transform:uppercase}
.restbanner .ico-check{width:18px;height:18px;flex-basis:18px}
/* The banner and the footer are pinned to the edges, so the centred column reserves
   their height rather than sliding under them on a short screen. */
.restwrap:not(.done){padding-top:68px;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-y:auto;
  /* The frame packs the scaffold under the banner and pins the footer, rather than
     centring the column — centred, the reserved footer space pushed everything high
     and left a gap under the banner. */
  justify-content:flex-start}
.restwrap.done .restbanner{display:none}

.restwrap:not(.done) .restlabel{color:var(--dim);letter-spacing:.14em;font-size:12px}
.restwrap:not(.done) .restsub{color:var(--text);font-size:16px;font-weight:700;
  font-family:var(--display)}

/* 170px ring inside a 180px box, as the frame draws it. */
.ringwrap{position:relative;width:180px;height:180px;margin:32px 0}
.ringwrap svg{width:180px;height:180px;transform:rotate(-90deg);display:block}
.restdig{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1;
  font-family:var(--display);font-variant-numeric:tabular-nums}
.resttot{font-size:11px;color:var(--dim);margin-top:2px;text-transform:uppercase;
  letter-spacing:.06em;font-variant-numeric:tabular-nums}

.restctl{display:flex;align-items:center;gap:16px;margin-top:0}
/* "−30s" begins with a neutral character, which an RTL paragraph reorders to "30s−".
   The pills keep their own direction; their positions still mirror with the row. */
.restctl .rbtn:not(.main){direction:ltr}
/* The ±30s pills of the frame: shorter and lighter than the button they replace. */
.restwrap:not(.done) .rbtn{height:44px;min-width:66px;padding:0 16px;border-radius:22px;
  font-size:14px}
/* Scoped away from .done, whose one button is a wide "I am ready" pill and would
   otherwise be turned into a 60px circle by this rule. */
.restwrap:not(.done) .rbtn.main{width:60px;min-width:60px;height:60px;border-radius:30px;
  padding:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 26px rgba(196,30,42,.34)}
.restwrap:not(.done) .rbtn.main .ico{width:24px;height:24px;flex-basis:24px}

.upnext{margin-top:32px;border-radius:8px;padding:16px}
.upnext .ul{font-size:11px;letter-spacing:.06em;color:var(--dim);font-weight:400}
.upnext .uv{font-size:16px;font-weight:700;font-family:var(--display)}

/* The frame seats the skip link in its own bordered footer at the foot of the screen
   rather than floating it under the card. */
.restfoot{position:absolute;left:0;right:0;bottom:0;padding:24px 24px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);display:flex;justify-content:center}
.restwrap.done .restfoot{display:none}
.restskip{margin-top:0;color:var(--accentHi);font-size:14px;font-weight:700;
  text-decoration:underline;min-height:44px}

/* ================= Exercise detail — canvas screen 6 (node 2:1182)
   The frame is drawn as a full screen with a back arrow and a pinned footer. It stays
   a sheet here: it opens from the ⓘ mid-workout and from the picker, and a route would
   have to unmount the logger to show it. The sheet head's ✕ and ★ are the frame's back
   and star, in the one place a long exercise name cannot shove them around. */
.ico-cdown{--ico:url(icons/chevron-down.svg)}

.exd-sub{font-size:13px;color:var(--dim);margin:4px 0 16px}

/* Primary / Secondary / Equipment as labelled chips. This replaces both the old pill
   row and the two Primary/Secondary rows under the photographs, which carried exactly
   the same three facts a second time. */
.exd-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.exd-chip{background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:6px 10px;font-size:12px;color:var(--dim)}
.exd-chip b{font-weight:700;color:var(--text)}

/* The frame's two 130px panels. It draws a bar-and-arm diagram inside each; the app
   has the library's own photograph of that position, which is what the diagram stands
   in for, so the photograph fills the panel and the label sits under it. */
.exd-form{display:flex;gap:12px;margin-bottom:20px}
.exd-form figure{flex:1;min-width:0;margin:0;height:130px;background:var(--raised);
  border:1px solid var(--border);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column}
.exd-form img{flex:1;min-height:0;width:100%;object-fit:cover;display:block;background:#fff}
.exd-form figcaption{flex:0 0 auto;font-size:11px;color:var(--text);text-align:center;
  padding:8px 6px;letter-spacing:.06em}

.exd-h{font-family:var(--display);font-weight:800;font-size:16px;margin:0 0 12px}
.exd-steps{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.exd-step{display:flex;gap:12px;align-items:flex-start}
/* 24px ringed numeral, accent-soft fill inside an accent border. */
.exd-num{flex:0 0 24px;width:24px;height:24px;border-radius:12px;
  background:var(--accentSoft);border:1px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:12px;color:var(--text)}
.exd-step p{flex:1;min-width:0;margin:0;font-size:13px;line-height:18px}

/* One row for tips and mistakes together, ruled above and below as the frame has it,
   in place of the grey button that used to toggle them. */
.exd-tips{display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;background:none;border:0;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);border-radius:0;
  margin:24px calc(-1 * var(--s4)) 0;padding:20px var(--s4);
  color:var(--text);text-align:start}
.exd-tips-l{display:flex;align-items:center;gap:8px;
  font-family:var(--display);font-weight:800;font-size:14px}
.exd-tips-l i{font-style:normal;color:var(--gold);font-weight:400}
.exd-tips .ico-cdown{color:var(--dim);transition:transform var(--m-micro) var(--e-standard)}
.exd-tips[aria-expanded="true"] .ico-cdown{transform:rotate(180deg)}
:root.reduced .exd-tips .ico-cdown{transition:none}
.exd-miss{padding-top:16px}
.exd-miss div{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:13px}
.exd-miss b{color:var(--accentHi);font-weight:700;flex:0 0 auto}

/* The frame pins ADD TO WORKOUT to the foot of the screen. Inside a sheet it sits at
   the end of the content, and it appears only when there is a day open to add to —
   the same sheet opens mid-set from the logger, where adding is not what it means. */
.exd-add{margin-top:24px}

/* ================= Exercise replacement — canvas screen 7 (node 2:1244)
   The frame is the picker in replace mode, so this is the picker sheet with the
   frame's three additions: the row naming what is being replaced, a second filter
   row for equipment, and a Swap affordance on each result. */

/* What you are replacing, stated before the list of what you could replace it with.
   The picker never said, so "Replace exercise" was the only clue on screen. */
.exswapfrom{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:16px}
.exswapfrom-k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.exswapfrom-n{font-family:var(--display);font-weight:700;font-size:15px;margin-top:2px}
.exswapfrom-b{flex-shrink:0;background:var(--accentSoft);color:var(--text);
  border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.06em}

/* Two rows, not the frame's one. It draws the muscle pill and two equipment pills
   side by side; they filter different things, and mixed into a single unlabelled row
   there is nothing to say why turning one off widens the list and the other narrows
   it. Same pills, same scroll, one row each. */

/* The frame gives every result an explicit Swap button. A button inside the row
   button is not valid, and two targets stacked on one row is worse to hit than one,
   so this is a label styled as the frame's button — the whole row remains the tap. */
.exswap{flex-shrink:0;background:var(--raised);border:1px solid var(--border);
  border-radius:4px;padding:6px 12px;
  font-family:var(--display);font-weight:700;font-size:12px;color:var(--accentHi)}
.item:active .exswap{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}

/* ================= Workout complete — canvas screen 8 (node 2:1311)
   Measured off the 2× frame export, so every figure here is half what that file
   shows. It stays a sheet, like screens 6 and 7: finishSession() opens it, and a
   route would have to unmount the logger underneath to show it. */
.ico-award{--ico:url(icons/award.svg)}

/* The medal. The green tick this replaces was the pre-Figma design's; the frame
   rings it in accent over accent-soft{text-align:center;margin-bottom:20px}





/* Four tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}





/* The record. Gold{display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1.5px solid var(--gold);border-radius:8px;
  padding:16px;margin-bottom:24px}





/* Derived facts{font-family:var(--display);font-weight:800;font-size:17px;margin:0 0 12px}




/* The frame pins these under a rule at the foot of the screen. */
.wc-foot{border-top:1px solid var(--border);
  margin:0 calc(-1 * var(--s4));padding:20px var(--s4) 0}



/* ================= Exercise library — canvas screen 9 (node 2:1360)
   Measured off the 2× PNG export at 804×1748 and halved; the Figma connector was
   still capped. Same caveat as screen 8: spacing is read to a couple of pixels
   rather than taken literally. */

/* Title, subtitle and the favourites star, which is where the frame puts it. The
   shared head() renders a BUNYAN watermark in that corner instead, so this screen
   has its own header rather than a watermark with a star stacked on it. */
.libhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin-bottom:16px}
.libhead h1{margin:0}
.libhead .sub{margin:5px 0 0;color:var(--dim);font-size:14px}

/* The frame's search field: the icon lives inside it, in accent. The bare input this
   replaces gave no hint of what could be searched. */
.libq{position:relative;margin-bottom:12px}
.libq .ico-search{position:absolute;inset-inline-start:14px;top:50%;margin-top:-8px;
  color:var(--accent);pointer-events:none}
.libq input{width:100%;height:48px;border-radius:12px;padding-inline:40px 14px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:15px}
.libq input::placeholder{color:var(--dim)}

.libfilters{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
/* The frame's selected pill is outlined in accent, not filled — filled is what this
   app's .pill.a does, and the two together would have read as two different states.
   Scoped here so the filled pill everywhere else is untouched. */
.libfilters .pill{flex-shrink:0;border:1px solid var(--border);min-height:44px;
  padding:0 16px;display:flex;align-items:center;border-radius:22px;
  /* The base pill is an 11px uppercase tag. These are filter controls meant to be
     read, which is how the frame draws them — sentence case, legible size. */
  font-size:13px;font-weight:600;letter-spacing:0;text-transform:none}
.libfilters .pill.a{background:transparent;border-color:var(--accent);color:var(--accentHi)}

/* "Chest Exercises (4)" — the filter and the count, which the tiny "N of M shown"
   line it replaces said less clearly and in the wrong place. */
.libcount{font-family:var(--display);font-weight:800;font-size:20px;margin:16px 0 12px}

.librow{display:flex;align-items:center;gap:16px;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px;margin-bottom:10px;color:var(--text)}
.librow .thumbwrap,.librow .thumb,.librow .thumb.ph{border-radius:8px;flex-shrink:0}
/* Spans, so they need telling they are blocks — inline they ran the name and the
   detail together on one line and collapsed the row onto the thumbnail. */
.librow-t{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.librow-n{display:block;font-family:var(--display);font-weight:700;font-size:17px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.librow-s{display:block;font-size:13px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The equipment is the one part of that line the frame colours — it is what decides
   whether you can do the exercise at all. */
.librow-s b{font-weight:400;color:var(--sub)}
.librow .ico-chev{color:var(--dim);flex-shrink:0}
[dir="rtl"] .librow .ico-chev{transform:scaleX(-1)}

/* ================= Profile
   The one tab with no frame: none of the nineteen top-level frames in the file is a
   profile screen. So this is built from the language the eleven built frames share
   rather than from a design of its own — Home's accent-ringed avatar, the Train hub's
   hero card, and its grouped rows, which put each setting's value under its name
   instead of squeezed against the chevron. */

/* Identity. The avatar is Home's, larger, because here it is the subject. */
.card.phero{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:24px 20px 0;margin-bottom:0;overflow:hidden}
.pavatar{width:72px;height:72px;border-radius:36px;background:var(--accentSoft);
  border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:24px;color:var(--text)}
.pname{font-family:var(--display);font-weight:800;font-size:22px;margin-top:12px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pprog{font-size:13px;color:var(--dim);margin-top:4px}

/* Three figures, ruled off the card's edges. Equal weight: none of them outranks the
   others, so none is styled as if it did — the streak used to be the accent-red one. */
.pstats{display:grid;grid-template-columns:repeat(3,1fr);
  width:calc(100% + 40px);margin:20px -20px 0;border-top:1px solid var(--border)}
.pstats>div{padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pstats>div+div{border-inline-start:1px solid var(--border)}
.pstats b{font-family:var(--display);font-weight:800;font-size:20px;
  font-variant-numeric:tabular-nums}
.pstats span{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}

/* The small print, kept — it is the only place the app says where its data lives. */
.pnote{font-size:12px;color:var(--dim);line-height:1.55;margin:16px 0 0}

/* ================= Food sheets — frames 13:188 13:266 13:337 13:403 13:464 13:531,
   with the state styles of 13:599. Read from Figma for the first two and from the
   user's 2× PNG exports for the rest, so those five are accurate to a couple of px. */
.ico-camera{--ico:url(icons/camera.svg)}
.ico-info{--ico:url(icons/info.svg)}
.ico-edit{--ico:url(icons/edit.svg)}
.ico-warn{--ico:url(icons/warn.svg)}
.ico-alert{--ico:url(icons/alert.svg)}

/* The frames' header, inside the sheet: back, then title over subtitle. */
.afhead{display:flex;align-items:center;gap:6px;margin:0 0 16px}
.afhead .icobtn.back{margin-inline-start:-10px;flex-shrink:0}
.afhead-t{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.afhead-t h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.afsub{font-size:13px;color:var(--dim);margin-top:2px}
/* The meal is the subtitle and the chooser both: an invisible native select over the
   text. The padding and matching negative margin give it a 44px target without making
   the header any taller. */
.afmeal{position:relative;display:inline-flex;align-items:center;gap:4px;margin:-10px 0;
  padding:12px 0;font-size:13px;color:var(--dim)}
.afmeal b{font-weight:600}
.afmeal .ico-cdown{width:14px;height:14px;flex-basis:14px}
.afmeal select{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;font-size:16px}
.afmeal:focus-within{color:var(--text)}

.aflbl{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--dim);margin:20px 0 8px}
.afq-echo{text-transform:none;font-weight:600;color:var(--text)}
.afnote{font-size:12px;line-height:1.5;color:var(--dim);margin:10px 0 0}

/* ---- search (13:188) */
.afq{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding-inline:14px 2px;min-height:52px}
.afq:focus-within{border-color:var(--accent)}
.afq>.ico-search{width:20px;height:20px;flex:0 0 20px;color:var(--dim)}
.afq input{flex:1;min-width:0;width:auto;background:none;border:none;border-radius:0;padding:14px 0;
  font-size:16px;color:var(--text)}
.afq input:focus{border:none}
.afcam{flex:0 0 44px;width:44px;height:44px;border:none;background:none;color:var(--dim);
  display:flex;align-items:center;justify-content:center}
.afcam .ico{width:20px;height:20px;flex-basis:20px}
.afcam:active{color:var(--accentHi)}
/* One search field across the app: the library's pill, its red glass, its focus ring. */
.afq{border-radius:var(--rpill);background:var(--bg);padding-inline:18px 4px;min-height:52px}
.afq>.ico-search{width:16px;height:16px;flex-basis:16px;color:var(--accentHi)}
.afq:focus-within{border-color:var(--accentHi);box-shadow:0 0 0 3px rgba(230,30,40,.18)}
.afq .libq-x{position:static;margin:0;flex:0 0 36px}

/* The four ways to find a food: the shared segmented control (.seg, soft). */
.aftabs{margin:12px 0 4px}

.afpills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}

  padding:0 16px;color:var(--text);font-size:13px}

/* The way into Quick Add, under an empty search. */

  color:var(--text)}

.afquick-t span{display:block;font-size:12px;color:var(--dim);margin-top:2px}

.afresults{display:flex;flex-direction:column;gap:10px}

/* 32px, as drawn, with the outset that makes it a 44px target. */

.afcur{flex-shrink:0;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--accentHi)}
.afmore2{display:flex;gap:10px;margin-top:14px}
.afmore2 .btn{flex:1;margin:0;font-size:13px;letter-spacing:.02em;padding:0 10px}
.sheetbox .btn.afcreate{margin:12px 0}

/* ---- one food, its servings (13:266) */
.afmono{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  margin:0;padding:26px var(--s4);border-radius:var(--r4);border:1px solid var(--border);
  background:radial-gradient(80% 70% at 50% 0%,rgba(230,30,40,.14),transparent 70%),var(--raised)}

.afmono-v{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;
  font-variant-numeric:tabular-nums}
.afmono-u{font-weight:700;font-size:16px;color:var(--accentHi)}
.afmono-m{display:flex;gap:28px;margin-top:10px}
.afmono-m div{display:flex;flex-direction:column;align-items:center;gap:4px}
.afmono-m b{font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.afmono-m span{font-size:11px;text-transform:uppercase;color:var(--dim)}

.afsel{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 16px;min-height:52px}
.afsel:focus-within{border-color:var(--accent)}
.afsel-v{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.afsel-v i{font-style:normal;font-weight:400;font-size:14px;color:var(--dim)}
.afsel .ico-cdown{color:var(--dim);flex-shrink:0}
.afsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;font-size:16px}

.afstep{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
  border-radius:12px;padding:10px 12px}
.afstep button{width:44px;height:44px;border:none;border-radius:8px;font-size:20px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.afstep-m{background:var(--border);color:var(--text)}
.afstep-p{background:var(--accentSoft);color:var(--accentHi)}
.afstep button:disabled{opacity:.4}
.afstep b{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}

.afmore{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;text-align:start;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 16px;min-height:52px;
  color:var(--text);font-weight:700;font-size:14px}
.afmore>span:nth-child(2){flex:1}
.afmore>.ico-info{width:20px;height:20px;flex:0 0 20px;color:var(--dim)}
.afmore>.ico-plus{width:16px;height:16px;flex:0 0 16px;color:var(--dim);
  transition:transform var(--m-micro) var(--e-standard)}

.afmore-b{padding:4px 16px 0}
.afmore-b div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:13px;
  border-bottom:1px solid var(--border)}
.afmore-b div:last-child{border-bottom:none}
.afmore-b span{color:var(--dim)}
.afmore-b b{font-weight:600;text-align:end;font-variant-numeric:tabular-nums}

/* The frames' 56px call to action. Scoped through .sheetbox because .btn's own height
   rule is .btn:not(.sm):not(.d), which outranks a bare .btn.afcta. */

/* ---- Quick Add (13:337, 13:403) */
textarea.afnl{display:block;width:100%;min-height:112px;resize:none;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);
  font:inherit;font-size:16px;line-height:1.45}
textarea.afnl:focus{outline:none;border-color:var(--accent)}
textarea.afnl.warn{border-color:var(--gold)}
.sheetbox .btn.afparse{margin-top:10px}
.afstat{display:flex;align-items:center;gap:6px;font-size:12px;margin:10px 0 0}
.afstat .ico{width:14px;height:14px;flex-basis:14px}
.afstat.ok{color:var(--ok)}
.afstat.warn{color:var(--gold)}

.afitem{background:var(--surface);border:1px solid transparent;border-radius:12px;padding:12px 16px;
  margin-bottom:10px}
.afitem.warn{border-color:var(--gold)}
.afitem-r{display:flex;align-items:center;gap:8px}
.afitem-t{flex:1;min-width:0}
.afitem-n{font-weight:700;font-size:16px}
.afitem-n span{font-weight:400;color:var(--dim)}
.afitem-m{font-size:12px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.afwarn{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--gold)}
.afwarn.tag{text-transform:uppercase;letter-spacing:.03em}
.afwarn .ico{width:14px;height:14px;flex-basis:14px}
.afedit{flex:0 0 44px;width:44px;height:44px;margin-inline-end:-10px;border:none;background:none;
  color:var(--dim);display:flex;align-items:center;justify-content:center}
.afedit[aria-expanded="true"]{color:var(--accentHi)}
.afedit .ico{width:22px;height:22px;flex-basis:22px}
.afitem-q{margin-top:12px}

/* The unrecognised line: amber, three ways forward. */
.afunk{background:rgba(201,162,39,.12);border:1.5px solid var(--gold);border-radius:12px;padding:16px;
  margin-bottom:10px}
.afunk-r{display:flex;gap:12px;align-items:flex-start}
.afunk-r>.ico-warn{width:24px;height:24px;flex:0 0 24px;color:var(--gold);margin-top:1px}
.afunk-t{min-width:0}
.afunk-n{font-family:var(--display);font-weight:700;font-size:16px;color:var(--gold);overflow-wrap:anywhere}
.afunk-s{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);margin-top:4px}
.afunk-a{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:12px}
.afunk-a button{background:none;border:none;min-height:44px;padding:0 4px;color:var(--sub);
  font-weight:700;font-size:14px}
.afunk-a .afunk-p{border:1.5px solid var(--gold);border-radius:8px;padding:0 14px;color:var(--text)}

.aftotal{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;
  background:var(--okSoft);border-radius:12px;padding:16px;margin-top:6px;color:var(--ok)}
.aftotal b{font-family:var(--display);font-weight:800;font-size:16px}
.aftotal span{font-size:13px;font-variant-numeric:tabular-nums}
.sheetbox .btn.afnone{margin:10px 0 4px}

/* ---- states (13:599) */
.afshim{background:var(--surface);border-radius:12px;padding:18px 16px 14px;margin-top:14px}
.afshim .skelbar{height:14px;margin:0 0 12px}
/* .skel is drawn in --surface, which is this card's own colour: the bars would only
   show while the highlight passed. The reference frame draws them in the border tone.
   Only the colours change, so the shared animation and its reduced-motion rule stay. */
.afshim .skel{background-image:linear-gradient(90deg,var(--border) 25%,var(--raised) 50%,var(--border) 75%)}
.afshim p{margin:4px 0 0;font-size:12px;color:var(--dim)}
.aferr{background:rgba(227,27,35,.12);border:1.5px solid var(--accent);border-radius:12px;
  padding:20px 16px;margin-top:14px;text-align:center}
.aferr b{display:block;font-family:var(--display);font-weight:700;font-size:16px}
.aferr p{margin:6px 0 12px;font-size:13px;line-height:1.45;color:var(--sub)}
.sheetbox .aferr .btn{display:inline-flex;width:auto;margin:0;padding:0 24px}

/* ---- Enter manually (13:464) */
.affield{min-height:48px;border-radius:12px;padding:0 16px;font-size:16px}
.aftiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aftiles.ng3{grid-template-columns:repeat(3,1fr);margin-top:14px}
.aftile{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface);
  border:1px solid transparent;border-radius:12px;padding:14px 16px}
.aftile:focus-within{border-color:var(--accent)}
.aftile-k{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.aftile-v{display:flex;align-items:baseline;gap:6px;min-width:0}
.aftile-v input{flex:0 1 auto;min-width:1ch;max-width:100%;background:none;border:none;border-radius:0;padding:0;
  color:var(--text);font-family:var(--display);font-weight:800;font-size:24px;-moz-appearance:textfield}
.aftile-v input:focus{border:none}
.aftile-v input::placeholder{color:var(--faint);font-weight:700}
.aftile-v input::-webkit-inner-spin-button,.aftile-v input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.aftile-v i{font-style:normal;font-weight:700;font-size:13px;color:var(--dim);flex-shrink:0}
/* Nutrition goals sits the tiles inside a card; a card on a card needs the step. */
.ngcard .aftile{background:var(--raised)}

.aftoggle{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border-radius:12px;padding:0 16px;min-height:60px;margin-top:16px;
  font-weight:700;font-size:15px}
.aftoggle input{position:absolute;opacity:0;width:1px;height:1px;padding:0}
.aftoggle i{position:relative;flex:0 0 48px;width:48px;height:28px;border-radius:14px;background:var(--border);
  transition:background var(--m-micro) var(--e-standard)}
.aftoggle i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;
  border-radius:11px;background:#fff;transition:transform var(--m-micro) var(--e-standard)}
.aftoggle input:checked+i{background:var(--accent)}
.aftoggle input:checked+i::after{transform:translateX(20px)}
[dir="rtl"] .aftoggle input:checked+i::after{transform:translateX(-20px)}
.aftoggle input:focus-visible+i{outline:2px solid var(--accentHi);outline-offset:2px}
:root.reduced .aftoggle i,:root.reduced .aftoggle i::after{transition:none}

/* ---- Nutrition goals (13:531) */
.ngcard{display:block;background:var(--surface);border-radius:12px;padding:16px;margin-bottom:12px}
.ngcard>.aflbl:first-child{margin-top:0}
.ngenergy{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ngenergy-t{min-width:0}
.ngenergy .aflbl{margin:0 0 6px}
.ngbig{display:flex;align-items:baseline;gap:8px}
.ngbig input{background:none;border:none;border-radius:0;padding:0;color:var(--text);
  font-family:var(--display);font-weight:800;font-size:30px;-moz-appearance:textfield}
.ngbig input:focus{border:none}
.ngbig input::-webkit-inner-spin-button,.ngbig input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ngbig i{font-style:normal;font-family:var(--display);font-weight:800;font-size:30px}
.ngenergy>.ico-edit{width:22px;height:22px;flex:0 0 22px;color:var(--accentHi)}
.ngsplit{display:flex;gap:8px;height:16px;margin:4px 0 12px}
.ngsplit i{display:block;min-width:8px;border-radius:8px}
.ngsplit .p{background:var(--mac-p)}
.ngsplit .c{background:var(--mac-c)}
.ngsplit .f{background:var(--mac-f)}
.nglegend{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.ngrem-r{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:14px;
  font-size:15px}
.ngrem-r b{font-weight:700}
.ngrem-r span{font-weight:700;font-variant-numeric:tabular-nums}
.ngrem-r span.over{color:var(--gold)}
.ngrem .bar,.ngrem .bar i{height:4px;border-radius:2px}
.ngrem .bar{margin-top:8px;background:var(--border)}
/* ---- Progress (js/ui/views/progress.js) ---------------------------------------
   The four "Progress —" frames and 2:484's segmented control. The view shipped
   without any of these rules, so it rendered as unstyled text and default buttons.
   Surfaces, type and spacing are the app's tokens; nothing here introduces a colour. */
/* The section switch and the range are the shared segmented control (.seg). */
.pgrange{margin-top:10px}
.pgrange+.pgcard,.pgrange+.empty{margin-top:var(--s4)}
.pglink:focus-visible,.pgrow:focus-visible,
.pgph:focus-visible,.pgaddph:focus-within{outline:2px solid var(--accentHi);outline-offset:2px}
/* Section labels: the frames' small grey capitals, with an action or note opposite. */
.pglbl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:var(--s5) 0 var(--s3);min-height:24px}
.pglbl h2{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin:0}
.pglink{background:none;border:none;color:var(--accentHi);font-weight:700;font-size:14px;
  min-height:44px;margin:-10px -2px;padding:0 2px}
.pgaside{font-size:12px;color:var(--dim)}
/* Stat tiles. A grid, so a long figure grows its tile instead of sliding under the
   row below — the Overview frame's overlap. */
.pgstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:var(--s3)}
.pgstat{background:var(--raised);border:1px solid var(--border);border-radius:var(--r3);padding:16px;min-width:0}
.pgstat-k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.pgstat-v{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
  margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
.pgstat-v span,.pgbig span,.pgcomp-v span{font-family:inherit;font-size:13px;font-weight:600;color:var(--dim);
  margin-inline-start:3px;letter-spacing:0;white-space:nowrap}
.pgstat-d{font-size:12.5px;color:var(--dim);margin-top:6px}
.pgd{font-variant-numeric:tabular-nums;color:var(--dim)}
.pgd.ok{color:var(--ok)}
.pgcard{background:var(--raised);border:1px solid var(--border);border-radius:var(--r3);padding:20px;margin-bottom:var(--s3)}
.pgcard>.btn{margin-top:14px}
.pgcard-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pgcard-h h3{font-size:16px;margin:0}
.pgcard-h span{font-size:12.5px;color:var(--dim);text-align:end}
.pgbig{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.05;
  margin-top:4px;color:var(--text);font-variant-numeric:tabular-nums}
.pgbig.w,.pgbig.a{color:var(--text)}
.pgsub{font-size:13px;color:var(--dim);margin-top:6px}
.pgnote{font-size:12.5px;color:var(--dim);margin:10px 0 0}
.pgnone{font-size:13.5px;color:var(--dim);margin:10px 0 0;line-height:1.45}
.pgdash{display:inline-block;width:18px;border-top:1.5px dashed var(--dim);vertical-align:middle;margin-inline-end:6px}
/* The chart. Its box is stretched to the card, so strokes do not scale with it. */
.pgchart{margin:14px 0 0}
.pgchart svg{display:block;width:100%;height:120px;overflow:visible}
.pgchart-g{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}
.pgchart-a{fill:var(--accent);opacity:.1}
.pgchart-r{stroke:var(--dim);stroke-width:1.2;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.pgchart-l{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke}
.pgchart-p,.pgchart-po{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.pgchart-po{stroke:var(--text);stroke-width:9}
.pgchart-p{stroke:var(--accent);stroke-width:5.5}
.pgaxis{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);margin-top:8px}
/* Rows: records, workouts, top lifts, the day card. */
.pgrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:14px 16px;margin-bottom:8px;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);text-align:start}
button.pgrow:active{background:var(--surface)}
.pgrow.on{border-color:var(--accent)}
.pgrow-t{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.pgrow-k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.pgrow-n{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;min-width:0}
.pgrow-n>span{min-width:0;overflow-wrap:anywhere}
.pgrow-s{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.pgrow-e{font-size:13px;color:var(--dim);white-space:nowrap;flex-shrink:0}
.pgrow-v{font-weight:700;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.pgrow .ico-chev{color:var(--dim);flex-shrink:0}
.pgbadge{flex-shrink:0;padding:2px 6px;border-radius:4px;background:var(--gold);color:var(--bg);
  font-size:10.5px;font-weight:800;letter-spacing:.06em}
.pgpick{margin:var(--s4) 0 var(--s3)}
/* Share of working sets by muscle group. */
.pgshare-r{display:grid;grid-template-columns:minmax(0,7.5em) 1fr 3em;align-items:center;gap:12px;min-height:32px}
.pgshare-r>span{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgshare-r .bar{height:8px;margin:0;background:var(--surface);border-radius:4px}
.pgshare-r .bar i{height:8px;border-radius:4px;background:var(--accent)}
.pgshare-r b{text-align:end;font-size:13.5px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
/* Body. */
.pgwhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pgwd{font-size:13.5px;text-align:end;padding-top:2px}
.pgm{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;margin-bottom:8px;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r2)}
.pgm>span:first-child{flex:1;min-width:0;font-size:15.5px}
.pgm b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pgm-d{min-width:68px;text-align:end;font-size:13px}
.pgm.tall>span:first-child{display:flex;flex-direction:column;gap:2px}
.pgm small{font-size:12.5px;color:var(--dim)}
.pgm b.acc{color:var(--text)}
.pgcomp{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pgcomp-e{text-align:end}
.pgcomp-v{font-family:var(--display);font-size:30px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.pgtrack{height:10px;border-radius:5px;background:var(--surface);overflow:hidden;margin-top:14px}
.pgtrack i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.pgtrack.sm{height:5px;margin-top:10px}
.pgtrack.c i{background:var(--text)}

/* Icon discs are quiet everywhere: the inner surface, a hairline ring, the icon in
   sub. Red is kept for what you act on and where you are (the main button, the active
   tab, today, a selection), so a screen of metric cards no longer reads as a screen
   of alarms. The hero's badge is the one red disc on a screen. */
/* ---- Progress, redesign frames -------------------------------------------------
   Key metrics, exercise progress and the rest share one card surface (a faint top
   light over --raised, the card shadow) and one badge: an accent disc with a glyph,
   the dock's active state made solid. */
.pgcard,.pgstat,.pgkm-c,.pgpr,.pgex,.pginsight,.pgm,.pgrow{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--raised);
  box-shadow:var(--shadow-card)}
.pgki{flex:0 0 36px;width:36px;height:36px;border-radius:var(--rpill);display:inline-flex;align-items:center;justify-content:center;
  color:var(--sub);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.pgki svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pgkm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.pgkm-c{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px;border-radius:var(--r3);text-align:start;
  border:1px solid var(--border);color:var(--text);transition:transform var(--m-press) var(--e-standard)}
.pgkm-c:active{transform:scale(.97)}
.pgkm-c:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.pgkm-h{display:flex;align-items:center;gap:10px;min-width:0}
.pgkm-k{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgkm-v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.pgkm-v small{font-family:inherit;font-size:13px;font-weight:600;color:var(--dim);margin-inline-start:3px}
.pgkm-s{font-size:12px;color:var(--dim);min-height:16px}
.pgspark{display:block;width:100%;height:28px;margin-top:2px;overflow:visible}
.pgspark path{fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pgspark.ok path{stroke:var(--ok)}
.pgbars{display:flex;align-items:flex-end;gap:5px;height:28px;margin-top:2px}
.pgbars i{flex:1;border-radius:3px;background:var(--bar-track)}
.pgbars i.now{background:var(--accent)}
.pgcard-i{display:flex;align-items:center;gap:10px}
.pgcard-i .pgki{flex-basis:32px;width:32px;height:32px}
.pgcard-i .pgki svg{width:17px;height:17px}
.pgcard-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pgcard-r b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;color:var(--text)}
.pgmeas-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}
.pgmeas-c{display:flex;flex-direction:column;gap:4px;min-width:0;padding:0 12px}
.pgmeas-c:first-child{padding-inline-start:0}

.pgmeas-c .pgd{font-size:12px}
/* The closing banner over the rider. */
.pgbanner{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;
  min-height:84px;margin-top:var(--s5);padding:16px 18px;border-radius:var(--r4);text-align:start;color:var(--text);
  border:1px solid var(--accent-edge);background:linear-gradient(90deg,rgba(227,27,35,.35),rgba(20,20,26,.2) 60%),var(--raised)}

  -webkit-mask:linear-gradient(90deg,#000 50%,transparent);mask:linear-gradient(90deg,#000 50%,transparent)}

  padding:14px;border-radius:var(--r3);border:1px solid var(--border);color:var(--text);text-align:start;
  transition:transform var(--m-press) var(--e-standard),border-color var(--m-micro) var(--e-standard)}

.pgpr:active{transform:scale(.97)}

.pginsight-i{flex:0 0 36px;width:36px;height:36px;border-radius:var(--rpill);display:flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--sub);box-shadow:inset 0 0 0 1px var(--border)}

/* ---- Rest (session.js vRest): the countdown and the rest-over choices --------------
   The redesign frames: a dark field with the red swirl (img/rest-swirl.jpg, drawn for
   this) turning slowly behind the ring, the dock's glass and pill language for every
   control. #rest scoping outranks the older .restwrap rules above. */
#rest .restwrap.rt{justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  overflow-y:auto;overflow-x:hidden;background:#050506;background-image:none;isolation:isolate;gap:0}
.rt-art{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.rt-art img{position:absolute;left:50%;top:44%;width:max(150vw,760px);height:auto;transform:translate(-50%,-50%);
  opacity:.9;animation:rtSpin 90s linear infinite}
.rt-done .rt-art img{top:30%;opacity:.35}
@keyframes rtSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
:root.reduced .rt-art img{animation:none}
.rt-art::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 44%,transparent,rgba(5,5,6,.55) 70%,#050506)}
.rt-k{font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accentHi);text-align:center}

  font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6)}

.ss-act{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 12px;border-radius:var(--r4);
  border:1px solid var(--hair-hi);background:rgba(255,255,255,.04);color:var(--text);font-weight:600;font-size:14px}
.ss-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--accentHi)}
.ss-act:active{transform:scale(.97)}
/* ---- Confirm sheets: centred, compact, pill buttons in sentence case. The ✕ in the
   head is dropped here — Cancel (or "Keep training") sits right beside the choice,
   and a drag or a tap outside still closes a non-destructive one. */
.cfbox .sheethead{border-bottom:none;background:none;margin-bottom:0;padding-bottom:4px;min-height:0}
.cfbox .sheethead .x{display:none}
.cf{text-align:center;padding:6px 8px 4px}
.cf-i{display:grid;place-items:center;width:64px;height:64px;margin:4px auto 16px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.08),rgba(255,255,255,.02) 70%);
  border:1px solid var(--border);box-shadow:0 10px 30px -12px rgba(230,30,40,.45)}
.cf-i svg{width:28px;height:28px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cf-i.bad svg{stroke:var(--accentHi)}
.cf h2{font-size:24px;margin:0}
.cf-b{color:var(--dim);font-size:15px;line-height:1.45;margin:8px auto 22px;max-width:30ch}
.cf-acts{display:flex;flex-direction:column;gap:10px}
.cf-acts .btn{margin:0;border-radius:var(--rpill);text-transform:none;letter-spacing:0;font-size:16px;min-height:54px}
.cf-acts .cf-ok{background:linear-gradient(180deg,var(--accent),var(--accent-deep));
  box-shadow:0 10px 26px -12px rgba(230,30,40,.7),inset 0 1px 0 rgba(255,255,255,.18)}
.cf-acts .cf-no{background:var(--raised);border:1px solid var(--border)}
.cf-alt{background:none;border:none;color:var(--accentHi);font-family:inherit;font-weight:600;font-size:15px;
  padding:12px 0 2px;min-height:44px;cursor:pointer}
.cf-alt:active{opacity:.6}
/* ---- One button language for every sheet and sub-page ------------------------------
   Pills, sentence case, the accent gradient on the primary; .g is the tonal secondary.
   Sheets lose the hairline under their head and gain the app's glow at the top. */
.btn:not(.g):not(.o):not(.ok):not(.danger):not(.d){box-shadow:0 10px 26px -14px rgba(230,30,40,.75),inset 0 1px 0 rgba(255,255,255,.16)}
.btn.danger{border-radius:var(--rpill)}
.sheethead{border-bottom:none}
.sheethead .x{width:34px;height:34px;flex-basis:34px;background:var(--raised)}
.sheetbox{background:radial-gradient(120% 50% at 50% 0%,rgba(230,30,40,.10),transparent 60%),var(--bg)}

/* ---- Rest over (session.js vRest, restDone): built for a glance mid-workout ------- */
#rest .rt2{justify-content:space-between}
.rt2-top{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:auto}
.rt2 .rt-check{width:92px;height:92px;margin:18px 0 14px}
.rt2 .rt-h{margin:0;font-size:clamp(28px,8vw,34px)}
.rt2-next{margin:10px 0 0;font-size:17px;color:var(--text);text-align:center;font-variant-numeric:tabular-nums;opacity:.85}
.rt2-acts{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:100%;max-width:420px;margin:28px auto 0}
.rt2 .rt-go{max-width:none;min-height:68px;border-radius:var(--rpill);font-size:19px;letter-spacing:0;text-transform:none}
.rt2-k{margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
.rt2-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rt2-b{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:var(--rpill);
  background:rgba(28,28,34,.78);border:1px solid var(--hair-hi);color:var(--text);font-family:var(--display);
  font-size:18px;font-weight:700;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform var(--m-press) var(--e-standard)}
.rt2-b.wide{font-size:16px}
.rt2-b svg,.rt2-end svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt2-end{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;margin-top:6px;border-radius:var(--rpill);
  background:rgba(230,30,40,.08);border:1px solid rgba(248,52,70,.45);color:var(--accentHi);font-family:var(--display);
  font-size:16px;font-weight:700;transition:transform var(--m-press) var(--e-standard)}
.rt2-b:active,.rt2-end:active{transform:scale(.96)}
[dir="rtl"] .rt2-b svg,[dir="rtl"] .rt2-end svg{transform:scaleX(-1)}
/* The countdown's own labels in the same case as everything else. */
.rt-skip,.rt-main{text-transform:none;letter-spacing:0}

/* ---- Workout complete (sheets.js "done") ------------------------------------------ */
.wc2{position:relative;text-align:center;padding:8px 4px 0;isolation:isolate}
.wc2-art{position:absolute;z-index:-1;top:-40px;left:50%;width:300px;height:auto;transform:translateX(-50%);opacity:.10;pointer-events:none}
.wc2-medal{display:grid;place-items:center;width:84px;height:84px;margin:6px auto 16px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,rgba(248,52,70,.35),rgba(120,10,16,.35) 70%);border:1.5px solid var(--accentHi);
  box-shadow:0 0 0 8px rgba(230,30,40,.08),0 18px 40px -14px rgba(230,30,40,.8)}
.wc2-medal svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wc2-h{margin:0;font-size:28px}
.wc2-sub{margin:6px 0 20px;color:var(--dim);font-size:15px}
.wc2-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r4);
  background:var(--raised);overflow:hidden}
.wc2-stats>div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px}
.wc2-stats>div+div{border-inline-start:1px solid var(--border)}
.wc2-stats b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.wc2-stats small{font-size:13px;font-weight:600;color:var(--dim);margin-inline-start:3px}
.wc2-stats>div>span{font-size:12px;color:var(--dim)}
.wc2-hl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:12px 14px;border-radius:var(--rpill);
  background:rgba(230,30,40,.08);border:1px solid rgba(248,52,70,.3);font-size:14px;font-weight:600}
.wc2-acts{margin-top:22px}
.wc2-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.wc2-row .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- Edit a logged workout (sheets.js "sessedit") ---------------------------------- */
.se-top{margin-bottom:14px}
.se-k{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accentHi)}
.se-top h2{margin:4px 0 12px;font-size:24px}
.se-date{display:inline-flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:var(--rpill);
  background:var(--raised);border:1px solid var(--border);font-size:14px;color:var(--dim)}
.se-date input{width:auto;min-height:38px;margin:0;padding:0 12px;border-radius:var(--rpill);background:var(--surface);color-scheme:dark}
.se-ex{margin-top:12px;padding:14px;border-radius:var(--r4);background:var(--raised);border:1px solid var(--border)}
.se-exh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.se-exh h3{margin:0;font-size:16px;min-width:0}
.se-rm{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);background:none;color:var(--dim)}
.se-rm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.se-hd,.se-row{display:grid;grid-template-columns:28px minmax(0,1fr) 16px minmax(0,1fr) 40px;align-items:center;gap:8px}
.se-hd{margin:10px 0 4px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:center}
.se-row{margin-top:8px}
.se-n{font-family:var(--display);font-weight:800;color:var(--accentHi);text-align:center}
.se-row input{margin:0;min-height:46px;text-align:center;font-size:17px;font-weight:700;border-radius:14px;font-variant-numeric:tabular-nums}
.se-x{color:var(--dim);text-align:center}
.se-del{width:40px;height:40px;border-radius:50%;border:none;background:none;color:var(--dim);font-size:15px}
.se-empty{text-align:center;color:var(--dim);margin:24px 0}
.se-acts{margin-top:20px}
.se-edit{display:block;width:100%;margin-top:12px;min-height:44px;border-radius:var(--rpill);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-weight:600;font-size:14px}
/* ---- Train: My Training and the library as two equal tiles ------------------------- */
.ttiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.ttile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;min-height:128px;
  padding:16px;border-radius:var(--r4);border:1px solid var(--border);text-align:start;color:var(--text);overflow:hidden;
  background:radial-gradient(90% 70% at 100% 0%,rgba(230,30,40,.14),transparent 70%),var(--raised);
  transition:transform var(--m-press) var(--e-standard)}
.ttile:active{transform:scale(.97)}
.ttile:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.ttile-i{display:grid;place-items:center;width:40px;height:40px;margin-bottom:auto;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);color:var(--sub)}
.ttile-i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ttile-i .ico{width:18px;height:18px;background:currentColor}
.ttile-n{margin-top:14px;font-family:var(--display);font-weight:800;font-size:16px}
.ttile-s{font-size:12.5px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- Day details (sheets.js "dayview") ----------------------------------------------- */
.dv-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.dv-stats b{font-size:19px}
.dv-h{margin:22px 0 10px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dv-card{display:block;width:100%;margin-top:10px;padding:14px 16px;border-radius:var(--r4);border:1px solid var(--border);
  background:var(--raised);color:var(--text);text-align:start;transition:transform var(--m-press) var(--e-standard)}
button.dv-card:active{transform:scale(.98)}
.dv-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dv-row b{font-family:var(--display);font-size:15.5px}
.dv-k{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px}
.dv-it{margin-top:6px;font-size:13.5px;color:var(--dim)}
.dv-it span:last-child{font-variant-numeric:tabular-nums}
.dv-edit{color:var(--accentHi);font-weight:600}
.dv-none{margin:4px 0 0;color:var(--dim);font-size:14px}
/* ---- Every sheet, one structure (after My Training) ---------------------------------
   Kicker, large title, subtitle; grouped rows in one rounded card; labels in the same
   small caps; the head carries only the grab and the close, with no band behind it. */
.sheethead{background:transparent}
.shh,.se-top{margin:0 0 18px}
.shk,.se-k{display:block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accentHi);margin-bottom:6px}
.shh h2,.se-top h2{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.15;margin:0}
.shsub{color:var(--dim);font-size:14.5px;line-height:1.45;margin:6px 0 0}
.afhead-t h2{font-size:24px}
.sheetbox .list{border-radius:var(--r4)}
.sheetbox .list .item{min-height:58px;padding-top:14px;padding-bottom:14px}
.sheetbox .sec,.sheetbox .overline,.sheetbox .aflbl{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--dim)}
.sheetbox .card{border-radius:var(--r4)}
.se-date{margin-top:12px}
.sheetbox input:not([type=checkbox]):not([type=radio]):not([type=range]),.sheetbox select,.sheetbox textarea{border-radius:14px}
/* Intervals: rounds × work / rest on one line. */
.act-iv{display:flex;align-items:center;gap:8px}
.act-iv input{flex:1;min-width:0;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.act-iv span{color:var(--dim);font-weight:700}
.act-iv i{font-style:normal;color:var(--dim);font-size:13px}
.act-ivon{display:block;margin:14px 0 0}
/* Storage could not open: said once, at the top, calmly. */
.warnbar{display:flex;flex-direction:column;gap:4px;margin:0 0 14px;padding:12px 14px;border-radius:var(--r4);
  border:1px solid rgba(201,162,39,.5);background:rgba(201,162,39,.08);font-size:13px;line-height:1.45;color:var(--dim)}
.warnbar b{color:var(--text);font-size:14px}
/* ---- Progress: the weight trend against the goal ----------------------------------- */
.pgtrend-r{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pgtrend .pgbig{font-size:30px;white-space:nowrap}
.pgtrend-g{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pgtrend-g b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pgtrend-g small{font-size:12px;color:var(--dim)}
.pgtrend.ok .pgnote{color:var(--ok)}
/* ---- Train: a lighter week, suggested or running ----------------------------------- */
.dlcard{margin-top:14px;padding:16px;border-radius:var(--r4);border:1px solid rgba(201,162,39,.45);
  background:radial-gradient(90% 90% at 100% 0%,rgba(201,162,39,.12),transparent 70%),var(--raised)}
.dlcard-h{display:flex;align-items:center;gap:10px}
.dlcard-h b,.dlcard-t b{font-family:var(--display);font-size:16px}
.dlcard p{margin:8px 0 12px;color:var(--dim);font-size:14px;line-height:1.45}
.dlcard-i{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:50%;
  background:rgba(201,162,39,.14);color:var(--gold)}
.dlcard-i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dlcard-a{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.dlcard-a .btn{margin:0}
.dlcard-later{align-self:center;min-height:44px;padding:0 16px;background:none;border:none;color:var(--dim);font-size:14px;font-weight:600}
.dlcard.on{display:flex;align-items:center;gap:12px;padding:12px 14px}
.dlcard-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dlcard-t span{font-size:13px;color:var(--dim)}
.dlcard-x{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:var(--rpill);border:1px solid var(--border);
  background:none;color:var(--text);font-size:13px;font-weight:600}
/* ---- Train: switch the day's workout ----------------------------------------------- */
.thero2-swap{position:absolute;top:14px;inset-inline-end:14px;z-index:2;display:flex;align-items:center;gap:6px;
  min-height:36px;padding:0 14px;border-radius:var(--rpill);border:1px solid var(--hair-hi);
  background:rgba(12,12,16,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--text);font-size:13px;font-weight:700;transition:transform var(--m-press) var(--e-standard)}
.thero2-swap:active{transform:scale(.95)}
.thero2-swap svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thero2:has(.thero2-swap) .thero2-t{padding-inline-end:86px}
.trow.on{background:rgba(230,30,40,.08)}
.trow.on .trow-n{color:var(--accentHi)}
/* ---- Exercise library (train.js vLibrary) and exercise sheet ------------------------ */
.libhero{position:relative;isolation:isolate;margin:0 0 14px;padding:18px 16px 16px;border-radius:var(--r5);
  border:1px solid var(--border);overflow:hidden;
  background:radial-gradient(90% 80% at 100% 0%,rgba(230,30,40,.18),transparent 65%),var(--raised)}
.libhero-art{position:absolute;z-index:-1;top:-30px;inset-inline-end:-40px;width:210px;height:auto;opacity:.12;pointer-events:none}
/* ---- The drawings (js/ui/art.js) ----------------------------------------------
   The mark's single red stroke, a fainter second line, a few embers, a soft glow.
   Placement is the screen's own rule; this is only how a line looks and arrives. */
.art{display:block;overflow:visible;fill:none;stroke:var(--accentHi);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;
  filter:drop-shadow(0 0 6px var(--accent-glow))}
.art .b{opacity:.42}
.art .e{fill:var(--accentHi);stroke:none;opacity:.8}
.art .lvl{stroke-width:2.6;opacity:1}
.art.draw path{stroke-dasharray:1 1;stroke-dashoffset:1;animation:artDraw 1.6s var(--e-decel) forwards}
.art.draw path.b{animation-delay:.18s}
.art.draw .sword path{animation-delay:.3s}
.art.draw .e{opacity:0;animation:artEmber .9s var(--e-standard) .9s forwards}
@keyframes artDraw{to{stroke-dashoffset:0}}
@keyframes artEmber{to{opacity:.8}}
.art .sword{transition:transform var(--m-screen) var(--e-ios)}
/* On a button: at the far edge, behind the label, faded out toward it. One per big tile
   or build button, never on a button whose job is a number, never on the main action.
   The button isolates so the drawing paints over its background and under its text. */
.ttile,.bnew{position:relative;isolation:isolate;overflow:hidden}
.btn-art{position:absolute;z-index:-1;inset-inline-end:-6px;top:-4px;width:84px;height:auto;opacity:.38;
  -webkit-mask:linear-gradient(200deg,#000 35%,transparent 90%);mask:linear-gradient(200deg,#000 35%,transparent 90%)}
/* A wide button: in the chevron's zone at the far end, and the text stops short of it. */
.ttile.wide .btn-art,.bnew .btn-art{width:88px;top:50%;inset-inline-end:2px;transform:translateY(-50%);opacity:.34;
  -webkit-mask:linear-gradient(90deg,transparent,#000 60%);mask:linear-gradient(90deg,transparent,#000 60%)}
.bnew:has(.btn-art) .bnew-t,.ttile.wide:has(.btn-art) .ttile-tx{padding-inline-end:28px}
[dir="rtl"] .btn-art{transform:scaleX(-1)}
[dir="rtl"] .ttile.wide .btn-art,[dir="rtl"] .bnew .btn-art{transform:translateY(-50%) scaleX(-1)}
@media (prefers-reduced-motion:reduce){.art.draw path{animation:none;stroke-dashoffset:0}.art.draw .e{animation:none;opacity:.8}}
body.noanim .art.draw path{animation:none;stroke-dashoffset:0}
body.noanim .art.draw .e{animation:none;opacity:.8}
/* Food. Today's loaf and frond sit at the header's far edge, clear of the title. */
.fthead{position:relative;isolation:isolate}
.fthead-art{position:absolute;z-index:-1;inset-inline-end:-6px;top:-10px;width:118px;height:auto;opacity:.75}
[dir="rtl"] .fthead-art{transform:scaleX(-1)}
/* The water's strands, the day's share bright. */
.fwater-art{margin:10px -4px -2px}
.fwater-art .art{width:100%;height:30px}
.art-wave .lvl{animation:none!important;stroke-dashoffset:0!important;transition:stroke-dasharray var(--m-screen) var(--e-ios)}
[dir="rtl"] .fwater-art .art{transform:scaleX(-1)}
/* A saved meal's + : one tap logs it whole. */
.dquick{flex:0 0 52px;display:grid;place-items:center;padding:0;background:none;border:none;color:var(--accentHi)}
.dquick svg{width:30px;height:30px;padding:7px;border-radius:50%;fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent-edge)}
.dquick:active svg{transform:scale(.92)}
/* An empty state with a drawing in place of the small icon. */
.artempty{padding-top:18px}
.empty-art{width:132px;height:auto;margin:0 auto 6px}
/* Targets: the gauge and its sword over today's numbers. */
.tghero{text-align:center;padding-top:14px}
.tghero-art{width:210px;max-width:70%;height:auto;margin:0 auto 4px}
.tghero-n{display:flex;align-items:baseline;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}
.tghero-n b{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em}
.tghero-n span{color:var(--dim);font-size:14px}
.tghero-s{margin:4px 0 0;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.tghero-s.over{color:var(--gold)}
.tgsug-r{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
.tgsug-r b{display:block;font-family:var(--display);font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.tgsug-r b.a{color:var(--text)}
.tgsug-r small{color:var(--dim);font-size:12px}
.tgsug .pgnote{margin:0;color:var(--ok)}
/* Home. The time of day's drawing rises behind the greeting's far side. */
.hgreet{position:relative;isolation:isolate}
.hgreet-art{position:absolute;z-index:-1;inset-inline-end:-10px;top:-18px;width:190px;height:auto;opacity:.7}
.hnote.gold{border-color:var(--gold)}
.hnote.gold h3{color:var(--gold)}
.hstack>.thero2,.hstack>.twk{margin:0}
/* Four tiles, each one tap. */
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.htile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:112px;padding:14px;
  border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);color:var(--text);text-align:start;
  box-shadow:var(--shadow-card);transition:transform var(--m-press) var(--e-standard)}
.htile:active{transform:scale(.97)}
.htile-i{display:grid;place-items:center;width:32px;height:32px;margin-bottom:6px;border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);color:var(--sub)}
.htile-i svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.htile-k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.htile-v{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.htile-v b{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.01em}
.htile-v small{font-size:12.5px;color:var(--dim)}
.htile-s{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.htile.water .htile-s{color:var(--accentHi);font-weight:700}
/* Progress: the trend running into the mane, where the banner's photo was. */
.pgbanner-art{position:absolute;z-index:-1;inset-inline-start:8px;top:50%;width:34%;height:auto;transform:translateY(-50%);opacity:.9}
[dir="rtl"] .pgbanner-art{transform:translateY(-50%) scaleX(-1)}
.pgbody-art{width:64px;height:auto;margin:10px auto 0;opacity:.8}
.phcal{margin-bottom:18px}
.phcal .dbday:disabled{opacity:.3}
/* Profile: the swirl as a ring around the initials. */
.pavwrap{position:relative;width:112px;height:112px;margin:0 auto;display:grid;place-items:center}
.pring{position:absolute;inset:0;width:100%;height:100%}
/* Train → Today: the recovery check-in. */
.rchk{margin-top:14px;padding:14px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised)}
.rchk-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rchk-h b{font-family:var(--display);font-size:15px}
.rchk-x{min-height:36px;padding:0 4px;background:none;border:none;color:var(--dim);font-size:13px}
.rchk-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.rchk-r>span{font-size:13px;color:var(--sub);flex:0 0 auto}
.rchk-c{display:flex;gap:6px}
.rchk-c button{min-width:44px;min-height:36px;padding:0 10px;border-radius:var(--rpill);border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--text);font-size:13px;font-weight:600}
.rchk-c button.on{background:var(--accent-tint);border-color:var(--accent-edge);color:var(--accentHi)}
.rchk-more{margin-top:6px}
.bauto{margin-top:10px}
.bauto .bnew-i{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent-edge)}
.bauto .bnew-i svg{fill:var(--accentHi);stroke:none}
.dset{color:var(--sub)}
.libhero .libhead{margin-bottom:14px}
.libhero .shk{margin-bottom:4px}
.libhero h1{font-size:30px}
.libq{margin-bottom:0}
.libq input{height:52px;border-radius:var(--rpill);padding-inline:46px 46px;font-size:16px;background:var(--bg);
  -webkit-appearance:none;appearance:none}
.libq input::-webkit-search-cancel-button,.libq input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.libq input:focus{border-color:var(--accentHi);box-shadow:0 0 0 3px rgba(230,30,40,.18);outline:none}
.libq .ico-search{inset-inline-start:18px}
.libq-x{position:absolute;inset-inline-end:8px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;
  border:none;background:var(--surface);color:var(--dim);font-size:13px}
.libfilters{gap:8px;margin:0 -16px 6px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.libfilters::-webkit-scrollbar{display:none}
.libfilters .pill{min-height:38px;padding:0 15px;border-radius:var(--rpill);font-size:13.5px;background:var(--raised)}
.libfilters .pill.a{background:rgba(230,30,40,.14);border-color:rgba(248,52,70,.6);color:var(--text)}
.libn{font-size:13px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.libtrow{gap:14px}
.libtrow>span:first-child{flex:0 0 auto}
.libtrow>span:nth-child(2){flex:1;min-width:0;text-align:start}
.libtrow .thumbwrap,.libtrow .thumb,.libtrow .thumb.ph{flex:0 0 auto;border-radius:12px;overflow:hidden}
.libtrow .trow-s b{font-weight:500;color:var(--sub)}
.libtrow .trow-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exd-form2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.exd-form2 figure{position:relative;margin:0;border-radius:var(--r4);overflow:hidden;border:1px solid var(--border);background:var(--raised);aspect-ratio:4/3}
.exd-form2 img{width:100%;height:100%;object-fit:cover;display:block}
.exd-form2 figcaption{position:absolute;inset-inline-start:8px;bottom:8px;padding:4px 10px;border-radius:var(--rpill);
  background:rgba(8,8,10,.72);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.exd-facts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--r4);background:var(--raised);overflow:hidden;margin-bottom:20px}
.exd-facts>div{display:flex;flex-direction:column;gap:3px;padding:12px 14px;min-width:0}
.exd-facts>div:nth-child(even){border-inline-start:1px solid var(--border)}
.exd-facts>div:nth-child(n+3){border-top:1px solid var(--border)}
.exd-facts span{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.exd-facts b{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.exd-uni{margin:-8px 0 16px;font-size:13px;line-height:1.45;color:var(--dim)}
.exd-card{padding:14px;border:1px solid var(--border);border-radius:var(--r4);background:var(--raised)}
.sheetbox .exd-h{margin:20px 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-family:inherit}
.exd-tips{border-radius:var(--r4)}
/* ---- Cardio & sports (session.js actBody, sheets "acts") ---------------------------- */
.acthead{justify-content:flex-start;gap:14px}
.actbadge{flex:0 0 52px;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,rgba(248,52,70,.35),rgba(120,10,16,.35) 70%);border:1px solid rgba(248,52,70,.6);color:#fff}
.acticon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actcard .steps{margin:0}
.act-lbl{margin:16px 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.act-lbl i{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;opacity:.8}
.actcard .setcard-h+.act-lbl{margin-top:4px}
.act-km{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:56px;border-radius:var(--r4);border:1px solid var(--border);background:var(--surface)}
.act-km input{flex:1;min-width:0;margin:0;border:none;background:none;font-family:var(--display);font-size:22px;font-weight:800;padding:0;min-height:54px}
.act-km input:focus{outline:none}
.act-km span{color:var(--dim);font-weight:700}
.act-int{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act-int button{min-height:48px;border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);color:var(--sub);font-size:13.5px;font-weight:700;padding:0 4px}
.act-int button.on{background:rgba(230,30,40,.16);border-color:rgba(248,52,70,.7);color:var(--text)}
.act-kcal{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:14px 16px;border-radius:var(--r4);
  background:rgba(230,30,40,.07);border:1px solid rgba(248,52,70,.25)}
.act-kcal span{color:var(--dim);font-size:14px}
.act-kcal b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.act-note{margin:14px 0 0;color:var(--dim);font-size:13px}
.act-log{margin-top:16px;min-height:58px;font-size:17px}
.act-log svg,.act-ok svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.act-done{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.act-row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:var(--r4);background:var(--surface);border:1px solid var(--border)}
.act-row.fresh{animation:rowIn var(--m-comp) var(--e-decel)}
.act-ok{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--ok);color:#fff}
.act-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.act-t b{font-family:var(--display);font-size:16px}
.act-t span{font-size:13px;color:var(--dim)}
.ttile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px}
.ttile.wide .ttile-i{margin:0;flex:0 0 40px}
.ttile-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ttile.wide .ttile-n{margin:0}
.ttile.wide .ico-chev{color:var(--dim)}
[dir="rtl"] .ttile.wide .ico-chev{transform:scaleX(-1)}
.actgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:88px;padding:10px 6px;
  border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);color:var(--text);font-size:13px;font-weight:600;text-align:center;
  transition:transform var(--m-press) var(--e-standard)}
.actbtn:active{transform:scale(.95)}
.actbtn .acticon{color:var(--accentHi)}
.actbtn span{line-height:1.2;overflow-wrap:anywhere}
.thumb.ph.act{display:grid;place-items:center;border-radius:12px;background:rgba(230,30,40,.12);color:var(--accentHi)}
/* ---- Rest: hide to a bar (session.js) ------------------------------------------------ */
.rt-hide{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-start:16px;z-index:2;display:flex;align-items:center;gap:6px;
  min-height:40px;padding:0 14px;border-radius:var(--rpill);border:1px solid var(--hair-hi);background:rgba(20,20,26,.7);
  color:var(--text);font-size:14px;font-weight:700}
.rt-hide svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.restbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;min-height:48px;padding:0 16px;border-radius:var(--rpill);
  border:1px solid rgba(248,52,70,.5);background:rgba(230,30,40,.12);color:var(--text);font-size:14px;font-weight:700}
.restbar b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--accentHi)}
.restbar i{margin-inline-start:auto;font-style:normal;color:var(--dim);font-weight:600}
/* ---- Progress: this week's sets per muscle ------------------------------------------ */
.pgshare-r.wv.ok .bar i{background:var(--ok)}
.pgshare-r.wv.low .bar i{opacity:.55}
.pgnote{margin:10px 0 0;font-size:12.5px;color:var(--dim);line-height:1.45}
/* ---- readiness, session effort, pain (session.js, sheets.js) ------------------------- */
.ready{margin:14px 0 0;padding:14px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised)}
.ready-h,.wc2-effort-h{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.ready-c{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ready-c button{min-height:44px;padding:0 2px;border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);
  color:var(--sub);font-size:12.5px;font-weight:700}
.ready-c button.on{background:rgba(230,30,40,.16);border-color:rgba(248,52,70,.7);color:var(--text)}
.ready-skip{display:block;margin:10px auto 0;border:none;background:none;color:var(--dim);font-size:13px;font-weight:600;min-height:32px}
.readynote,.painnote{margin:14px 0 0;padding:12px 14px;border-radius:var(--r4);font-size:13.5px;line-height:1.45}
.readynote{background:var(--raised);border:1px solid var(--border);color:var(--sub)}
.painnote{background:rgba(212,160,60,.10);border:1px solid rgba(212,160,60,.45);color:var(--text)}
.linkbtn{border:none;background:none;padding:0;color:var(--accentHi);font-weight:700;font-size:inherit;text-decoration:underline}
.ss-act.on{color:var(--gold);border-color:rgba(212,160,60,.5)}
.wc2-effort{margin-top:14px;text-align:start}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-art"></div>
  <div class="sp-glow"></div>
  <div class="sp-veil"></div>
  <div class="sp-embers">
    <i class="sp-em" style="left:16%;--dx:14px;animation-duration:7.2s;animation-delay:.2s"></i>
    <i class="sp-em" style="left:31%;--dx:-10px;animation-duration:8.6s;animation-delay:1.1s"></i>
    <i class="sp-em" style="left:48%;--dx:8px;animation-duration:6.4s;animation-delay:.6s"></i>
    <i class="sp-em" style="left:63%;--dx:-16px;animation-duration:9.1s;animation-delay:1.7s"></i>
    <i class="sp-em" style="left:78%;--dx:11px;animation-duration:7.8s;animation-delay:.9s"></i>
    <i class="sp-em" style="left:89%;--dx:-7px;animation-duration:8.2s;animation-delay:2.1s"></i>
  </div>
  <div class="sp-mid">
    <img class="sp-mark" src="mark.png" alt="">
    <div class="sp-name">BUNYAN</div>
    <div class="sp-rule"><i></i><b></b><i></i></div>
    <div class="sp-tag">Built Through Discipline</div>
  </div>
  <div class="sp-her" lang="ar" dir="rtl">بُنيان</div>
</div>
<div id="app"></div>
<nav id="nav"></nav>
<div id="wbar"></div>
<div id="sheet"></div>
<div id="rest"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
