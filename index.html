<script>
/* The theme before the first paint. render() sets it from the profile, but only after
   the stylesheet has already painted the default (Blue) once, so a Red or Sage
   user saw a flash of blue on every launch. bunyan:look is the last theme, mode and icon
   ("red|dark|red"), kept small for exactly this read (js/ui/theme.js writes it). The tab's
   icon and the one a phone puts on its Home Screen are the theme's own, or the one chosen
   in Settings (icon-180.png is Blue's). */
try{var l=(localStorage.getItem("bunyan:look")||"").split("|"),d=document.documentElement;
  /* Pink was replaced by Blue: a phone that last showed Pink opens in Blue. */
  if(l[0]==="pink")l[0]="blue";
  if(/^(red|blue|mono)$/.test(l[0]))d.setAttribute("data-palette",l[0]);
  /* The icon chosen in Settings, else the theme's. */
  var ic=/^(red|blue|mono)$/.test(l[2])?l[2]:l[0];
  if(/^(red|mono)$/.test(ic))[].forEach.call(document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]'),
    function(k){k.setAttribute("href","icon-"+ic+"-180.png");});
  if(/^(dark|light)$/.test(l[1]))d.setAttribute("data-theme",l[1]);}catch(e){}
</script>
<style>
/* ---- type: the two faces the Bunyan design is set in ---------------------------
   Outfit for titles and display numbers, Manrope for everything else — the pairing
   every frame in the Figma file uses. Both are SIL Open Font License (licences in
   fonts/), self-hosted rather than loaded from Google so the app still has its
   typography offline, which is the whole point of a PWA. Latin subset only: neither
   face has Arabic glyphs.

   Arabic has its own pair, chosen to match: Alexandria (geometric and bold, as Outfit
   is) for titles and figures, and Readex Pro (open and even, as Manrope is) for the
   rest. Both OFL, both variable, Arabic subset only (31 KB and 23 KB). They are
   declared under the Latin faces' own names with an Arabic unicode-range, so each
   family is one font to the stylesheet: an Arabic letter in a title is drawn in
   Alexandria, a Latin one in Outfit, and no rule has to know which language it holds.

   Manrope is a variable font, so one file carries every weight the design uses
   (400-700). Outfit is the variable file too, declared for 700-800: 700 for titles and
   figures, 800 for the splash wordmark, which is the only ExtraBold in the design.
   Nothing may ask Outfit for more than 800, or the browser fakes the weight. */
@font-face{font-family:"Manrope";src:url(fonts/manrope-latin.woff2) format("woff2");
  font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Outfit";src:url(fonts/outfit-latin.woff2) format("woff2");
  font-weight:700 800;font-style:normal;font-display:swap}
@font-face{font-family:"Outfit";src:url(fonts/alexandria-arabic.woff2) format("woff2");
  font-weight:700 800;font-style:normal;font-display:swap;
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}

  font-weight:400 700;font-style:normal;font-display:swap;
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
:root{

     one (---- themes), so a theme is one place to read and one place to change. */

  --r1:8px; --r2:12px; --r3:14px;
  /* ---- the dock and the surfaces that borrow from it --------------------------
     One visual language, taken from the floating dock: large radii, a translucent
     dark surface with a hairline edge, depth from a soft shadow rather than from
     borders, and the accent as a tinted glow rather than a fill. Components that are
     the same kind of control — segmented tabs, range chips, the date navigator —
     read these rather than carrying their own numbers.

     Radii run 8 / 12 / 14 (--r1–r3, cards and fields), 18 for controls inside a
     surface, 28 for floating surfaces, and a pill. */
  --r4:18px; --r5:28px; --rpill:999px;
  --dock-hair:rgba(255,255,255,.08);     /* the dock's own, the same in every theme */

     of the viewport to the top of the dock. The body pads by it, and the toast and
     the floating add button sit above it, so no screen carries its own number. */

     boot and whenever the in-app animation toggle changes, and an inline property beats
     a stylesheet rule, so these values apply only to the first paint before the module
     runs — and to any load where it fails to.

     for a while: nine of the thirteen were the pre-Phase-3 values, left behind when
     motion.js was introduced, while this comment claimed they matched. If you change a
     duration or a curve, change it in motion.js and mirror it here, or delete this block
     and accept one unstyled frame. Do not let them drift again. */

/* ---- themes ---------------------------------------------------------------------

   Monochrome) — each in dark and light,
   chosen in App settings (Theme, and Mode). A theme is a block of the same tokens below;
   nothing else in this stylesheet names a colour, so every surface, control, chart,
   drawing and photo follows the one that is on. html carries data-palette (red, blue,
   mono) and data-theme (dark, light); any element can carry them too, which is how the
   theme picker draws each theme's preview inside whichever theme is on.

   Roles, for anyone adding a screen: bg the page · raised a card (elevated surface) ·
   surface a chip or well inside one · border, hair the edges and dividers · text, sub,
   dim the three levels of type · accent the primary (fills, rings, the active tab) and
   accent-deep its pressed/lower stop · onAccent type on it · accentHi accent as text ·
   secondary and figure the theme's highlight · ok done · warning a caution · danger
   destructive and error · gold earned · scrim the overlay · glow-rgb coloured light ·
   img-tone how photos are recoloured · mac-p/c/f the macro series, validated as a set.

   give them. Blue is built from the night-blue reference the owner chose to replace
   Pink with: its navy ground, its steel blue and its signal green. Sage is the owner's

/* Glass: the cards in the page take the theme's card fill, a tint of the ground rather

   glow or gradient stays on top of it. Sheets, toasts and bars that float over the page
   keep their solid fills. */

  .chat-a,.chatcard,.chat-topics,.coachplan,.coachhero,.ready){background-color:var(--card);border-color:var(--card-edge)}

   --navh already includes the safe area (through --dock-lift), so adding it again here
   would double-count. This is the only place the reserve is applied. */
body{padding-bottom:calc(var(--navh) + 20px)}
/* The document has to be at least as tall as the viewport, or a short screen — Home
   with nothing logged is the shortest — leaves the page shorter than the window. The
   nav is position:fixed and so is pinned either way in a compliant engine, but iOS
   Safari lays fixed elements out against the LARGE viewport while showing the SMALL
   one whenever the page cannot scroll, which is what put the bar above the bottom
   edge with a dead band beneath it. A page that always fills the viewport can always
   scroll the toolbar away, so the two viewports agree.

   100dvh is the dynamic viewport: it tracks the browser chrome collapsing instead of
   freezing at its largest. The 100vh line before it is the fallback for engines that
   do not know dvh — declaration order does the feature test, no @supports needed. */

/* The Home Screen app. iOS 26 standalone, with viewport-fit=cover and the translucent
   status bar this app uses, resolves 100%, 100svh and 100dvh to the screen height
   MINUS the top safe-area inset — about 50pt short. On a screen with little on it
   (Home, mostly) the document therefore ends above the bottom of the display, and
   iOS pins fixed elements to the end of the document rather than of the screen: the
   dock sat a status bar's height too high over a dead band, and dropped into place
   only when a long screen (Train) made the document taller than the display.

   100lvh is the one unit iOS reports as the full screen there, so the document is
   made at least that tall — in the installed app only. A Safari tab keeps 100dvh,
   because there the toolbar really does take that space. html.standalone is the

   "fixed to that ancestor". Keep it outside anything that transforms.

   name still reads in its own direction. */

.wbar:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}

/* ================= intro
   The warrior and horse in shadow, the mark settling over it. Slow and atmospheric:
   a push-in that comes to rest, a mark that breathes, tracking that tightens. No
   fighting, no effects, nothing that reads as a game. */
/* The splash sits on the artwork's own black, not the app's #0b0b0c. intro.jpg's ground   measures about rgb(4,4,6) at every edge; on a lighter page the picture's bottom edge   showed as a line across the screen at y=583. Matching the art removes the step at   every screen size, and the splash still fades out into the app ground, so there is no   edge there either. */
/* The lockup sits low on purpose: the rider and horse own the upper two thirds, the
   mark sits over the rock and the ember glow at their feet. Centred, the mark landed
   on the horse and the two read as one confused shape. */
#splash{position:fixed;inset:0;z-index:400;background:#040406;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  animation:spOut .6s cubic-bezier(.4,0,.7,1) 3.05s forwards}
/* The artwork is square and the screen is tall, so it is sized to the width and set
   high rather than cover-cropped, which would cut the rider in half. Its own ground is
   near-black, so it blends into the splash background with no visible edge.
   If intro.jpg is missing the composition still holds on the ember glow alone. */
#splash .sp-art{position:absolute;inset:0;
  background-image:url("intro.jpg");
  background-repeat:no-repeat;
  background-position:center 18%;
  background-size:min(130%,640px) auto;
  /* Feathered so the square artwork dissolves into the ground instead of showing
     its edge as a seam across the screen. */
  -webkit-mask-image:radial-gradient(74% 64% at 50% 42%,#000 54%,transparent 100%);
  mask-image:radial-gradient(74% 64% at 50% 42%,#000 54%,transparent 100%);
  opacity:0;transform:scale(1.12);
  animation:spArt 2.7s cubic-bezier(.16,.72,.24,1) .12s forwards}
#splash .sp-glow{position:absolute;left:50%;top:60%;width:132vw;height:132vw;
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,rgba(var(--glow-rgb),.34),rgba(4,4,6,0) 70%);
  animation:spGlowIn 1.9s ease .25s forwards, spBreathe 5s ease-in-out 2s infinite alternate}
/* Open through the middle so the rider reads, closed at the edges and the foot so the
   frame stays in shadow and the tagline stays legible. */
#splash .sp-veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(138% 92% at 50% 44%,rgba(4,4,6,0) 48%,
      rgba(4,4,6,.62) 80%,#040406 100%),
    linear-gradient(180deg,rgba(4,4,6,.62) 0%,rgba(4,4,6,0) 22%,
      rgba(4,4,6,0) 56%,rgba(4,4,6,.78) 86%,#040406 100%)}
#splash .sp-embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#splash .sp-em{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:2px;
  background:var(--accentHi);opacity:0;animation-name:spEm;animation-timing-function:linear;
  animation-iteration-count:infinite}
#splash .sp-mid{position:relative;z-index:2;text-align:center;margin-bottom:15vh;margin-bottom:15dvh}
/* No shaped scrim behind the lockup on purpose: any radial dark enough to help is also
   dark enough to read as an oval painted over the artwork. Legibility comes from the
   frame veil, the text shadows below, and the mark's own glow. */
#splash .sp-mark{display:block;margin:0 auto;width:112px;height:112px;
  opacity:0;transform:translateY(14px) scale(.82);
  animation:spMark 1.2s cubic-bezier(.2,.72,.24,1) .62s forwards,
            spMarkGlow 3.4s ease-in-out 1.6s infinite alternate}
/* The lockup's type is the Figma splash frame's (node 2:11): the wordmark in Outfit
   ExtraBold at 56px in the design's warm off-white, a split divider, and the tagline in
   Manrope SemiBold. The rider, the horse-and-sword mark, the embers and the reveal are
   Bunyan's own and stay exactly as they were — the frame's stone image is not used. */
#splash .sp-name{font-family:var(--display);font-size:56px;font-weight:800;line-height:1;
  color:#faf6ee;margin-top:22px;letter-spacing:.04em;text-indent:.04em;opacity:0;
  text-shadow:0 2px 26px rgba(4,4,6,.92),0 0 10px rgba(4,4,6,.7);
  animation:spName 1.3s cubic-bezier(.2,.7,.3,1) 1.15s forwards}
/* The design's divider: 30px of accent, 120px of hairline grey, 30px of accent. It
   draws outward from the centre, as the old rule did. */
#splash .sp-rule{display:flex;align-items:center;justify-content:center;width:180px;height:2px;
  margin:14px auto 0;transform:scaleX(0);
  animation:spRule .95s cubic-bezier(.2,.7,.3,1) 1.55s forwards}
#splash .sp-rule i{display:block;height:2px;width:30px;background:var(--accent)}

#splash .sp-tag{font-size:14px;font-weight:600;text-transform:uppercase;color:#d5d1c9;
  letter-spacing:.06em;text-indent:.06em;
  margin-top:14px;opacity:0;text-shadow:0 1px 12px rgba(4,4,6,.9);
  animation:spTag .9s ease 1.9s forwards}
/* The frame's "heritage touch": the name in Arabic, faint, at the foot, in the
   display face (Alexandria, for Arabic).
   The frame's "V 1.0.4" is placeholder text — the app has no version number to show. */
#splash .sp-her{position:absolute;left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom));
  z-index:2;text-align:center;font-size:20px;color:#888580;opacity:0;
  font-family:var(--display);font-weight:700;
  animation:spHer .9s ease 2.1s forwards}

   run: "1,220 / 2,500", "96 g / 160 g". Each container here is shrink-wrapped or
   centred, so turning it left-to-right moves nothing but the order inside it. A figure
   with an Arabic unit (83.9 كجم) is left alone: Arabic puts the unit after it. The
   figures inside running text are isolated by i18n/bidi.js. */
[dir="rtl"] .htile.kcal .htile-v,[dir="rtl"] .htile.water .htile-v,
[dir="rtl"] .tghero-n,[dir="rtl"] .fring2-n{direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .fmac2-v{direction:ltr;unicode-bidi:isolate;text-align:right}
.setcard-c .num{display:inline}
/* ================= sheet chrome: sticky header so long sheets stay dismissible */
.sheetbox{position:relative}
/* top matches the negative margin: with top:0 the sticky box shifts down into the
   content and clips the sheet title. */
.sheethead{position:sticky;top:-20px;z-index:5;margin:-20px -16px 8px;padding:14px 16px 10px;
  background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:flex-end}
.sheethead .x{flex:0 0 38px;width:38px;height:38px;border-radius:19px;border:1px solid var(--border);
  background:var(--surface);color:var(--dim);font-size:19px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center}
:root:not(.tch) .sheethead .x:active,.sheethead .x.tapd{background:var(--raised)}
/* Both sheet-head controls are drawn as 38px discs, which is the design and is 6px
   short of the minimum target. The disc stays 38px and an invisible 3px outset takes
   the tappable area to 44 — growing the circles instead would redraw the header of
   all 21 sheets to fix a hit area nobody can see. */
.sheethead .x,.favstar{position:relative}
.sheethead .x::after,.favstar::after{content:"";position:absolute;inset:-3px}
/* The handle now does what it always looked like it did. */
/* ---- Search sheets (the exercise picker, Add Food) ---------------------------------
   A fixed top — title, field, filters — over a list that scrolls on its own. The old
   picker scrolled as one piece with a sticky field over a transparent head, so rows
   slid up into view above the field, and the ✕ sat on top of them.

   The sheet's height follows the visual viewport (--vvh, set from visualViewport in
   view.js): with the keyboard up the sheet ends where the keyboard begins, rather
   than running on underneath it. The height is fixed, never "as tall as the
   results", so a search that finds nothing cannot collapse the sheet under a finger. */
.sheetbox.srch{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0;max-height:none;
  height:min(92vh,calc(var(--vvh,100vh) - 10px));height:min(92dvh,calc(var(--vvh,100dvh) - 10px))}
.srch .sheethead{position:relative;top:auto;flex:0 0 auto}
/* These run edge to edge with negative margins, which the sheet's max-width guard
   would otherwise cap — the same fix the head needed. */
.sheetbox .srch-body,.sheetbox .srch-foot,.sheetbox .libfilters{max-width:none}
.srch-top{flex:0 0 auto;padding-bottom:4px}
.srch-title{margin:0 0 14px}
.srch-top .libq{margin-bottom:10px}
.srch-top .libfilters{margin-bottom:2px}
.srch-top .afhead{margin-bottom:12px}
.srch-top .aftabs{margin:10px 0 8px}
.afq input::-webkit-search-cancel-button,.afq input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.afq input{-webkit-appearance:none;appearance:none}
.srch-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  margin:0 -16px;padding:6px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.srch-foot{flex:0 0 auto;margin:0 -16px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--bg)}
.srch-foot .btn{margin:0}
.srch-n{font-size:12.5px;color:var(--dim);margin:4px 0 10px}
/* While typing, the keyboard owns half the screen, so the title and the counts step
   aside and the results keep the room. */
body.kb .srch .srch-hide,body.kb .srch .srch-title{display:none}
.pkrow .pkadd{flex:0 0 36px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accentHi-rgb),.45);color:var(--accentHi);
  font-size:20px;font-weight:600;line-height:1;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .pkrow:active .pkadd,.pkrow.tapd .pkadd{transform:scale(.9)}
.pkrow.on{background:rgba(var(--accent-rgb),.06)}
.pkrow.on .pkadd{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-size:16px}
.pkswap{flex:0 0 auto;padding:7px 14px;border-radius:var(--rpill);border:1px solid rgba(var(--accentHi-rgb),.5);
  color:var(--accentHi);font-size:13px;font-weight:700}
.grab{position:absolute;left:50%;top:7px;transform:translateX(-50%);
  width:38px;height:4px;border-radius:2px;background:var(--border)}
:root:not(.tch) .sheethead:active .grab,.sheethead.tapd .grab{background:var(--dim)}
/* While a finger is on it the sheet follows directly, so no transition; the class is
   removed on release so the spring-back and the dismiss can animate. */
.sheetbox *{max-width:100%}
/* The head is the one child that is meant to be wider than the sheet's content box:
   it pulls out to the full width with negative inline margins so its underline spans
   edge to edge. The overflow guard above caps every child at the content width, which
   silently defeated that — the head came out 33.6px narrow and the close button, which
   is correctly 16px from the head's own edge, ended up 48.8px inside the sheet's,
   reading as floating toward the middle rather than seated in the corner. */
.sheetbox .sheethead{max-width:none}
.sheetbox img,.sheetbox svg{max-width:100%;height:auto}
/* The amount, big enough to tap, with its steppers either side. */
.fqty{display:flex;align-items:center;gap:10px}
.fqty-v{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:10px;min-height:44px;padding:0 12px;
  font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
:root:not(.tch) .fqty-v:active,.fqty-v.tapd{background:var(--raised)}
.facts{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;padding-inline-start:2px}
.facts button{background:none;border:none;padding:6px 0;min-height:44px;
  color:var(--dim);font-size:13.5px;font-weight:600;letter-spacing:.02em}
.facts button.danger{color:var(--faint)}
:root:not(.tch) .facts button:active,.facts button.tapd{color:var(--accentHi)}
.sheetbox.dragging{transition:none!important;animation:none!important}
/* animation:none on both, not just .dragging. A CSS animation outranks an inline
   style, so releasing mid-entry handed the sheet back to sheetIn, which pulled it
   up to its own keyframe before the close ran — the "goes up, then closes" bug. */
.sheetbox.settling{transition:transform var(--m-comp) var(--e-decel);animation:none!important}

/* ================= workout session: execution surface, not an editor */
.ss-top{position:sticky;top:0;z-index:30;
  margin:calc(-20px - env(safe-area-inset-top)) calc(-1 * var(--gutter)) 16px;
  padding:calc(12px + env(safe-area-inset-top)) var(--gutter) 11px;
  background:var(--bg);border-bottom:1px solid var(--border)}
.ss-row{display:flex;align-items:center;gap:10px}
/* A red ✕, not an arrow. The box stays 36px so the title and the rest of the header
   do not move, and the -4px margins buy the 44px touch target back out of the row's
   own padding rather than by growing the button. */
.ss-back{width:44px;height:44px;margin:-4px;flex-shrink:0;border:none;background:none;
  color:var(--accent);font-size:22px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center}
:root:not(.tch) .ss-back:active,.ss-back.tapd{color:var(--accentHi)}
/* The title is a button: it opens today's exercises (the "exlist" sheet). */
.ss-title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;margin:0;padding:2px 0;
  border:none;background:none;color:var(--text);font:inherit;text-align:start;cursor:pointer;border-radius:var(--r1)}
:root:not(.tch) .ss-title:active,.ss-title.tapd{opacity:.7}
.ss-name{display:block;max-width:100%}
.ss-meta{display:block}
.ss-caret{width:13px;height:13px;margin-inline-start:2px;vertical-align:-2px;fill:none;stroke:currentColor;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ss-name{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ss-meta{font-size:11.5px;color:var(--dim);margin-top:1px}
/* A bare dot between two digits reads as one number at phone size. */
.ss-meta .sep{display:inline-block;margin:0 7px;opacity:.55}
.ss-clock{flex-shrink:0;display:flex;align-items:center;gap:6px;
  border:1px solid var(--accent);border-radius:20px;padding:7px 13px;
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.ss-clock i{width:7px;height:7px;border-radius:4px;background:var(--accentHi);display:block;
  animation:livedot 2.4s ease-in-out infinite}
@keyframes livedot{0%,100%{opacity:1}50%{opacity:.32}}
/* The pill already existed; it now carries the paused state under the digits. */
.ss-clock{margin-inline-start:auto;flex-direction:column;align-items:flex-end;gap:0;padding:6px 12px}
.ss-clock .num{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.ss-paused{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accentHi);margin-top:1px}
.ss-bar{height:3px;background:var(--raised);border-radius:2px;overflow:hidden;margin-top:11px}
.ss-bar i{display:block;height:3px;background:var(--accent);border-radius:2px;
  transition:width var(--m-data) var(--e-decel)}
/* The segments with a step either side: ‹ ▬▬▬ ›. */
.ss-nav{display:flex;align-items:center;gap:6px;margin:0 -10px 18px}
.ss-nav .ss-seg{flex:1;min-width:0;margin:0}
.ss-navb{flex:none;display:grid;place-items:center;width:44px;height:44px;margin:-6px 0;padding:0;border:none;
  background:none;color:var(--sub);border-radius:50%;cursor:pointer;transition:color var(--m-micro) var(--e-standard)}
.ss-navb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
:root:not(.tch) .ss-navb:active:not(:disabled),.ss-navb.tapd:not(:disabled){color:var(--accentHi);transform:scale(.92)}
.ss-navb:disabled{opacity:.28;cursor:default}
[dir="rtl"] .ss-navb svg{transform:scaleX(-1)}
/* The exercise itself, as one pane a sideways swipe moves (js/ui/exswipe.js). Vertical
   panning stays the browser's; sideways is the swipe's. */
.ex-pane{touch-action:pan-y;will-change:auto}
.ss-seg{display:flex;gap:4px;margin:0 0 18px}
.ss-seg button{flex:1;padding:9px 0;background:none;border:none;position:relative}
.ss-seg button:after{content:"";position:absolute;left:0;right:0;top:-11px;bottom:-11px}
.ss-seg span{display:block;height:4px;border-radius:2px;background:var(--raised)}
/* Superset members share one continuous bar so the pair reads as a unit. */
.ss-seg button.gp{padding-left:1px;padding-right:1px}
.ss-seg button.gp span{border-radius:0}
.ss-seg button.gp1 span{border-radius:2px 0 0 2px}
.ss-seg button.gpN span{border-radius:0 2px 2px 0}
.ss-seg button.gp:after{content:"";position:absolute;left:0;right:0;top:2px;height:1px;
  background:var(--gold);opacity:.55}
.ss-seg button.gp1:after{left:2px}
.ss-seg button.gpN:after{right:2px}
.pill.sup{background:var(--accentSoft);color:var(--gold);border-color:transparent}
.glabel{display:inline-block;min-width:22px;color:var(--gold);font-weight:800;
  font-size:12px;letter-spacing:.04em}
.item.grouped{border-left:2px solid var(--gold)}
[dir="rtl"] .item.grouped{border-left:none;border-right:2px solid var(--gold)}
.ss-seg button.on span{background:var(--accent)}
.ss-seg button.did span{background:var(--ok)}

.ex-head{display:flex;align-items:center;gap:13px;margin-bottom:6px}
.ex-head .exth{border:none;background:none;padding:0;flex-shrink:0}
.ex-name{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:0;
  text-transform:none}
.ex-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}

.setgrid{margin-top:16px}
.setrow{display:grid;align-items:center;gap:6px;padding:7px 9px;border-radius:12px;
  border:1px solid transparent;background:var(--surface);margin-bottom:7px;
  transition:border-color var(--m-micro) var(--e-standard), background var(--m-micro) var(--e-standard)}
.setrow.hd{background:none;border:none;padding:0 9px 6px;margin-bottom:2px}
.setrow.hd span{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);text-align:center}
.setrow.hd span:nth-child(2){text-align:start}
.setrow.on{border-color:var(--accent);background:var(--accentSoft)}
.setrow.pend{opacity:.55}
.setrow.warm{opacity:.7}
.setrow.warm .cell{color:var(--dim)}
.wtog{background:none;border:none;padding:0;font:inherit;position:relative}
.wtog:after{content:"";position:absolute;left:-6px;right:-6px;top:-10px;bottom:-10px}
/* Beats .setrow.did .setnum, which is declared further down. */
.setrow.did.warm .setnum{color:var(--gold)}
.setnum{font-size:15px;font-weight:800;text-align:center;color:var(--dim);
  font-variant-numeric:tabular-nums}
.setrow.on .setnum{color:var(--accentHi)}
.setrow.did .setnum{color:var(--text)}
/* Last time, under the boxes it is the reference for: its own line, as wide as they are. */
.setprev{grid-column:3/-2;grid-row:2;margin-top:-1px;font-size:12px;line-height:1.2;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:start}
.setprev span{color:var(--faint);font-weight:600}
.setprev b{font-weight:700;font-variant-numeric:tabular-nums}
.cell{background:var(--raised);border:1px solid var(--border);border-radius:9px;height:42px;
  text-align:center;font-size:16px;font-weight:700;color:var(--text);width:100%;padding:0;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.cell::-webkit-outer-spin-button,.cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell:focus{outline:none;border-color:var(--accent);background:var(--accentSoft)}
.cell.rp{color:var(--accentHi)}
.cell:disabled{opacity:.6}
.cellmute{height:42px;display:flex;align-items:center;justify-content:center;color:var(--faint);
  font-size:15px}
.logbtn{width:38px;height:38px;border-radius:19px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:19px;font-weight:600;padding:0;margin:0 auto;
  display:flex;align-items:center;justify-content:center;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .logbtn:active,.logbtn.tapd{transform:scale(.88)}
.logbtn.go{border-color:var(--accent);background:var(--accent);color:var(--onAccent);
  box-shadow:0 5px 18px rgba(var(--glow-rgb),.42)}
.logbtn.done{border-color:var(--ok);background:var(--ok);color:#fff}
.logbtn.off{opacity:.3}
@keyframes setpop{0%{transform:scale(.6);opacity:0}55%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
.logbtn.done.fresh{animation:setpop var(--m-pop) var(--e-spring)}

/* Row start. No left/right anywhere: the grid follows the writing direction, so this
   sits on the right in Arabic on its own. */
.delset{width:24px;height:24px;min-height:24px;padding:0;border:none;background:none;
  color:var(--faint);font-size:12px;line-height:1;border-radius:12px;position:relative}
/* The glyph is small; the thing you can hit is not. */
.delset:after{content:"";position:absolute;left:-10px;right:-10px;top:-10px;bottom:-10px}
:root:not(.tch) .delset:active,.delset.tapd{background:var(--accentSoft);color:var(--accentHi)}
.setrow.hd .delset{visibility:hidden}
.addrow{display:flex;justify-content:center;margin:2px 0 4px}
.addset{width:44px;height:44px;border-radius:22px;border:1px dashed var(--border);
  background:var(--surface);color:var(--dim);font-size:23px;font-weight:300;line-height:1;
  padding:0;transition:transform var(--m-press) var(--e-standard),background .12s ease,color .12s ease}
:root:not(.tch) .addset:active,.addset.tapd{background:var(--accentSoft);color:var(--accentHi);transform:scale(.9)}
.favstar{flex:0 0 38px;width:38px;height:38px;border-radius:19px;border:1px solid var(--border);
  background:var(--surface);color:var(--faint);font-size:19px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;margin-inline-end:8px}
.favstar.on{color:var(--gold);border-color:var(--gold)}
:root:not(.tch) .favstar:active,.favstar.tapd{background:var(--raised)}
/* ---- The date navigator (js/ui/datebar.js) — Food, Progress and Train ------------
   A capsule in the dock's language: glass-dark surface, hairline edge, round arrow
   buttons at either end, the date as the tappable centre. Today reads warmest — a
   soft accent edge and glow — so "am I looking at today?" is answered before the
   words are read. Only the date text slides when the day changes; the surface never
   moves. */
.dnav-wrap{margin-bottom:var(--s3)}
.seg+.dnav-wrap{margin-top:12px}
.dnav{position:relative;display:flex;align-items:center;gap:6px;min-height:76px;padding:8px;
  border-radius:var(--r5);overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)) ,var(--raised);
  border:1px solid var(--border);box-shadow:var(--shadow-card);touch-action:pan-y}
.dnav.now{border-color:var(--accent-edge);
  box-shadow:var(--shadow-card),0 0 0 1px rgba(var(--glow-rgb),.06),0 8px 30px -12px var(--accent-glow)}
/* The drawing: the Bunyan horse, faint, bleeding off the right edge in a red haze. */
.dnav.art{min-height:104px}
.dnav.art::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 120% at 88% 40%,rgba(var(--glow-rgb),.28),transparent 70%)}
.dnav-art{position:absolute;z-index:-1;inset-inline-end:-26px;top:50%;width:136px;height:auto;
  transform:translateY(-50%);opacity:.26;pointer-events:none;
  filter:drop-shadow(0 0 18px rgba(var(--glow-rgb),.55));
  -webkit-mask:linear-gradient(90deg,transparent,#000 45%);mask:linear-gradient(90deg,transparent,#000 45%)}
[dir="rtl"] .dnav-art{transform:translateY(-50%) scaleX(-1);
  -webkit-mask:linear-gradient(270deg,transparent,#000 45%);mask:linear-gradient(270deg,transparent,#000 45%)}
.dnav-arrow{flex:0 0 44px;width:44px;height:44px;border-radius:var(--rpill);padding:0;
  display:flex;align-items:center;justify-content:center;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--hair);
  transition:transform var(--m-press) var(--e-standard),background var(--m-micro) var(--e-standard)}
.dnav-arrow svg,.dnav-back svg,.dnav-d svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dnav-arrow svg{width:20px;height:20px}
[dir="rtl"] .dnav-arrow svg{transform:scaleX(-1)}
:root:not(.tch) .dnav-arrow:active,.dnav-arrow.tapd{transform:scale(.92);background:rgba(255,255,255,.09)}
.dnav-arrow:disabled{opacity:.3}
.dnav-arrow.sm{flex-basis:40px;width:40px;height:40px}
.dnav-mid{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:6px 4px;border:0;border-radius:var(--r4);background:none;color:var(--text);
  transition:background var(--m-micro) var(--e-standard)}
:root:not(.tch) .dnav-mid:active,.dnav-mid.tapd{background:rgba(255,255,255,.04)}
.dnav-mid:focus-visible,.dnav-arrow:focus-visible,.dnav-back:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.dnav-k{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.dnav-d{display:inline-flex;align-items:center;gap:8px;max-width:100%}
.dnav-d>svg{width:18px;height:18px;flex-shrink:0;color:var(--dim)}
.dnav-t{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dnav.art .dnav-t{font-size:20px;letter-spacing:.01em;text-transform:none}
.dnav-c{display:inline-flex;color:var(--dim);transition:transform var(--m-micro) var(--e-standard)}
.dnav-c svg{width:16px;height:16px}
.dnav-c.up{transform:rotate(180deg)}
.dnav-s{font-size:12.5px;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The date slides in from the side it came from; the second line fades with it. */
.dnav-d.fwd{animation:dnavFwd var(--m-comp) var(--e-ios)}
.dnav-d.back{animation:dnavBack var(--m-comp) var(--e-ios)}
@keyframes dnavFwd{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes dnavBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
[dir="rtl"] .dnav-d.fwd{animation-name:dnavBack}
[dir="rtl"] .dnav-d.back{animation-name:dnavFwd}
.dnav-back{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px auto 0;min-height:36px;
  padding:0 14px;border:0;border-radius:var(--rpill);background:none;color:var(--accentHi);
  font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.dnav-back svg{width:14px;height:14px}
:root:not(.tch) .dnav-back:active,.dnav-back.tapd{background:var(--accent-tint)}
[dir="rtl"] .dnav-k,[dir="rtl"] .dnav-t,[dir="rtl"] .dnav-back{letter-spacing:0}
/* The month, when the date is tapped. */
.dbcal{margin-top:10px;padding:12px;border-radius:var(--r5);background:var(--raised);border:1px solid var(--border)}
.dbcal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dbgrid{display:grid;grid-template-columns:repeat(7,1fr);margin-top:10px;
  /* As wide as 5px where there is room, and never so wide that a day falls under the
     44px hit-area minimum. */
  gap:max(0px,min(5px,calc((100% - 7 * 44px) / 6)))}
.dbwk{text-align:center;font-size:11px;font-weight:700;color:var(--dim);padding-bottom:4px}
.dbday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;font-size:13.5px;border:1px solid transparent;padding:0;position:relative;
  background:none;color:var(--sub);font-variant-numeric:tabular-nums;
  transition:background var(--m-micro) var(--e-standard),transform var(--m-press) var(--e-standard)}
:root:not(.tch) .dbday:active,.dbday.tapd{transform:scale(.92)}
.dbday:disabled{opacity:.3}
.dbday.today{border-color:var(--accent-edge);color:var(--text);font-weight:700}
.dbday.sel{background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--onAccent);font-weight:800;
  box-shadow:0 6px 16px var(--accent-glow)}
.dbdot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:2px;background:var(--ok)}
.dbdot.t{background:var(--accentHi)}
.dbday.sel .dbdot{background:var(--onAccent)}
.target{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px dashed var(--border);border-radius:12px;padding:11px 13px;margin-top:4px}
.target .tl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint)}
.target .tv{font-size:14px;font-weight:800;color:var(--accentHi);font-variant-numeric:tabular-nums}
.ss-foot{display:flex;gap:8px;margin-top:18px}
.ss-foot button{flex:1;padding:12px 0;border-radius:var(--r1);border:1px solid var(--border);
  background:var(--surface);color:var(--dim);font-size:12.5px;font-weight:700}

/* ================= rest: full-screen, one job */
/* The zero state. The countdown screen is dark with a faint accent wash; this one is
   the accent, full bleed, so it is unmistakable across a gym with the phone face up on
   a bench and the sound muted by the side switch. That is the whole design brief for
   it: it has to work as the only alert. */
.restwrap.done{background:var(--accent);background-image:none;
  animation:restFlash var(--m-comp) var(--e-decel)}
@keyframes restFlash{from{background-color:var(--bg)}to{background-color:var(--accent)}}
:root.reduced .restwrap.done{animation:none}
.restwrap.done .restlabel{color:var(--onAccent);opacity:.72}
.restdone-big{font-size:clamp(40px,13vw,64px);font-weight:800;letter-spacing:-.02em;
  text-transform:uppercase;color:var(--onAccent);text-align:center;
  margin:var(--s4) 0 var(--s5);line-height:1}
.restwrap.done .upnext{border-color:rgba(255,255,255,.28)}
.restwrap.done .ul{color:var(--onAccent);opacity:.72}
.restwrap.done .uv,.restwrap.done .ur{color:var(--onAccent)}
/* Inverted: on the accent ground the affirmative control is the pale one. */
/* Scoped to .restwrap.done so it outranks .rbtn.main, which is two classes and would
   otherwise keep its accent fill — leaving an accent button invisible on an accent
   ground, which is exactly how it first rendered. Third cascade bug of this shape in
   this project; check computed styles, not the rule you just wrote. */
.restwrap.done .restdone-go{background:var(--onAccent);color:var(--accent);
  border-color:var(--onAccent);min-width:min(78vw,320px)}
.restwrap{position:fixed;inset:0;z-index:90;background:var(--bg);
  background-image:radial-gradient(76% 44% at 50% 45%,rgba(var(--glow-rgb),.28) 0%,rgba(10,10,12,0) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px calc(28px + env(safe-area-inset-bottom));animation:fadeIn .22s ease}
.restlabel{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accentHi)}
.restsub{color:var(--dim);font-size:14px;margin-top:7px;text-align:center}
.ringwrap{position:relative;width:236px;height:236px;margin:26px 0 4px}
.ringwrap svg{width:236px;height:236px;transform:rotate(-90deg);display:block}
.ringwrap .ct{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.restdig{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums}
.resttot{font-size:12px;color:var(--faint);margin-top:7px;font-variant-numeric:tabular-nums}
.restctl{display:flex;align-items:center;gap:12px;margin-top:22px}
.rbtn{height:52px;min-width:66px;padding:0 18px;border-radius:26px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .rbtn:active,.rbtn.tapd{transform:scale(.94)}
.rbtn.main{background:linear-gradient(180deg,var(--accent),var(--accent-deep));border-color:var(--accent);color:var(--onAccent);min-width:136px;
  font-size:15px;letter-spacing:.05em;text-transform:uppercase;
  box-shadow:0 8px 26px rgba(var(--glow-rgb),.34)}
.upnext{margin-top:30px;width:100%;max-width:380px;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;padding:14px;text-align:center}
.upnext .ul{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint)}
.upnext .uv{font-size:17px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.upnext .ur{font-size:12.5px;color:var(--accentHi);margin-top:3px;font-weight:600}
.restskip{margin-top:22px;background:none;border:none;color:var(--dim);font-size:13.5px;
  font-weight:700;padding:10px 16px}
/* The arrow this replaced had to mirror in RTL. A ✕ is symmetrical, so flipping it
   was a no-op that would have silently un-centred it once the box changed size. */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 14px);background:var(--raised);
  border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:12px;
  font-size:14px;z-index:200;max-width:88%;text-align:center;
  display:flex;align-items:center;gap:14px}
.toast-undo{background:none;border:none;color:var(--accentHi);font-size:14px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;padding:6px 2px;flex-shrink:0}

/* Interface density. The preference was stored and read by nothing; this is what it
   was always meant to do. Padding only — touch targets stay above the 44px minimum. */
body.compact{--s3:9px;--s4:12px;--s5:18px;--s6:24px}
body.compact .card{padding:12px}
body.compact .item{padding:12px var(--s4)}
body.compact h1{font-size:27px}
body.compact .overline{margin:16px 0 9px}
body.compact .sec{margin:16px 0 7px}
body.compact .setrow{padding:5px 8px;margin-bottom:5px}

/* ================= empty and loading states
   Every empty state says what is missing and offers the one action that fixes it.
   They used to be a single grey sentence with no route forward. */
.empty{border:1px dashed var(--border);border-radius:var(--r2);padding:26px 20px;
  text-align:center;margin-bottom:var(--s3)}
.empty-i{width:44px;height:44px;margin:0 auto 12px;border-radius:22px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--faint)}
.empty-i svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.empty h3{font-size:15px;margin:0 0 5px}
.empty p{margin:0 auto;max-width:34ch}
.empty-a{margin-top:15px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty-a .btn{width:auto;padding:12px 20px;margin:0}

.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--raised) 50%,var(--surface) 75%);
  background-size:300px 100%;animation:shim 1.25s linear infinite}
@keyframes shim{0%{background-position:-150px 0}100%{background-position:150px 0}}
.skelbar{height:13px;border-radius:7px;margin:9px 0}
.thumbwrap{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  border-radius:10px;overflow:hidden;vertical-align:middle}
.thumbwrap .thumbfall{display:none;color:var(--faint)}
.thumbwrap.failed{background:var(--raised)}
.thumbwrap.failed .thumbfall{display:flex}
/* A photo still on its way holds its square in a still tone, and fades in when it
   lands. A list scrolls a dozen of these into view at once, and a shimmer under each —
   repainted every frame — read as the list flickering, and cost the scroll its
   smoothness. */
.thumbwrap.skel{animation:none;background:var(--raised)}
.thumbwrap img.thumb{transition:opacity var(--m-comp) var(--e-standard)}
.thumbwrap.skel img.thumb{opacity:0}
body.noanim .skel{animation:none}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* logged food rows: tap to change the amount, ✕ to remove */
.fitem{display:flex;align-items:center}
.fitem-b{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:none;border:none;padding:10px 0;color:var(--text);text-align:left}
.fitem-x{width:44px;height:44px;flex-shrink:0;background:none;border:none;color:var(--faint);
  font-size:15px;padding:0;border-radius:11px}
:root:not(.tch) .fitem-x:active,.fitem-x.tapd{background:var(--surface);color:var(--accentHi)}

/* ================= barcode scanner: full screen, one job. Built outside the render
   tree, so a repaint cannot tear the live video out of the DOM mid-stream. */
.scanwrap{position:fixed;inset:0;z-index:120;background:#000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  overscroll-behavior:contain;touch-action:none}
.scanwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanbox{position:relative;width:min(78vw,320px);height:min(46vw,190px);
  border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.scanbox span{position:absolute;width:26px;height:26px;border:3px solid var(--accent)}
.scanbox span:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.scanbox span:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.scanbox span:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.scanbox span:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.scanhint{position:relative;margin:22px 0 0;color:#F0EDE8;font-size:14px;text-align:center;
  padding:0 24px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.scancancel{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(28px + env(safe-area-inset-bottom));width:min(70vw,260px);margin:0}

/* ================= motion: applied from the approved map =================
   Every value here is a token. Anything that enters is gated so it fires when the
   thing appears and never on a re-render — the patcher keeps nodes alive, so an
   ungated entry animation would be exactly the bug Phase 1 removed. */

/* A row arriving in, or leaving, a list. The exit collapses the row's height as well
   as fading it, so the rows below slide up rather than snapping. The height is frozen
   in px by leave() first - auto does not animate - which is why the collapse lives
   partly in JS and partly here. */
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* A row that is leaving is not arriving. Without the :not(), the entry rule outranks
   .rowout on specificity - .setrow[data-anim] is a class plus an attribute, .rowout is
   one class - so a deleted row played its entrance while it was supposed to be leaving,
   then vanished when leave()'s timeout fired. The toast pair never had this problem
   because .toast.leaving ties with .toast and wins on order. Excluding the conflict is
   better than adding weight to outrank it. */
.setrow[data-anim]:not(.rowout),
.list .item[data-anim]:not(.rowout){animation:rowIn var(--m-comp) var(--e-decel)}
/* The row fades out while the space it occupied closes underneath it.

   The 45% stop is opacity only, and it matters: it makes the row fully invisible while
   the gap is still closing, so what you see is space closing rather than a ghost being
   squashed. Height is a different story - a property listed only in the 100% block
   interpolates across the WHOLE animation from its implicit start value, so the 45%
   stop does not hold it and the collapse runs the entire duration. Measured, not
   assumed; the first version of this was written believing the opposite.

   Easing is --e-standard, not the --e-accel you would expect for something leaving.
   Accelerate is correct for the fade but wrong for the collapse: measured, it left the
   row's empty space sitting open and then slammed it shut over the last third (8px of
   65 moved by 45%, 43px in the final 30%). Standard front-loads the travel and settles
   into place - 55px by 45%, easing to 65.

   leave() freezes the starting height in px first, because auto does not animate. Every
   box property that adds vertical size has to reach zero or the row floors at its own
   padding and border. */
@keyframes rowOut{
  45%{opacity:0;transform:translateY(-4px)}
  100%{opacity:0;transform:translateY(-4px);height:0;
       margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-top-width:0;border-bottom-width:0}}
.rowout{animation:rowOut var(--m-comp) var(--e-standard) forwards;pointer-events:none;overflow:hidden}

/* The rest screen is a distinct mode, so it gets a real entrance. */
@keyframes restIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
#rest .restwrap{animation:restIn var(--m-screen) var(--e-decel)}

/* The framing box scaling in is what draws the eye to where the barcode goes. */
@keyframes boxIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.scanwrap{animation:fadeIn var(--m-comp) var(--e-standard)}
.scanwrap .scanbox{animation:boxIn var(--m-comp) var(--e-decel)}

/* Empty states are not failures, so this is gentle and happens once per view. */
@keyframes softIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty[data-anim]{animation:softIn var(--m-comp) var(--e-standard)}

/* The chart draws itself once when the screen is first shown. Changing the range
   cross-fades instead — replaying the draw on every chip tap is the replay the brief
   forbids. */
@keyframes drawOn{to{stroke-dashoffset:0}}
path.line[data-anim]{animation:drawOn var(--m-reveal) var(--e-decel) forwards}
@keyframes sparkSwap{from{opacity:0}to{opacity:1}}
.spark-swap{animation:sparkSwap var(--m-screen) var(--e-standard)}

/* Weekly bars build, so the ranking becomes obvious as they go. Staggered in the
   markup, capped at five steps. */
@keyframes barGrow{from{transform:scaleX(0)}to{transform:none}}
.bar[data-anim] i{transform-origin:left center;animation:barGrow var(--m-data) var(--e-decel) both}
[dir="rtl"] .bar[data-anim] i{transform-origin:right center}

/* Error: colour and a small settle. No shake — a shake reads as punishment. */
@keyframes settle{0%{transform:translateY(-3px)}100%{transform:none}}
.err{border-color:var(--accent)!important;animation:settle var(--m-comp) var(--e-decel)}

/* Toast in and out, both tokenised. */
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}
  to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:toastIn var(--m-comp) var(--e-decel)}
.toast.leaving{animation:toastOut var(--m-fade) var(--e-accel) forwards}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px)}}

/* Reduced motion, through either route. Movement stops; fades stay, shortened, because
   a hard cut between screens is disorienting in a different way. */
:root.reduced #app.pagein,
:root.reduced .sheet.entering .sheetbox,
:root.reduced #rest .restwrap,
:root.reduced .scanwrap .scanbox,
:root.reduced .setrow[data-anim],
:root.reduced .list .item[data-anim],
:root.reduced .rowout,
:root.reduced .empty[data-anim],
:root.reduced .bar[data-anim] i,
:root.reduced path.line[data-anim],
:root.reduced .logbtn.done.fresh,
:root.reduced .wsr.fresh .wtick,
:root.reduced .sess .log.ok,
:root.reduced .rb,
:root.reduced .err{animation:none}
:root.reduced .skel{animation:none}
:root.reduced .ss-clock i{animation:none}

/* ================= Home — the bunyan-home frame (Figma node 2:35)
   Values are the frame's own: 16px between cards, 20px card padding (16 on the week
   card), Outfit for titles and figures, Manrope for everything else. Text-align is
   `start` rather than `left` so every block mirrors in Arabic without a second rule. */

/* A 16px icon drawn from one of the design's exported vectors (icons/), tinted by the
   text colour it sits in. The vectors are written into the stylesheet as data URLs
   rather than linked: a linked mask is fetched and decoded after the element is
   painted, so a screen's icons came in a beat after the rest of it, and could go blank
   offline if the cache missed one. */
.ico{display:inline-block;width:16px;height:16px;flex:0 0 16px;background:currentColor;
  -webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
.ico-play{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='16' height='16' viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M3.51208 2.66554C3.39457 2.8686 3.33273 3.09905 3.3328 3.33364V12.6664C3.33273 12.9009 3.39457 13.1314 3.51208 13.3345C3.62958 13.5375 3.7986 13.706 4.00205 13.8228C4.2055 13.9397 4.43619 14.0008 4.67082 14C4.90546 13.9992 5.13573 13.9365 5.33838 13.8183L13.3394 9.15192C13.541 9.03446 13.7083 8.86614 13.8245 8.66378C13.9407 8.46142 14.0018 8.2321 14.0016 7.99876C14.0014 7.76541 13.9399 7.53621 13.8234 7.33405C13.7068 7.13189 13.5392 6.96385 13.3374 6.84674L5.33838 2.18172C5.13573 2.06348 4.90546 2.0008 4.67082 2.00001C4.43619 1.99921 4.2055 2.06033 4.00205 2.17718C3.7986 2.29404 3.62958 2.46249 3.51208 2.66554Z' stroke='%23FAF6EE' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
[dir="rtl"] .ico-play{transform:scaleX(-1)}

.hgreet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.hdate{font-size:12px;font-weight:600;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
/* The bell and the person at the top right of Training: round glass buttons, as the
   cards are glass. The bell's dot is the dock's flag colour, ringed in the page. */
.hgreet-t{min-width:0}
.hacts{flex:none;display:flex;align-items:center;gap:8px}
.hbtn{position:relative;flex:none;display:grid;place-items:center;width:46px;height:46px;padding:0;margin:0;
  border-radius:50%;border:1px solid var(--card-edge);background:var(--card);color:var(--text);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .hbtn:active,.hbtn.tapd{transform:scale(.94)}
.hbtn:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.hbtn .gl{width:21px;height:21px}
.hbtn.flag::after{content:"";position:absolute;top:9px;inset-inline-end:10px;width:9px;height:9px;border-radius:50%;
  background:var(--dock-flag);box-shadow:0 0 0 2px var(--bg)}
.havatar{background:var(--accent);border-color:transparent;color:var(--onAccent);
  font-family:var(--display);font-weight:800;font-size:17px;overflow:hidden}
.havatar .avimg{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
/* The profile picture sheet: the picture large, then the two choices, both in sight. */
.avprev{display:grid;place-items:center;margin:6px 0 18px}
.avprev .xl{display:grid;place-items:center;width:112px;height:112px;border-radius:50%;object-fit:cover;
  font-family:var(--display);font-weight:800;font-size:40px;color:var(--onAccent);
  background:linear-gradient(150deg,rgba(var(--accent-rgb),.95),rgba(var(--accent-rgb),.62));
  box-shadow:0 0 0 4px rgba(var(--bg-rgb),.8),0 0 0 5px var(--card-edge),0 14px 32px -10px rgba(var(--accent-rgb),.6)}
.avopts{display:flex;flex-direction:column;gap:10px}
.avopt{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:68px;margin:0;padding:12px 14px;
  border-radius:var(--r4);border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;text-align:start;cursor:pointer;
  transition:border-color var(--m-micro) var(--e-standard),background var(--m-micro) var(--e-standard)}
.avopt.on{border-color:rgba(var(--accentHi-rgb),.6);background:linear-gradient(180deg,rgba(var(--accent-rgb),.12),transparent),var(--surface)}
:root:not(.tch) .avopt:active,.avopt.tapd{transform:scale(.98)}
.avopt-i{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;color:var(--accentHi);
  background:rgba(var(--accent-rgb),.14);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.3)}
.avopt-i.ini{font-family:var(--display);font-weight:800;font-size:19px;color:var(--onAccent);background:var(--accent)}
.avopt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.avopt-t b{font-size:15px}
.avopt-t small{font-size:12.5px;color:var(--dim)}
.avopt-c{flex:none;color:var(--accentHi)}
.avopt-c .gl{width:20px;height:20px;stroke-width:2.2}
.avopt input[type=file]:focus-visible+.avopt-i{outline:2px solid var(--accentHi);outline-offset:2px}

.hstack{display:flex;flex-direction:column;gap:16px}
.hstack>.card{margin:0}

.card.sess{display:flex;flex-direction:column;gap:16px}
.sess-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* The badge text is --accentHi, not the design's #e31b23: that red measures 3.92:1 on
   the card, under AA for 11px text. The fill behind it is the design's own. */
.sbadge{background:var(--accentSoft);color:var(--accentHi);border-radius:6px;padding:4px 10px;
  font-size:11px;font-weight:700;text-transform:uppercase}
.sess-min{font-size:13px;color:var(--dim)}
.sess-title{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;color:var(--text)}
.sess-sub{font-size:13px;color:var(--sub);margin-top:4px}
/* The "sharp divider": a 16px accent tick leading a hairline. */
.sdiv{display:flex;align-items:center;height:2px}
.sdiv i{width:16px;height:2px;background:var(--accent)}
.sdiv b{flex:1;height:1px;background:var(--border)}
.card.sess .btn{margin:0}

.card.nutri{display:flex;align-items:center;gap:16px;text-align:start}
.nutri-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.nutri-h{font-size:18px}
.nutri-kcal{font-size:15px;color:var(--sub)}
.nutri-pro{font-size:14px;color:var(--dim);margin-top:-6px}
.nutri-kcal b,.nutri-pro b{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.nutri-ring{position:relative;flex:0 0 72px;width:72px;height:72px;
  display:flex;align-items:center;justify-content:center}
.nutri-ring .hring{position:absolute;inset:0;width:72px;height:72px}
.nutri-pct{position:relative;font-family:var(--display);font-weight:700;font-size:14px;color:var(--text)}

.card.wk{padding:16px;display:flex;flex-direction:column;gap:12px}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk-h{font-size:15px}
.wk-n{font-size:13px;font-weight:700;color:var(--accentHi);white-space:nowrap}
.wk-dots{display:flex;justify-content:space-between}
.wk-dots img{width:28px;height:28px;display:block}

.card.hsteps{display:flex;align-items:center;justify-content:space-between;text-align:start}
.hsteps-n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--text);
  font-variant-numeric:tabular-nums}

/* ================= Train hub — canvas screen 1 (Figma node 2:810)
   The canvas's layout in the core frames' tokens: the canvas was drawn in a separate
   pass with Inter, #d6222e and #1c1c22 cards, and one app cannot wear two systems. */
.ico-star{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M11.7215 2.07892C11.6375 2.13103 11.5698 2.20555 11.526 2.29409L9.217 6.97309C9.0647 7.28136 8.83978 7.54801 8.56158 7.75008C8.28339 7.95215 7.96026 8.08359 7.62 8.13309L2.455 8.88809C2.3567 8.90199 2.26429 8.94322 2.18828 9.00708C2.11227 9.07094 2.05572 9.15486 2.02508 9.24928C1.99444 9.34371 1.99093 9.44485 2.01496 9.54117C2.03899 9.63749 2.08959 9.72513 2.161 9.79409L5.897 13.4311C6.14361 13.6712 6.32809 13.9678 6.43454 14.2951C6.54098 14.6225 6.5662 14.9708 6.508 15.3101L5.627 20.4491C5.60986 20.5468 5.62048 20.6473 5.65766 20.7393C5.69483 20.8313 5.75707 20.911 5.83729 20.9693C5.91752 21.0277 6.0125 21.0623 6.11145 21.0693C6.2104 21.0764 6.30933 21.0555 6.397 21.0091L11.014 18.5811C11.3183 18.4213 11.6568 18.3378 12.0005 18.3378C12.3442 18.3378 12.6827 18.4213 12.987 18.5811L17.605 21.0091C17.6927 21.0558 17.7918 21.0769 17.8909 21.07C17.99 21.0631 18.0852 21.0285 18.1655 20.9701C18.2459 20.9117 18.3083 20.8319 18.3455 20.7398C18.3827 20.6477 18.3933 20.5469 18.376 20.4491L17.494 15.3091C17.4361 14.97 17.4614 14.6219 17.5678 14.2947C17.6743 13.9676 17.8586 13.6712 18.105 13.4311L21.841 9.79309C21.9118 9.72405 21.9619 9.63656 21.9856 9.54053C22.0093 9.4445 22.0056 9.34376 21.975 9.2497C21.9444 9.15564 21.8881 9.07202 21.8125 9.00829C21.7368 8.94457 21.6449 8.90328 21.547 8.88909L16.381 8.13309C16.0411 8.08321 15.7184 7.95159 15.4406 7.74955C15.1628 7.5475 14.9382 7.28106 14.786 6.97309L12.476 2.29409C12.4322 2.20555 12.3645 2.13103 12.2805 2.07892C12.1966 2.02681 12.0998 1.9992 12.001 1.9992C11.9022 1.9992 11.8054 2.02681 11.7215 2.07892Z' stroke='%23D6222E' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
.ico-arrow{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='16' height='16' viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M3.3328 8H12.6672M8 12.6672L12.6672 8L8 3.3328' stroke='%23F3F4F6' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
.ico-search{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='18' height='18' viewBox='0 0 18 18' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M15.7501 15.7501L12.4951 12.4951M14.25 8.25C14.25 11.5637 11.5637 14.25 8.25 14.25C4.93629 14.25 2.25 11.5637 2.25 8.25C2.25 4.93629 4.93629 2.25 8.25 2.25C11.5637 2.25 14.25 4.93629 14.25 8.25Z' stroke='%23D6222E' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
.ico-chev{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='16' height='16' viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M6 12L10 8L6 4' stroke='%238E8E93' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
[dir="rtl"] .ico-arrow,[dir="rtl"] .ico-chev{transform:scaleX(-1)}

.thead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
/* A 44px target around a 24px glyph, tinted accent like the design's outline star. */
.icobtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;padding:0;color:var(--accent);margin-inline-end:-10px}
.icobtn .ico{width:24px;height:24px;flex-basis:24px}

.card.thero{display:flex;flex-direction:column;gap:16px;margin-bottom:0}
.klabel{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--accentHi)}
.klabel.dim{color:var(--dim)}
.thero-name{font-family:var(--display);font-weight:800;font-size:20px;color:var(--text);margin-top:2px}
.tprog{display:flex;flex-direction:column;gap:6px}
.tprog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.tprog-l b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.tbar{height:4px;border-radius:2px;background:var(--bg);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);
  transition:width var(--m-data) var(--e-decel)}
.tsplit{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:none;border:none;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:8px 0;min-height:56px;text-align:start;color:var(--text)}
.tsplit-n{display:block;font-family:var(--display);font-weight:700;font-size:16px;margin-top:2px}
.tsplit-m{font-size:12px;color:var(--dim);white-space:nowrap}
.card.thero .btn{margin:0}
.card.thero .btn .ico{margin-inline-start:0}

.tsec{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.tsec-h{font-family:var(--display);font-weight:800;font-size:18px;margin:0}
.tlink{background:none;border:none;color:var(--accentHi);font-size:13px;font-weight:600;
  min-width:44px;min-height:44px;padding:0;margin-inline-end:-6px}

.card.tdays{padding:0;margin:0;overflow:hidden}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:none;border:none;border-bottom:1px solid var(--border);padding:12px 16px;
  min-height:56px;text-align:start;color:var(--text)}
.trow:last-child{border-bottom:none}
.trow-n{display:block;font-family:var(--display);font-weight:700;font-size:15px}
.trow-s{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.trow .ico-chev{color:var(--dim)}
.tnext{background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--onAccent);border-radius:var(--rpill);
  padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0;
  box-shadow:0 4px 12px -4px var(--accent-glow)}
.tadd .trow-n{color:var(--accentHi)}
.trow>span:first-child{flex:1;min-width:0}
/* Train's header line under the title, as Food and Progress have. */
.thead-s{margin:4px 0 0;color:var(--dim);font-size:14px}
/* ---- Train: the selected day over the Bunyan artwork ------------------------------
   The rider (intro.jpg) is screen-blended into the card, so its black ground drops
   out and only the red light and the silhouette show; a mask fades it out toward the
   text. Decorative: alt="" and hidden from assistive tech. */
.thero2{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:18px;
  padding:20px;border-radius:var(--r5);border:1px solid var(--border);
  background:linear-gradient(135deg,rgba(var(--accent-rgb),.10),rgba(0,0,0,0) 55%),var(--raised);box-shadow:var(--shadow-card)}
.thero2.live{border-color:var(--accent-edge);
  background:linear-gradient(135deg,rgba(var(--accent-rgb),.26),rgba(var(--accent-rgb),.04) 60%),var(--raised);
  box-shadow:var(--shadow-card),0 14px 40px -18px var(--accent-glow)}
.thero2-art{position:absolute;z-index:-1;top:-26%;inset-inline-end:-18%;width:78%;height:auto;opacity:.62;
  mix-blend-mode:screen;pointer-events:none;
  -webkit-mask:radial-gradient(70% 70% at 60% 45%,#000 30%,transparent 75%);mask:radial-gradient(70% 70% at 60% 45%,#000 30%,transparent 75%)}
[dir="rtl"] .thero2-art{transform:scaleX(-1)}
/* Screen blending adds light, so on a light card the art vanished. In light mode it is
   turned to its negative and multiplied: the black ground goes, the smoke tints the
   card and the rider stays as a pale silhouette in it. */
[data-theme="light"] .thero2-art{mix-blend-mode:multiply;opacity:.5;filter:invert(1) hue-rotate(180deg) var(--img-tone)}
.thero2-top{display:flex;align-items:center;gap:14px}
.thero2-t{min-width:0}
.thero2-n{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;margin-top:3px;overflow-wrap:anywhere}
.thero2-m{font-size:13px;color:var(--sub);margin-top:4px}
.thero2 .btn{margin:0}
.thero2 .btn .ico{margin-inline-start:0}
.thero2 .btn:not(.g){background:linear-gradient(180deg,var(--accent),var(--accent-deep));box-shadow:0 10px 26px -10px var(--accent-glow)}
.tbadge{flex:0 0 52px;width:52px;height:52px;border-radius:var(--rpill);display:flex;align-items:center;justify-content:center;
  color:var(--onAccent);background:radial-gradient(circle at 35% 30%,var(--accentHi),var(--accent) 70%);
  box-shadow:0 0 0 6px rgba(var(--glow-rgb),.12),0 8px 22px -8px var(--accent-glow)}
.tbadge.rest{background:var(--surface);color:var(--dim);box-shadow:0 0 0 6px rgba(255,255,255,.03)}
.tbadge svg,.tday-i svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tprog-wk{margin:12px 2px 0}
/* The two days after the selected one. */
.tnextpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.tday{display:flex;align-items:center;gap:10px;min-height:72px;padding:12px;border-radius:var(--r4);text-align:start;
  background:var(--raised);border:1px solid var(--border);color:var(--text);min-width:0;
  transition:transform var(--m-press) var(--e-standard),border-color var(--m-micro) var(--e-standard)}
:root:not(.tch) .tday:active,.tday.tapd{transform:scale(.97)}
.tday:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.tday-i{flex:0 0 36px;width:36px;height:36px;border-radius:var(--rpill);display:flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--sub);box-shadow:inset 0 0 0 1px var(--border)}
.tday-i.rest{background:var(--surface);color:var(--dim);box-shadow:none}
.tday-i svg{width:20px;height:20px}
.tday-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.tday-k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tday-n{font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.tday-m{font-size:11.5px;color:var(--dim)}
[dir="rtl"] .tday-k{letter-spacing:0}
@media (max-width:360px){}

/* Horizontal rows bleed to the screen edge, as the design's do, so the next card is
   visibly cut off and reads as scrollable. */
.tscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin-inline:calc(-1 * var(--gutter));padding-inline:var(--gutter);padding-bottom:2px;
  scrollbar-width:none}
.tscroll::-webkit-scrollbar{display:none}
.tscroll>*{scroll-snap-align:start}
.tprog-card{flex:0 0 180px;width:180px;height:200px;display:flex;flex-direction:column;
  background:var(--raised);border:1px solid var(--border);border-radius:8px;overflow:hidden;
  padding:0;text-align:start;color:var(--text)}
.tcover{position:relative;display:block;height:100px;flex:0 0 100px}
.tcover img{width:100%;height:100%;object-fit:cover;display:block}
.tcover::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4)}
/* ---- Program covers (js/ui/cover.js) -------------------------------------------
   A program without a photograph is drawn from its own week: one column per day, one
   block per exercise, the top course in the accent, rest days a single low course.
   Colour comes only from the palette tokens, so it is right in all six themes. */
.tcover-gen{background:var(--color-surface-well)}
.tcover-gen::after{display:none}
.tcover-gen .pcov,.drow-cov .pcov{display:block;width:100%;height:100%}
.pcov .pc-b{fill:var(--color-text-primary);fill-opacity:.2}
.pcov .pc-t{fill:var(--color-action-primary)}
.pcov .pc-r{fill:var(--color-text-primary);fill-opacity:.08}
.pcov .pc-g{fill:none;stroke:var(--color-border);stroke-width:1}
.drow-cov{flex:none;width:52px;height:40px;border-radius:var(--r1);background:var(--color-surface-well);
  box-shadow:inset 0 0 0 1px var(--color-border-subtle);overflow:hidden}
.tpc-body{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:12px;min-width:0}
.tpc-n,.tpc-s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpc-n{font-family:var(--display);font-weight:700;font-size:14px}
.tpc-s{font-size:11px;color:var(--dim);margin-top:2px}
.tpc-m{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--dim)}
.tchip{background:var(--bg);color:var(--accentHi);border-radius:4px;padding:2px 6px;
  font-size:10px;font-weight:600;white-space:nowrap}
/* The design's pills are about 34px tall; they are 44 here because every tappable
   thing in the app has to be. The padding is the design's; only the floor is added. */
.tpill{flex:0 0 auto;min-height:44px;padding:8px 16px;border-radius:22px;
  background:var(--surface);border:1px solid var(--border);color:var(--dim);
  font-size:13px;font-weight:600;white-space:nowrap}
:root:not(.tch) .tpill:active,.tpill.tapd{border-color:var(--accent);color:var(--text)}









/* ================= A training day — canvas screen 2 (Figma node 2:915) */
.ico-cleft{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='20' height='20' viewBox='0 0 20 20' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M12.5 15L7.5 10L12.5 5' stroke='%23F3F4F6' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
[dir="rtl"] .ico-cleft{transform:scaleX(-1)}
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.icobtn.back{color:var(--text);margin-inline-start:-10px;margin-inline-end:0}
.icobtn.back .ico{width:20px;height:20px;flex-basis:20px}
.dhead-t{font-size:24px;font-weight:800;min-width:0}
.dsub{font-size:13px;color:var(--dim);margin:0 0 16px}
/* The frame's summary strip: hairlines above and below, three measured figures. */
.dstrip{display:flex;justify-content:space-between;gap:12px;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:12px 0;margin-bottom:20px}
.dstrip b{display:block;font-family:var(--display);font-weight:700;font-size:16px;
  color:var(--text);margin-top:2px;white-space:nowrap}
/* The title is the rename control: tap it, not a menu, to rename the day. */
.dname{display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;padding:0;
  background:none;border:none;color:var(--text);text-align:start}
.dname .dhead-t{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dname .ico{width:16px;height:16px;flex:0 0 16px;color:var(--dim)}
:root:not(.tch) .dname:active .ico,.dname.tapd .ico{color:var(--accentHi)}
.droutine{margin:0 0 12px}
.dhint{font-size:12px;color:var(--dim)}
/* Reorder / Done, at the list's head. While it is on, the ✕s step aside so a row can
   only be moved, and the grips are the only new thing on the row. */
.dreorder{min-height:36px;padding:0 2px}
.dreorder.on{color:var(--text);background:var(--raised);border:1px solid var(--border);
  border-radius:var(--rpill);padding:0 14px;min-height:34px;margin-inline-end:0}
.drows.ro .drm{display:none}
.drows.ro .dmain{padding-inline-start:16px}
.dempty{color:var(--dim);font-size:14px;line-height:1.5;margin:0 0 14px}
.drows{display:flex;flex-direction:column;gap:10px}
/* ✕ · the exercise · grip: three targets side by side, never one inside another. */
.drow{position:relative;display:flex;align-items:stretch;width:100%;min-height:64px;
  background:var(--raised);border:1px solid var(--border);border-radius:14px;color:var(--text)}
.drm{flex:0 0 46px;display:grid;place-items:center;padding:0;background:none;border:none;color:var(--dim)}
.drm i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.05);border:1px solid var(--border)}
.drm svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
:root:not(.tch) .drm:active i,.drm.tapd i{background:rgba(var(--danger-rgb),.18);border-color:rgba(var(--danger-rgb),.6);color:var(--danger)}
.dmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 2px;
  background:none;border:none;color:var(--text);text-align:start}
:root:not(.tch) .dmain:active .drow-n,.dmain.tapd .drow-n{color:var(--accentHi)}
.dnum{flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:16px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.dtext{flex:1;min-width:0}
.drow-n{display:block;font-family:var(--display);font-weight:700;font-size:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow-s{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--dim);margin-top:3px;
  font-variant-numeric:tabular-nums}
.ddot{width:3px;height:3px;border-radius:1.5px;background:var(--dim);flex:0 0 3px}
/* The grip takes the touch outright: without touch-action the browser would read the
   drag as a page scroll and the row would never move. */
.dgrip{flex:0 0 48px;display:grid;place-items:center;padding:0;background:none;border:none;color:var(--faint);
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:grab}
.dgrip svg{width:20px;height:20px;fill:currentColor}
:root:not(.tch) .dgrip:active,.dgrip.tapd{color:var(--accentHi)}
.drows.sorting{-webkit-user-select:none;user-select:none}
.drows.sorting .drow:not(.lifted){transition:transform .18s var(--e-standard)}
.drow.lifted{z-index:5;background:var(--surface);border-color:rgba(var(--accentHi-rgb),.6);
  box-shadow:0 20px 40px -14px rgba(0,0,0,.85);cursor:grabbing}
.drow.lifted .dgrip{color:var(--accentHi)}
/* Adding is the same dashed + as adding a set. */
.dadd{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;margin-top:10px;
  border-radius:14px;border:1px dashed var(--hair-hi);background:none;color:var(--sub);font-weight:700;font-size:15px;
  transition:transform var(--m-press) var(--e-standard)}
.dadd span{font-size:20px;line-height:1;color:var(--accentHi)}
:root:not(.tch) .dadd:active,.dadd.tapd{transform:scale(.98);background:rgba(var(--accent-rgb),.06)}
/* The frame's bottom block. Not fixed: the routine above scrolls, and a pinned bar
   would cover a row on a short screen. */
.dcta{display:flex;flex-direction:column;gap:8px;align-items:stretch;
  border-top:1px solid var(--border);margin-top:24px;padding-top:24px}
.dbegin{min-height:54px;font-size:16px;font-weight:800;margin:0}
.ddel{align-self:center;min-height:44px;padding:0 16px;background:none;border:none;
  color:var(--danger);font-size:14px;font-weight:600;opacity:.85}
:root:not(.tch) .ddel:active,.ddel.tapd{opacity:.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- Programs and the split builder: the library's hero, Bunyan mark and all ---- */
.bhero h1{font-size:30px;margin:0}
.bhero .sub{margin:6px 0 0;color:var(--dim);font-size:14px;line-height:1.45;max-width:30ch}
.bhero .dname{margin-top:2px}
.bhero .dname .dhead-t{font-size:30px}
.bnew{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:14px;border-radius:var(--r4);
  border:1px solid rgba(var(--accentHi-rgb),.45);background:linear-gradient(180deg,rgba(var(--accent-rgb),.22),rgba(var(--accent-rgb),.08));
  color:var(--text);text-align:start;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .bnew:active,.bnew.tapd{transform:scale(.98)}
.bnew-i{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:50%;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));box-shadow:0 8px 20px -8px var(--accent-glow)}
.bnew-i svg{width:20px;height:20px;fill:none;stroke:var(--onAccent);stroke-width:2.6;stroke-linecap:round}
.bnew-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bnew-t b{font-family:var(--display);font-size:16px}
.bnew-t span{font-size:12.5px;color:var(--dim)}
.bnew .ico-chev{color:var(--dim)}
.bstats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bstats span{display:flex;align-items:baseline;gap:5px;padding:6px 12px;border-radius:var(--rpill);
  background:var(--well);border:1px solid var(--border);font-size:12.5px;color:var(--dim)}
.bstats b{font-family:var(--display);font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.bcount{margin:14px 0 0;padding:12px;border-radius:var(--r4);border:1px solid var(--border);background:var(--well)}
.bcount-l{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.bcount-c{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px}
.bcount-c button{min-height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-family:var(--display);font-size:18px;font-weight:800;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .bcount-c button:active,.bcount-c button.tapd{transform:scale(.94)}
