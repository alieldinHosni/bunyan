  box-shadow:0 0 0 7px var(--accent-tint),0 12px 30px -10px rgba(var(--accent-rgb),.9);transition:transform var(--m-press) var(--e-standard)}
.run-play svg{width:28px;height:28px;stroke-width:2.6}
.run-play svg path[d^="M7"]{fill:currentColor}
:root:not(.tch) .run-play:active,.run-play.tapd{transform:scale(.94)}
.btn.run-end{margin:20px 0 0}
.run-note{margin:12px 4px 0;font-size:12.5px;line-height:1.5;color:var(--dim);text-align:center}
/* Training's way in. */
.ttile.trun .ttile-i .gl{width:22px;height:22px}
/* The last run, as the reference's run card: the route on a well, the kilometres large,
   pace and time, and a round arrow to the day. */
.trun-last{display:flex;align-items:center;gap:14px;width:100%;margin:14px 0 0;padding:12px 12px 12px 12px;
  border-radius:var(--r4);border:1px solid var(--card-edge);background:var(--card);color:var(--text);font:inherit;text-align:start;
  box-shadow:var(--shadow-card);transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .trun-last:active,.trun-last.tapd{transform:scale(.98)}
.trun-map{display:grid;place-items:center;flex:none;width:96px;height:68px;border-radius:calc(var(--r4) - 4px);
  background:linear-gradient(var(--hair) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--hair) 1px,transparent 1px) 0 0/16px 16px,var(--well);color:var(--accentHi)}
.trun-map svg{width:100%;height:100%}
.trun-map{overflow:hidden}
.trun-map .rt{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.trun-map .rt-glow{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.22}
.trun-map .gl{width:26px;height:26px}
.trun-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trun-k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
[dir="rtl"] .trun-k{letter-spacing:0}
.trun-t b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.trun-t b small{font-size:14px;font-weight:700;color:var(--sub)}
.trun-s{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.trun-go{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--raised);
  box-shadow:inset 0 0 0 1px var(--card-edge);color:var(--text)}
.trun-go .gl{width:18px;height:18px}
[dir="rtl"] .trun-go .gl{transform:scaleX(-1)}
/* Capsule bars (capsChart in views/progress.js): a row of rounded columns on glass
   tracks, the newest in the accent with its figure in a pill above it. */
.caps{margin:6px 0 0}
.caps-r{display:flex;align-items:flex-end;gap:6px;height:168px;padding-top:30px}
.caps-c{position:relative;flex:1 1 0;min-width:0;max-width:34px;height:100%;display:flex;align-items:flex-end;justify-content:center;
  margin:0 auto;border-radius:var(--rpill);background:var(--seg-track);box-shadow:inset 0 0 0 1px var(--hair)}
.caps-b{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;min-height:26px;
  border-radius:var(--rpill);background:var(--bar-track);box-shadow:inset 0 1px 0 var(--hair-hi)}
.caps-l{padding-bottom:7px;font-size:10.5px;font-weight:700;line-height:1;color:var(--sub);font-variant-numeric:tabular-nums}
.caps-c.on .caps-b{background:linear-gradient(180deg,var(--accent),var(--accent-deep));box-shadow:0 8px 18px -10px rgba(var(--accent-rgb),.9)}
.caps-c.on .caps-l{color:var(--onAccent)}
.caps-v{position:absolute;top:-28px;inset-inline-end:0;white-space:nowrap;padding:4px 9px;border-radius:var(--rpill);
  background:var(--raised);border:1px solid var(--card-edge);font-size:11.5px;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.12)}
/* Search, as the reference draws it: a glass pill with the magnifier in a round
   button of its own at the start. The circle is the container's ::before, so the
   magnifier (a mask icon, coloured by its own background) can sit on it. */
.libq::before,.afq::before{content:"";position:absolute;inset-inline-start:6px;top:50%;width:40px;height:40px;margin-top:-20px;
  z-index:1;border-radius:50%;background:var(--raised);box-shadow:0 1px 0 var(--hair-hi) inset,0 4px 12px rgba(0,0,0,.12);pointer-events:none}
.libq input{background:var(--card);border-color:var(--card-edge);padding-inline-start:56px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.afq{position:relative;background:var(--card);border-color:var(--card-edge);padding-inline-start:18px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.afq>.ico-search{position:relative;z-index:2;margin-inline-end:8px}
.libq .ico-search{z-index:2}
.libq-x{position:absolute;inset-inline-end:8px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;
  border:none;background:var(--surface);color:var(--dim);font-size:13px}
.libfilters{gap:8px;margin:0 -16px 6px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.libfilters::-webkit-scrollbar{display:none}
.libfilters .pill{min-height:38px;padding:0 15px;border-radius:var(--rpill);font-size:13.5px;background:var(--raised)}
.libfilters .pill.a{background:rgba(var(--accent-rgb),.14);border-color:rgba(var(--accentHi-rgb),.6);color:var(--text)}
.libn{font-size:13px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.libtrow{gap:14px}
.libtrow>span:first-child{flex:0 0 auto}
.libtrow>span:nth-child(2){flex:1;min-width:0;text-align:start}
.libtrow .thumbwrap,.libtrow .thumb,.libtrow .thumb.ph{flex:0 0 auto;border-radius:12px;overflow:hidden}
.libtrow .trow-s b{font-weight:500;color:var(--sub)}
/* A row out of sight is not laid out or painted until it comes near the screen, so a
   long list costs what is in view. The size it held last stands in for it meanwhile,
   so the scrollbar does not jump. */
.libtrow,.pkrow{content-visibility:auto;contain-intrinsic-size:auto 76px}
.libmore{display:block;margin:14px auto 0}
.libtrow .trow-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exd-form2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.exd-form2 figure{position:relative;margin:0;border-radius:var(--r4);overflow:hidden;border:1px solid var(--border);background:var(--raised);aspect-ratio:4/3}
.exd-form2 img{width:100%;height:100%;object-fit:cover;display:block}
.exd-form2 figcaption{position:absolute;inset-inline-start:8px;bottom:8px;padding:4px 10px;border-radius:var(--rpill);
  background:rgba(8,8,10,.72);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff}
/* What it works: the body map beside the primary and secondary muscles in words. */
.exd-musc{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:14px;align-items:center;
  border:1px solid var(--border);border-radius:var(--r4);background:var(--raised);padding:12px 14px 12px 10px;margin-bottom:10px}
.exd-musc-t{display:flex;flex-direction:column;gap:12px;min-width:0}
.exd-musc-t>div{display:flex;flex-direction:column;gap:3px}
.exd-musc-t span{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.exd-musc-t b{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.bmk{flex:none;width:9px;height:9px;border-radius:3px;background:var(--accent)}
.bmk.s{background:rgba(var(--accent-rgb),.42)}
/* The body map (js/data/bodymap.js): the body in the theme's quiet neutrals, the
   muscles a shade lighter, lit ones in the accent. */
.bmap{display:block;width:100%;height:auto}
.bmap .b{fill:var(--hair)}
.bmap .m{fill:var(--bar-track)}
.bmap .p,.bmap .h4{fill:var(--accent)}
.bmap .s{fill:rgba(var(--accent-rgb),.42)}
.bmap .h1{fill:rgba(var(--accent-rgb),.2)}
.bmap .h2{fill:rgba(var(--accent-rgb),.38)}
.bmap .h3{fill:rgba(var(--accent-rgb),.62)}
/* This week on the body, above the bars (Progress, Strength). */
.pgbody{display:grid;justify-items:center;gap:8px;margin:2px 0 14px}
.pgbody .bmap{max-width:240px}
.pgbody-k{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.pgbody-k i{width:96px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bar-track),rgba(var(--accent-rgb),.38),var(--accent))}
[dir="rtl"] .pgbody-k i{transform:scaleX(-1)}
.exd-facts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--r4);background:var(--raised);overflow:hidden;margin-bottom:20px}
.exd-facts>div{display:flex;flex-direction:column;gap:3px;padding:12px 14px;min-width:0}
.exd-facts>div:nth-child(even){border-inline-start:1px solid var(--border)}
.exd-facts>div:nth-child(n+3){border-top:1px solid var(--border)}
.exd-facts>div.wide{grid-column:1/-1;border-inline-start:none}
.exd-facts span{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.exd-facts b{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.exd-uni{margin:-8px 0 16px;font-size:13px;line-height:1.45;color:var(--dim)}
.exd-card{padding:14px;border:1px solid var(--border);border-radius:var(--r4);background:var(--raised)}
.sheetbox .exd-h{margin:20px 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-family:inherit}
.exd-tips{border-radius:var(--r4)}
/* ---- Cardio & sports (session.js actBody, sheets "acts") ---------------------------- */
.acthead{justify-content:flex-start;gap:14px}
.actbadge{flex:0 0 52px;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,var(--accent),var(--accent-deep) 78%);border:1px solid rgba(var(--accentHi-rgb),.6);color:var(--onAccent)}
.acticon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actcard .steps{margin:0}
.act-lbl{margin:16px 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.act-lbl i{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;opacity:.8}
.actcard .setcard-h+.act-lbl{margin-top:4px}
.act-km{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:56px;border-radius:var(--r4);border:1px solid var(--border);background:var(--surface)}
.act-km input{flex:1;min-width:0;margin:0;border:none;background:none;font-family:var(--display);font-size:22px;font-weight:800;padding:0;min-height:54px}
.act-km input:focus{outline:none}
.act-km span{color:var(--dim);font-weight:700}
.act-int{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act-int button{min-height:48px;border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);color:var(--sub);font-size:13.5px;font-weight:700;padding:0 4px}
.act-int button.on{background:rgba(var(--accent-rgb),.16);border-color:rgba(var(--accentHi-rgb),.7);color:var(--text)}
.act-kcal{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:14px 16px;border-radius:var(--r4);
  background:rgba(var(--accent-rgb),.07);border:1px solid rgba(var(--accentHi-rgb),.25)}
.act-kcal span{color:var(--dim);font-size:14px}
.act-kcal b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.act-note{margin:14px 0 0;color:var(--dim);font-size:13px}
.act-log{margin-top:16px;min-height:58px;font-size:17px}
.act-log svg,.act-ok svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.act-done{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.act-row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:var(--r4);background:var(--surface);border:1px solid var(--border)}
.act-row.fresh{animation:rowIn var(--m-comp) var(--e-decel)}
.act-ok{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--ok);color:#fff}
.act-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.act-t b{font-family:var(--display);font-size:16px}
.act-t span{font-size:13px;color:var(--dim)}
.ttile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px}
.ttile.wide .ttile-i{margin:0;flex:0 0 40px}
.ttile-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ttile.wide .ttile-n{margin:0}
.ttile.wide .ico-chev{color:var(--dim)}
[dir="rtl"] .ttile.wide .ico-chev{transform:scaleX(-1)}
.actgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:88px;padding:10px 6px;
  border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);color:var(--text);font-size:13px;font-weight:600;text-align:center;
  transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .actbtn:active,.actbtn.tapd{transform:scale(.95)}
.actbtn .acticon{color:var(--accentHi)}
.actbtn span{line-height:1.2;overflow-wrap:anywhere}
/* Running outdoors, which running mode tracks live: lit, with a GPS tag. */
.actbtn.live{position:relative;border-color:rgba(var(--accentHi-rgb),.45);background:linear-gradient(180deg,rgba(var(--accent-rgb),.12),transparent),var(--raised)}
.actbtn-gps{position:absolute;top:7px;inset-inline-end:7px;padding:2px 6px;border-radius:var(--rpill);font-style:normal;font-size:9.5px;font-weight:800;
  letter-spacing:.06em;color:var(--onAccent);background:var(--accent)}
.thumb.ph.act{display:grid;place-items:center;border-radius:12px;background:rgba(var(--accent-rgb),.12);color:var(--accentHi)}
/* ---- Rest: hide to a bar (session.js) ------------------------------------------------ */
.rt-hide{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-start:16px;z-index:2;display:flex;align-items:center;gap:6px;
  min-height:40px;padding:0 14px;border-radius:var(--rpill);border:1px solid var(--hair-hi);background:rgba(20,20,26,.7);
  color:var(--text);font-size:14px;font-weight:700}
.rt-hide svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.restbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;min-height:48px;padding:0 16px;border-radius:var(--rpill);
  border:1px solid rgba(var(--accentHi-rgb),.5);background:rgba(var(--accent-rgb),.12);color:var(--text);font-size:14px;font-weight:700}
.restbar b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--accentHi)}
.restbar i{margin-inline-start:auto;font-style:normal;color:var(--dim);font-weight:600}
/* ---- Progress: this week's sets per muscle ------------------------------------------ */
.pgshare-r.wv.ok .bar i{background:var(--ok)}
.pgshare-r.wv.low .bar i{opacity:.55}
.pgnote{margin:10px 0 0;font-size:12.5px;color:var(--dim);line-height:1.45}
/* ---- readiness, session effort, pain (session.js, sheets.js) ------------------------- */
.ready{margin:12px 0 0;padding:10px 12px 12px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised)}
.ready .ready-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ready .ready-c button{min-height:36px}
.ready-h,.wc2-effort-h{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.ready-c{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ready-c button{min-height:44px;padding:0 2px;border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);
  color:var(--sub);font-size:12.5px;font-weight:700}
.ready-c button.on{background:rgba(var(--accent-rgb),.16);border-color:rgba(var(--accentHi-rgb),.7);color:var(--text)}
.ready-skip{flex:none;margin-block:-6px;margin-inline:0 -6px;padding:0 8px;border:none;background:none;color:var(--dim);font-size:13px;font-weight:600;
  letter-spacing:0;text-transform:none;min-height:32px}
.readynote,.painnote{margin:14px 0 0;padding:12px 14px;border-radius:var(--r4);font-size:13.5px;line-height:1.45}
.readynote{background:var(--raised);border:1px solid var(--border);color:var(--sub)}
.readynote .readyless{display:flex;margin:10px 0 0}
.painnote{background:rgba(var(--warning-rgb),.10);border:1px solid rgba(var(--warning-rgb),.45);color:var(--text)}
.linkbtn{border:none;background:none;padding:0;color:var(--accentHi);font-weight:700;font-size:inherit;text-decoration:underline}
.ss-act.on{color:var(--gold);border-color:rgba(var(--gold-rgb),.5)}
.wc2-effort{margin-top:14px;text-align:start}
/* ---- Training, Food, Coach, Progress: the simple pages and the planning hub -------------
   Training and Food are for the day; Coach (js/ui/views/coach.js) holds the planning in
   three sections; Progress opens on a plain-words slide. */
.htiles.two{margin:4px 0 14px}
.btn.flogplan{margin:10px 0 0}
/* Coach has something to say: a dot on its tab, its count in the accessible name. */
.dock-b.advice::after{content:"";position:absolute;top:7px;right:8px;width:8px;height:8px;
  border-radius:50%;background:var(--dock-flag);box-shadow:0 0 0 2px var(--dock-dot-solid);pointer-events:none}
.dock-b.on.advice::after{box-shadow:0 0 0 2px var(--dock-pill);background:var(--dock-pill-ink)}
.csub{margin:-4px 0 16px}
.coachhero{position:relative;isolation:isolate;overflow:hidden;margin:0 0 var(--s4);padding:18px 16px 16px;border-radius:var(--r5);
  border:1px solid var(--accent-edge);background:linear-gradient(160deg,var(--accent-tint),rgba(255,255,255,0) 60%),var(--raised);box-shadow:var(--shadow-card)}
.coachhero h2{margin:6px 0 8px;font-family:var(--display);font-size:24px;line-height:1.15}
.coachhero p{margin:0 0 16px;font-size:14px;line-height:1.55;color:var(--sub);max-width:36ch}
.coachhero .btn{margin:0}
.coachhero-art{position:absolute;inset-inline-end:-12px;top:-6px;width:140px;opacity:.28;z-index:-1;pointer-events:none}
[dir="rtl"] .coachhero-art{transform:scaleX(-1)}
.coachplan{margin:0 0 var(--s4);padding:16px 14px 14px;border-radius:var(--r5);border:1px solid var(--border);box-shadow:var(--shadow-card);
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--raised)}
.coachplan h2{margin:4px 0 2px;font-family:var(--display);font-size:22px}
.coachplan-s{margin:0 0 10px;font-size:13px;color:var(--dim)}
.coachplan-r{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.coachplan-l{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;
  width:100%;min-height:56px;padding:9px 2px;border:0;border-bottom:1px solid var(--hair);background:none;color:var(--text);font:inherit;text-align:start;cursor:pointer}
.coachplan-k{grid-column:1;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.coachplan-v{grid-column:1;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.coachplan-l .ico{grid-column:2;grid-row:1/3;color:var(--dim)}
:root:not(.tch) .coachplan-l:active,.coachplan-l.tapd{background:var(--surface)}
.coachplan-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.coachplan-a .btn{margin:0}
/* The assessment's meals: each with its foods under it. */
.as-meals div{flex-wrap:wrap}
.as-meals small{flex-basis:100%;margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--sub)}
/* Progress's three views. */
.pgtabs2{margin:4px 0 10px}
.psimple-k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.psimple-h{margin:4px 0 4px;font-family:var(--display);font-size:20px;line-height:1.25}
.psimple-h b{font-variant-numeric:tabular-nums}
.psimple p{margin:0;font-size:14px;line-height:1.5;color:var(--sub)}
.psimple .btn{margin:12px 0 0}
/* ---- glyphs (js/ui/glyphs.js) --------------------------------------------------
   Line icons on the 24px grid: a 1.75 stroke in the text colour, square caps, mitred
   joins. A glyph tile is the square they sit in, in the theme's highlight colour
   (Glacier Blue on Red dark) rather than the accent, which stays for actions. */
.gl{display:block;width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;
  stroke-linecap:square;stroke-linejoin:miter}
.gtile,.chat-gl{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:var(--r2);
  background:var(--surface);color:var(--secondary);box-shadow:inset 0 0 0 1px var(--hair)}
/* An eyebrow: small, spaced capitals in the quiet ink. Arabic has no capitals, and
   spacing pulls its joined letters apart, so it is set plain. */
.eyebrow,.chat-grp-h,.chat-next-h,.chat-ak{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
[dir="rtl"] .eyebrow,[dir="rtl"] .chat-grp-h,[dir="rtl"] .chat-next-h,[dir="rtl"] .chat-ak{letter-spacing:0;font-size:12.5px}

/* ---- Coach AI → Ask the coach (js/ui/views/chat.js) ------------------------------
   A guided coach, not a chatbot: the header says where answers come from; the opening
   screen lists what can be asked, by subject; a question is a short neutral line on
   the reading side and an answer a card that names its subject, with lists as ruled
   rows, notes set apart and its buttons last. The box to type in floats above the
   dock, so it stays in reach in a long conversation; it is glass of the page's own
   ground, not the dock's dark chrome, because what is typed in it is page ink. */
.chat-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.chat-head-t{flex:1;min-width:0}
.chat-head h1{font-size:26px;line-height:1.15}
.chat-priv{display:flex;align-items:center;gap:6px;margin:3px 0 0;font-size:12.5px;color:var(--dim)}
.chat-priv .gl{width:14px;height:14px;stroke-width:2}
.chat-clear{flex:none;color:var(--dim);margin-inline-end:-8px}
.chat-clear .gl{width:22px;height:22px}
.chat{display:flex;flex-direction:column;gap:22px;margin:14px 0 0}
.chat-hi{margin:2px 0 0;font-size:15px;line-height:1.55;color:var(--sub)}
.chat-grp-h{margin:0 0 8px;padding-inline-start:4px}
.chat-topics{border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);overflow:hidden}
.chat-topic{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border:0;
  border-bottom:1px solid var(--border);background:none;color:var(--text);font:inherit;font-size:15px;font-weight:600;
  line-height:1.35;text-align:start;cursor:pointer;transition:background var(--m-micro) var(--e-standard)}
.chat-topic:last-child{border-bottom:0}
.chat-topic .chat-gl{width:34px;height:34px}
.chat-topic-q{flex:1;min-width:0}
.chat-topic .ico-chev{color:var(--dim)}
:root:not(.tch) .chat-topic:active,.chat-topic.tapd{background:var(--surface)}
.chat-dis{margin:-8px 4px 0;font-size:12.5px;line-height:1.55;color:var(--dim)}
.chat-x{display:flex;flex-direction:column;gap:8px}
.chat-q{align-self:flex-end;max-width:84%;padding:9px 14px;border-radius:18px;border-end-end-radius:6px;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--hair-hi)}
.chat-q p{margin:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.chat-a{padding:14px 16px 16px;border-radius:22px;border:1px solid var(--border);background:var(--raised);box-shadow:var(--shadow-card)}
.chat-x:not(.live) .chat-a{box-shadow:none}
.chat-ah{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.chat-ah .chat-gl{width:32px;height:32px;border-radius:10px}
.chat-ah .gl{width:18px;height:18px}
.chat-ah-t{display:flex;flex-direction:column;min-width:0;gap:1px}
.chat-at{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25}
.chat-a p{margin:0 0 10px;font-size:15px;line-height:1.55}
.chat-l{list-style:none;margin:2px 0 12px;padding:0;border-top:1px solid var(--border)}
.chat-l li{padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums}
.chat-a .chat-n{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:var(--r2);
  background:var(--surface);font-size:13.5px;line-height:1.5;color:var(--sub)}
.chat-n .gl{width:16px;height:16px;margin-top:2px;color:var(--dim)}
.chat-a>:last-child{margin-bottom:0}
.chat-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chat-acts .btn{flex:1 1 auto;width:auto;margin:0}
.chat-next{margin:22px 0 0}
.chat-next-h{margin:0 0 8px;padding-inline-start:4px}
.chat-chips{display:flex;flex-wrap:wrap;gap:8px}
.chat-chip{min-height:40px;padding:8px 14px;border-radius:var(--rpill);border:1px solid var(--border);background:var(--raised);
  color:var(--text);font:inherit;font-size:14px;font-weight:600;line-height:1.3;text-align:start;cursor:pointer}
:root:not(.tch) .chat-chip:active,.chat-chip.tapd{background:var(--surface);border-color:var(--hair-hi)}
.chat-form{position:sticky;z-index:5;bottom:calc(var(--navh) + 10px);display:flex;align-items:center;gap:8px;
  margin:20px 0 10px;padding:5px;padding-inline-start:18px;border-radius:var(--rpill);border:1px solid var(--hair-hi);
  background:rgba(var(--bg-rgb),.84);box-shadow:var(--shadow-float);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  transition:bottom var(--m-screen) var(--e-ios),border-color var(--m-micro) var(--e-standard)}
body.kb .chat-form,body:has(nav.dhid) .chat-form{bottom:max(10px,env(safe-area-inset-bottom))}
.chat-form:focus-within{border-color:var(--accent-edge)}
.chat-form input{flex:1;min-width:0;min-height:44px;margin:0;padding:0;border:0;border-radius:0;background:none;font-size:16px}
.chat-form input:focus{border:0}
.chat-send{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:22px;
  background:var(--accent);color:var(--onAccent);cursor:pointer}
.chat-send .gl{width:20px;height:20px;stroke-width:2.1}
:root:not(.tch) .chat-send:active,.chat-send.tapd{transform:scale(.94)}
/* The chat as glass, in motion (js/ui/chatmotion.js). A question is a bubble of the
   accent's glass on the reading side; an answer a glass card on the coach's side, its
   tail toward it. Sent, a question flies from the box to its place; the coach types,
   three dots; the answer comes in part after part. */
.chat-q{background:linear-gradient(135deg,rgba(var(--accent-rgb),.32),rgba(var(--accent-rgb),.16));border-radius:20px;border-end-end-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(var(--accentHi-rgb),.36),inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px -14px rgba(var(--accent-rgb),.6)}
.chat-a{border-color:var(--card-edge);border-radius:22px;border-end-start-radius:6px;
  box-shadow:inset 0 1px 0 var(--hair-hi),0 16px 36px -22px rgba(0,0,0,.55)}
.chat-ah .chat-gl,.chat-topic .chat-gl,.chatcard-h .chat-gl{border-radius:50%;color:var(--accentHi);
  background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.16),transparent 55%),rgba(var(--accent-rgb),.16);
  box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.32)}
.chat-topics{box-shadow:inset 0 1px 0 var(--hair-hi)}
.chat-topic{border-bottom-color:var(--card-edge)}
.chat-chip{background:rgba(var(--bg-rgb),.38);border-color:var(--card-edge);
  transition:transform var(--m-press) var(--e-standard),border-color var(--m-micro) var(--e-standard)}
:root:not(.tch) .chat-chip:active,.chat-chip.tapd{transform:scale(.96);border-color:rgba(var(--accentHi-rgb),.5)}
.chat-form{box-shadow:inset 0 1px 0 var(--hair-hi),var(--shadow-float);border-color:var(--card-edge)}
.chat-send{background:linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.78));box-shadow:0 8px 18px -8px rgba(var(--accent-rgb),.75);
  transition:transform var(--m-press) var(--e-standard)}
.chat-send .gl{transition:transform .2s var(--e-standard)}
:root:not(.tch) .chat-send:active .gl,.chat-send.tapd .gl{transform:translate(3px,-3px)}
[dir="rtl"] :root:not(.tch) .chat-send:active .gl,[dir="rtl"] .chat-send.tapd .gl{transform:translate(-3px,-3px)}
/* The coach typing. */
.chat-typing{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;padding:14px 16px;border-radius:20px;border-end-start-radius:6px;
  background:var(--card);box-shadow:inset 0 0 0 1px var(--card-edge),inset 0 1px 0 var(--hair-hi);
  animation:chatIn .26s var(--e-decel) both}
.chat-typing i{width:7px;height:7px;border-radius:50%;background:var(--accentHi);opacity:.5;animation:chatDot 1s ease-in-out infinite}

   send or an answer's button blurs the field first, and moving the panel then would put
   something else under the finger. */
body.kb #cpanel,body.kbleave #cpanel{padding-bottom:10px}
.cp-veil{position:absolute;inset:0;width:100%;padding:0;border:0;border-radius:0;background:rgba(var(--bg-rgb),.42);cursor:default}
.cp{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;min-height:0;
  max-height:min(70vh,calc(var(--vvh,100dvh) - var(--navh) - 72px));max-height:min(70dvh,calc(var(--vvh,100dvh) - var(--navh) - 72px));
  border-radius:var(--r5);border:1px solid var(--card-edge);color:var(--text);
  background:var(--raised);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-float);outline:none;
  transform-origin:calc(100% - 32px) calc(100% + var(--navh))}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .cp{background:rgba(var(--bg-rgb),.86);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}}
.cp.full{position:fixed;left:8px;right:8px;width:auto;max-width:none;max-height:none;
  top:calc(var(--vvt,0px) + max(8px,env(safe-area-inset-top)));
  height:calc(var(--vvh,100dvh) - max(8px,env(safe-area-inset-top)) - max(8px,env(safe-area-inset-bottom)))}
#cpanel.opening .cp{animation:cpIn 260ms var(--e-ios)}
#cpanel.opening .cp-veil{animation:fadeIn 200ms var(--e-standard)}
#cpanel.resized .cp{animation:wkIn var(--m-comp) var(--e-decel)}
#cpanel.closing .cp{animation:cpOut 200ms var(--e-accel) forwards}
#cpanel.closing .cp-veil{animation:fadeIn 200ms var(--e-standard) reverse forwards}
@keyframes cpIn{from{opacity:0;transform:scale(.12);border-radius:50%}}
@keyframes cpOut{to{opacity:0;transform:scale(.12)}}
.cp-h{display:flex;align-items:center;gap:var(--s2);padding:10px 8px 8px var(--s4);border-bottom:1px solid var(--hair)}
.cp-mark{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;
  background:var(--accent-tint);color:var(--accentHi)}
.cp-mark .gl{width:20px;height:20px;stroke-width:2}
.cp-ht{flex:1;min-width:0}
.cp-ht h2{margin:0;font-family:var(--display);font-size:17px;font-weight:700;line-height:1.2}
.cp-ht p{margin:1px 0 0;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-ib{width:var(--hit);height:var(--hit);flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:50%;
  background:none;color:var(--sub)}
.cp-ib .gl{width:20px;height:20px}
:root:not(.tch) .cp-ib:active,.cp-ib.tapd{background:var(--surface)}
.cp-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.cp-hi{margin:0;font-size:15px;color:var(--sub)}
.cp-more{align-self:center;min-height:var(--hit);padding:0 var(--s3);border:0;background:none;color:var(--accentHi);font-weight:700;font-size:13.5px}
.cp .chat-a{background:var(--surface);box-shadow:none}
.cp .chat-next{margin:0}
.cp .chat-chip{min-height:40px}
.cp-sug{display:flex;flex-wrap:wrap;gap:6px}
.cp-chip{min-height:40px;padding:0 var(--s3);border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-weight:600;font-size:13.5px;text-align:start;position:relative}
.cp-chip::after{content:"";position:absolute;inset:-2px 0}
/* An answer reads as its lead, one or two sentences, with the rest behind More. */
.chat-a .chat-lead{margin:0 0 var(--s2);font-size:17px;font-weight:600;line-height:1.45;color:var(--text)}
.chat-lead .num{font-weight:800}
.chat-more{margin:0}
.chat-more>summary{display:inline-flex;align-items:center;min-height:var(--hit);padding:0 var(--s1);margin-inline-start:calc(var(--s1) * -1);
  list-style:none;color:var(--accentHi);font-weight:700;font-size:14px;cursor:pointer}
.chat-more>summary::-webkit-details-marker{display:none}
.chat-more>summary::after{content:"";width:7px;height:7px;margin-inline-start:var(--s2);border:solid currentColor;border-width:0 2px 2px 0;
  transform:translateY(-2px) rotate(45deg);transition:transform var(--m-micro) var(--e-standard)}
.chat-more[open]>summary::after{transform:translateY(1px) rotate(-135deg)}
.chat-more[open]>summary{margin-bottom:var(--s1)}
.chat-src{font-size:12.5px;color:var(--dim)}
/* A request: what will change, the tap that does it, then done with Undo. */
.ag-item{display:flex;flex-direction:column;gap:calc(var(--s1) / 2);margin:0 0 var(--s3);padding:var(--s3);border-radius:var(--r2);
  background:var(--raised);border:1px solid var(--border)}
.ag-item b{font-size:15px}
.ag-item span{font-size:13.5px;color:var(--sub)}
.ag-acts{display:flex;gap:var(--s2)}
.ag-acts .btn{flex:1 1 0;width:auto;min-height:52px;margin:0}
.ag-acts .ag-ok{background-color:var(--color-action-fill);font-family:var(--display);font-size:18px;font-weight:700}
.ag-done{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s2) var(--s2) var(--s3);border-radius:var(--r2);
  background:var(--okSoft);border:1px solid var(--ok)}
.ag-ck{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ok);color:var(--onOk)}
.ag-ck .gl{width:20px;height:20px;stroke-width:2.4}
.ag-t{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.4}
.ag-undo{flex:none;min-height:var(--hit);padding:0 var(--s3);border:0;border-radius:var(--rpill);background:none;color:var(--text);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ag-undone{display:flex;align-items:center;gap:var(--s2);padding:var(--s3);border-radius:var(--r2);border:1px dashed var(--border);color:var(--sub);font-size:14px}
.ag-undone .gl{width:18px;height:18px;flex:none}
.ag-opts{display:flex;flex-direction:column;gap:var(--s2)}
.ag-opt{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:calc(var(--s1) / 2);min-height:52px;padding:var(--s2) var(--s4);
  border-radius:var(--r2);border:1px solid var(--border);background:var(--raised);color:var(--text);text-align:start;cursor:pointer}
.ag-opt.none{border-style:dashed;background:none;color:var(--sub)}
.ag-ol{font-size:15px;font-weight:600;line-height:1.3}
.ag-os{font-size:12.5px;color:var(--dim)}
:root:not(.tch) .ag-opt:active,.ag-opt.tapd{background:var(--surface);border-color:var(--hair-hi)}
.cp-f{display:flex;gap:var(--s2);padding:var(--s2) var(--s3) var(--s3);border-top:1px solid var(--hair)}
.cp-f input{flex:1;min-width:0;min-height:44px;margin:0;padding:0 var(--s4);border-radius:var(--rpill);
  border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px}
.cp .cp-f input{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;background-color:var(--surface)}
.cp-send{width:44px;height:44px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:50%;
  background:var(--color-action-fill);box-shadow:inset 0 0 0 1.5px var(--color-action-edge);color:var(--onAccent)}
.cp-send .gl{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){.cfab,#cpanel .cp,#cpanel .cp-veil{animation:none!important}}
body.noanim .cfab,body.noanim #cpanel .cp,body.noanim #cpanel .cp-veil,:root.reduced .cfab,:root.reduced #cpanel .cp,:root.reduced #cpanel .cp-veil{animation:none!important}
/* ---- Glass, everywhere -----------------------------------------------------------
   The owner's references: frosted glass over a blended, drawn ground. Cards, buttons,
   chips, fields, the segmented control, the round header buttons and the dock are
   glass: a translucent fill of the theme's tone, the ground and its drawings (#bgart)
   blurred behind it, a light rim, and a highlight along the top edge. The primary
   action is the accent as coloured glass, lit from above. A glass surface inside
   another only tints (a second blur would cost the phone and show nothing new). Where
   the browser cannot blur, every one keeps the solid fill given above. */
:root{--glass-blur:20px;--glass-sat:150%}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  /* Each at the weight of its own base rule (:where adds none), so a state that has its
     own look (a chosen day, an open card, a selected pill) still wins over the glass. */
  :where(#app) :is(.card,.twk,.thero2,.ttile,.htile,.drow,.list,.tprog-card,.dlcard,.pgcard,.pgstat,.pgmac,.sg-list,.pid,
    .chat-a,.chatcard,.chat-topics,.coachplan,.coachhero,.ready,.exhero){
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
    backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
    box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-card)}
  .btn.g,.pill:where(:not(.a):not(.ok):not(.gold):not(.sup)),.seg,.hbtn:where(:not(.havatar)),.iconbtn,
  :where(#app) :is(input,select,textarea):where(:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file])){
    background-color:var(--glass-btn);border-color:var(--glass-btn-edge);
    -webkit-backdrop-filter:blur(14px) saturate(var(--glass-sat));backdrop-filter:blur(14px) saturate(var(--glass-sat));
    box-shadow:inset 0 1px 0 var(--glass-hi)}
  .seg{background-image:none}
  #app :is(.card,.twk,.thero2,.ttile,.htile,.drow,.list,.tprog-card,.dlcard,.pgcard,.pgstat,.pgmac,.sg-list,.pid,
    .chat-a,.chatcard,.chat-topics,.coachplan,.coachhero,.ready,.exhero)
    :is(.card,.list,.drow,.ttile,.htile,.pill,.seg,.btn.g,.hbtn,.iconbtn,input,select,textarea){
    -webkit-backdrop-filter:none;backdrop-filter:none}
  .dock{box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow-float)}
}
/* The primary action, lit from above. At a plain .btn's weight (:where adds none), so a
   button that is given its own fill (a delete's red, a sheet's own) keeps it. */
.pill.a,.seg-ind,.btn.fadd,.btn.ss-next{
  background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 56%),linear-gradient(180deg,var(--accent),var(--accent-deep))}
.btn:where(:not(.g):not(.o):not(.ok):not(.danger):not(.d)){
  background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 56%),linear-gradient(180deg,var(--color-action-fill),var(--accent-deep));
  box-shadow:inset 0 0 0 1.5px var(--color-action-edge),inset 0 1px 0 rgba(255,255,255,.36),inset 0 0 0 1px rgba(255,255,255,.10),0 12px 28px -14px rgba(var(--accent-rgb),.8)}
/* In Red the label sits on flat accent-deep (token-requests.md §4): the light from above
   would lift the top of the fill back towards Machine Red, under the label. */
[data-palette="red"] .btn:where(:not(.g):not(.o):not(.ok):not(.danger):not(.d)){background-image:none;background-color:var(--color-action-fill)}
</style>
</head>
<body>
<!-- The drawings' shared paint (js/ui/art.js): a stroke that runs from the highlight down
     into the accent, a glass fill for closed shapes, a glow for embers and discs. Theme
     colours through CSS variables, so every palette and mode paints its own. -->
<svg id="artdefs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <linearGradient id="artStroke" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160">
      <stop offset="0" style="stop-color:var(--accentHi)"/><stop offset=".55" style="stop-color:var(--accentHi)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
    <linearGradient id="artFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--accentHi);stop-opacity:.34"/><stop offset=".6" style="stop-color:var(--accent);stop-opacity:.12"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>
    <linearGradient id="artHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--accentHi);stop-opacity:.42"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>
    <radialGradient id="artGlow">
      <stop offset="0" style="stop-color:var(--accentHi);stop-opacity:.75"/><stop offset=".35" style="stop-color:var(--accentHi);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>
  </defs>
</svg>
<div id="splash" aria-hidden="true" data-theme="dark">
  <div class="sp-art"></div>
  <div class="sp-glow"></div>
  <div class="sp-veil"></div>
  <div class="sp-embers">
    <i class="sp-em" style="left:16%;--dx:14px;animation-duration:7.2s;animation-delay:.2s"></i>
    <i class="sp-em" style="left:31%;--dx:-10px;animation-duration:8.6s;animation-delay:1.1s"></i>
    <i class="sp-em" style="left:48%;--dx:8px;animation-duration:6.4s;animation-delay:.6s"></i>
    <i class="sp-em" style="left:63%;--dx:-16px;animation-duration:9.1s;animation-delay:1.7s"></i>
    <i class="sp-em" style="left:78%;--dx:11px;animation-duration:7.8s;animation-delay:.9s"></i>
    <i class="sp-em" style="left:89%;--dx:-7px;animation-duration:8.2s;animation-delay:2.1s"></i>
  </div>
  <div class="sp-mid">
    <span class="sp-mark"><i class="mk"></i></span>
    <div class="sp-name">BUNYAN</div>
    <div class="sp-rule"><i></i><b></b><i></i></div>
    <div class="sp-tag">Built Through Discipline</div>
  </div>
  <div class="sp-her" lang="ar" dir="rtl">بُنيان</div>
</div>
<div id="bgart" aria-hidden="true"></div>
<div id="app"></div>
<nav id="nav"></nav>
<div id="wbar"></div>
<div id="cfab"></div>
<div id="cpanel" hidden></div>
<div id="sheet"></div>
<div id="rest" data-theme="dark"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
