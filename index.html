.bcount-c button.on{background:linear-gradient(180deg,var(--accent),var(--accent-deep));border-color:transparent;color:var(--onAccent);
  box-shadow:0 8px 18px -10px var(--accent-glow)}
.bnum{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-family:var(--display);font-weight:800;font-size:15px}
.bkday.blank .bnum{background:var(--surface);border-color:var(--border);color:var(--dim)}
.bkday.blank{border-style:dashed}
.drow-s em{font-style:normal;color:var(--faint);font-weight:500}
.dmain .ico-chev{flex:0 0 auto;margin-inline-end:6px;color:var(--dim)}
.dedit .ico-edit{flex:0 0 auto;margin-inline-end:8px;opacity:.55}
.bsp.on{border-color:rgba(var(--accentHi-rgb),.55);background:linear-gradient(180deg,rgba(var(--accent-rgb),.10),transparent),var(--raised)}
.bpill{flex:0 0 auto;margin-inline-end:10px;padding:5px 12px;border-radius:var(--rpill);font-size:12px;font-weight:700;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--onAccent)}
.trow .bpill{margin-inline-end:0}
.bdays{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 46px;height:46px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);font-size:10px;color:var(--dim);line-height:1.1}
.bdays b{font-family:var(--display);font-size:17px;color:var(--text)}
.trow:has(.bdays){gap:14px}
.trow>.bdays:first-child{flex:0 0 46px}
.trow:has(.bdays)>span:nth-child(2){flex:1;min-width:0;text-align:start}
/* ---- Train: Today · My Program · Explore ------------------------------------------ */
.tsecs{margin:4px 0 16px}
.twk{margin:0 0 14px;padding:12px;border-radius:var(--r4);border:1px solid var(--border);
  background:radial-gradient(90% 90% at 100% 0%,rgba(var(--glow-rgb),.10),transparent 70%),var(--raised)}
.twk-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.twk-h b{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.twk-r{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.twk-d{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;border-radius:14px;
  border:1px solid transparent;background:var(--surface);color:var(--text);transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .twk-d:active,.twk-d.tapd{transform:scale(.94)}
.twk-w{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--dim);text-transform:uppercase}
.twk-n{font-family:var(--display);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.twk-d i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%}
.twk-d.plan i{width:7px;height:7px;margin:4.5px;background:var(--accentHi)}
.twk-d.done i{background:var(--ok);color:#fff}
.twk-d.done i svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.twk-d.rest,.twk-d.past{background:transparent}
.twk-d.rest .twk-n,.twk-d.past .twk-n{color:var(--dim)}
.twk-d.today{border-color:rgba(var(--accentHi-rgb),.55)}
.twk-d.sel{background:linear-gradient(180deg,rgba(var(--accent-rgb),.26),rgba(var(--accent-rgb),.10));border-color:rgba(var(--accentHi-rgb),.7)}
.twk-d.sel .twk-w{color:var(--sub)}
.tquick{width:100%;margin-top:14px}
/* Schedule: two choices side by side; weekday chips under each day. */
.bsched{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.bsched button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:var(--r4);
  border:1px solid var(--border);background:var(--raised);color:var(--text);text-align:start}
.bsched button b{font-family:var(--display);font-size:15px}
.bsched button span{font-size:12px;color:var(--dim)}
.bsched button.on{border-color:rgba(var(--accentHi-rgb),.6);background:linear-gradient(180deg,rgba(var(--accent-rgb),.18),rgba(var(--accent-rgb),.05)),var(--raised)}
.bsched button.on b{color:var(--accentHi)}
.bkday{flex-wrap:wrap}
.bwd{flex:1 0 100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:0 12px 12px 12px}
.bwd button{min-height:34px;padding:0;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--sub);font-size:11.5px;font-weight:700}
.bwd button.on{background:linear-gradient(180deg,var(--accent),var(--accent-deep));border-color:transparent;color:var(--onAccent)}
.bwd button.taken{opacity:.35}
.wkoffer-l{margin:-4px 0 12px;font-weight:600;color:var(--text);font-size:14px;line-height:1.6}
.bactive{margin:0;text-align:center;color:var(--ok);font-weight:700;font-size:15px}
.bnote{margin:0;text-align:center;color:var(--dim);font-size:13px}
.dbegin:disabled{opacity:.45;box-shadow:none}
/* The exercise sheet: four figures as − value + tiles in one rounded card. */
.exsg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r4);
  background:var(--raised);overflow:hidden;margin-bottom:14px}
.exsg.one{grid-template-columns:1fr}
.exs{display:flex;flex-direction:column;gap:8px;padding:12px;min-width:0}
.exsg:not(.one) .exs:nth-child(even){border-inline-start:1px solid var(--border)}
.exsg .exs:nth-child(n+3){border-top:1px solid var(--border)}
.exs-l{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.exs-c{display:flex;align-items:center;gap:6px}
.exs-b{flex:0 0 40px;width:40px;height:40px;border-radius:50%;padding:0;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:20px;line-height:1;transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .exs-b:active,.exs-b.tapd{transform:scale(.9);background:rgba(var(--accent-rgb),.16);border-color:rgba(var(--accentHi-rgb),.5)}
.exs-v{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:2px}
.sheetbox .exs-v input{width:100%;min-width:0;min-height:40px;margin:0;padding:0;border:none;background:none;
  text-align:center;font-family:var(--display);font-size:24px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.exs-v input::-webkit-outer-spin-button,.exs-v input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.exs-v input:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accentHi)}
.exs-v i{font-style:normal;font-size:13px;font-weight:700;color:var(--dim)}
.exsuper{display:flex;flex-direction:column;gap:4px;margin:0 0 14px;padding:12px 14px;border-radius:var(--r4);
  border:1px solid rgba(var(--gold-rgb),.45);background:rgba(var(--gold-rgb),.06);font-size:13px;color:var(--dim)}
.exsuper b{color:var(--gold);font-size:14px}
.exacts{margin-bottom:16px}
.exrm{display:block;margin:10px auto 0}

/* ================= Live session — canvas screens 3 and 4 (nodes 2:1008, 2:1060)
   The two frames are one screen here: screen 3 is the context above the table and
   screen 4 is the table itself, which the app has always shown together. Splitting
   them would add a mode to the one screen that has to work one-handed between sets. */
.ico-clock{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='16' height='16' viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg clip-path='url(%23clip0_0_4)'%3E%3Cpath d='M8 3.99968V8L10.6669 9.33344M14.6672 8C14.6672 11.6822 11.6822 14.6672 8 14.6672C4.31781 14.6672 1.3328 11.6822 1.3328 8C1.3328 4.31781 4.31781 1.3328 8 1.3328C11.6822 1.3328 14.6672 4.31781 14.6672 8Z' stroke='%23D6222E' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3Cdefs%3E%3CclipPath%3E%3Crect width='16' height='16' fill='white'/%3E%3C/clipPath%3E%3C/defs%3E%3C/svg%3E")}
.ico-bulb{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='16' height='16' viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M10 9.33344C10.1333 8.66672 10.4667 8.20002 11 7.66664C11.6667 7.06659 12 6.19986 12 5.33312C12 4.27217 11.5786 3.25467 10.8284 2.50447C10.0783 1.75426 9.06087 1.3328 8 1.3328C6.93913 1.3328 5.92172 1.75426 5.17157 2.50447C4.42143 3.25467 4 4.27217 4 5.33312C4 5.99984 4.13333 6.7999 5 7.66664C5.46667 8.13334 5.86667 8.66672 6 9.33344M6 12.0003H10M6.66667 14.6672H9.33333' stroke='%23F59E0B' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
.ss-clock{display:flex;align-items:center;gap:6px}
.ss-clock .ico-clock{color:var(--accent);width:16px;height:16px;flex-basis:16px}
.ss-more{background:none;border:none;color:var(--dim);font-size:22px;line-height:1;
  min-width:44px;min-height:44px;padding:0;margin-inline-end:-10px}

.exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.exhead .ex-name{flex:1;min-width:0}
/* The frame's ⓘ: a 24px disc, in a 44px target. */
.infobtn{flex:0 0 44px;width:44px;height:44px;margin:-10px -10px 0 0;padding:0;
  background:none;border:none;display:flex;align-items:center;justify-content:center}
[dir="rtl"] .infobtn{margin:-10px 0 0 -10px}
.infobtn::before{content:"i";width:24px;height:24px;border-radius:12px;background:var(--surface);
  color:var(--accentHi);font-family:var(--display);font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;font-style:italic}
.infobtn{font-size:0}

/* START and END, side by side. The frame draws abstract bars; these are the library's
   own photographs of the two positions, which is what the bars stand in for. */
.formvis{display:flex;gap:12px;margin-bottom:16px}
.formvis figure{flex:1;min-width:0;margin:0;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.formvis img{width:100%;height:96px;object-fit:cover;display:block;background:var(--surface)}
.formvis figcaption{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);text-align:center;padding:8px 6px}

.ex-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.etag{background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:4px 10px;font-size:11px;font-weight:600;color:var(--text)}
.etag.hot{color:var(--accentHi)}

/* The recommendation, above the table as the frame places it. */
.recbar{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:16px;
  font-size:12px;color:var(--text)}
.recbar .ico-bulb{color:var(--accentHi);flex:0 0 16px}
.recbar b{font-weight:700}

/* Two secondary actions, as the frame has. Everything else is in the overflow. */
.ss-links{display:flex;justify-content:center;gap:24px;margin-top:20px}
.ss-links button{background:none;border:none;color:var(--dim);font-size:13px;font-weight:600;
  text-decoration:underline;min-height:44px;padding:0 4px}

/* ================= Food — dashboard and meal detail (nodes 13:12, 13:118) */
.ico-drop{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='20' height='20' viewBox='0 0 20 20' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M14.1253 16.6254C13.0312 17.7194 11.5473 18.334 10 18.334C8.45273 18.334 6.96883 17.7194 5.87474 16.6254C4.78065 15.5314 4.166 14.0476 4.166 12.5004C4.166 10.8337 4.99943 9.25028 6.66629 7.91689C8.33314 6.58351 9.58329 4.58342 10 2.5C10.4167 4.58342 11.6669 6.58351 13.3337 7.91689C15.0006 9.25028 15.834 10.8337 15.834 12.5004C15.834 14.0476 15.2193 15.5314 14.1253 16.6254Z' stroke='%23E31B23' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
.ico-plus{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M4.9992 12H19.0008M12 4.9992V19.0008' stroke='%23ECEAE6' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
.ico-trash{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='20' height='20' viewBox='0 0 20 20' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M15.8333 4.9996V16.6672C15.8333 17.1093 15.6577 17.5332 15.3452 17.8458C15.0326 18.1584 14.6087 18.334 14.1667 18.334H5.83333C5.39131 18.334 4.96738 18.1584 4.65482 17.8458C4.34226 17.5332 4.16667 17.1093 4.16667 16.6672V4.9996M2.5 4.9996H17.5M6.66667 4.9996V3.3328C6.66667 2.89074 6.84226 2.46678 7.15482 2.15419C7.46738 1.84161 7.89131 1.666 8.33333 1.666H11.6667C12.1087 1.666 12.5326 1.84161 12.8452 2.15419C13.1577 2.46678 13.3333 2.89074 13.3333 3.3328V4.9996' stroke='%23ECEAE6' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}

/* Water. The frame's eight glasses are a fixed row; the goal is the user's, so the
   count comes from it and the glasses shrink to fit however many that is. */
.fwater{background:var(--surface);border-radius:16px;padding:12px var(--gutter);
  margin-bottom:20px}
.fwater-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:12px}
.fwater-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.fwater-t .ico-drop{color:var(--accent);width:20px;height:20px;flex-basis:20px}
.fwater-c{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.fwater-r{display:flex;align-items:center;gap:12px}
.fglasses{display:flex;gap:8px;flex:1;min-width:0}
/* Eight of these fit at their drawn 20px; twelve do not, so the basis is 0 and the
   cap is 20 — they share the row and never overflow it. The button is the full row
   height so the target is 44px tall even where the glass is 17px wide. */
.fglass{flex:1 1 0;min-width:0;max-width:20px;height:44px;padding:0;background:none;
  border:none;display:flex;align-items:center;justify-content:center}
.fglass i{display:block;width:100%;height:20px;background:var(--raised);
  border:1px solid var(--border);border-radius:2px;
  clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}
.fglass.full i{background:var(--accent);border-color:var(--accent)}
:root:not(.tch) .fglass:active i,.fglass.tapd i{border-color:var(--accentHi)}
.fwater-add{flex:0 0 44px;width:44px;height:44px;padding:0;border:none;border-radius:8px;
  background:var(--accentSoft);color:var(--accentHi);
  display:flex;align-items:center;justify-content:center}
.fwater-add .ico-plus{width:16px;height:16px;flex-basis:16px}

/* ---- Food, redesign frame: the day's summary, meal tiles, today's meals --------- */
.fsum{display:grid;grid-template-columns:136px minmax(0,1fr);align-items:center;gap:18px;padding:18px;
  margin-bottom:var(--s3);border-radius:var(--r5);border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--raised);box-shadow:var(--shadow-card)}
.fring2{position:relative;width:136px;height:136px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fring2 svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(var(--glow-rgb),.25))}
.fring2-n{position:relative;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.fring2-u{position:relative;font-size:12px;color:var(--sub);margin-top:2px}
.fring2-g{position:relative;font-size:11.5px;color:var(--dim);margin-top:4px}
.fmac2{display:flex;flex-direction:column;gap:12px;min-width:0}
.fmac2-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fmac2-k{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub)}
.fmac2-k i{width:8px;height:8px;border-radius:4px;background:var(--mac)}
.fmac2-p{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.fmac2-v{font-family:var(--display);font-weight:700;font-size:16px;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.fmac2-v span{font-family:inherit;font-weight:500;font-size:12px;color:var(--dim)}
.fmac2-b{height:5px;border-radius:3px;background:var(--surface);overflow:hidden}
.fmac2-b i{display:block;height:100%;border-radius:3px;background:var(--mac)}
.fmac2-r.p{--mac:var(--mac-p)} .fmac2-r.c{--mac:var(--mac-c)} .fmac2-r.f{--mac:var(--mac-f)}
.fleft{font-size:12.5px;font-weight:700;color:var(--sub)}
.fleft.over{color:var(--warning)}
@media (max-width:360px){.fsum{grid-template-columns:1fr;justify-items:center}.fmac2{width:100%}}
/* The four meals as tiles. The one for now is lit like the dock's active item. */
.fmt{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:8px;margin-bottom:var(--s3)}
.fmt-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;min-height:92px;
  padding:12px 4px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);color:var(--text);
  transition:transform var(--m-press) var(--e-standard),border-color var(--m-micro) var(--e-standard)}
:root:not(.tch) .fmt-c:active,.fmt-c.tapd{transform:scale(.96)}
.fmt-c:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.fmt-i svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fmt-i{color:var(--sub)}
.fmt-n{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmt-k{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.fadd-m{font-weight:600;opacity:.85}
/* Food → Plan. The day at the top, as Train's program card is: a red kicker, the count
   of meals as the title, and what the plan adds up to against the day's targets. */
.plhero{position:relative;padding:18px;margin:4px 0 14px;border-radius:var(--r4);
  background:var(--raised);border:1px solid var(--border);box-shadow:var(--shadow-card)}
.plhero-t{font-family:var(--display);font-size:26px;font-weight:800;margin:6px 0 12px}
.plchips{display:flex;flex-wrap:wrap;gap:8px}
.plchips span{padding:6px 12px;border-radius:var(--rpill);border:1px solid var(--border);
  font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.plchips b{font-family:var(--display);font-size:15px;color:var(--text)}
.plhero-s{margin:12px 0 0;font-size:13px;line-height:1.45;color:var(--dim)}
.bnum.pli{color:var(--sub)}
.bnum.pli svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* A plan's foods, read-only: name and amount, calories at the end. */
.plist{display:flex;flex-direction:column;gap:2px;margin:0 0 12px;padding:6px 14px;
  border-radius:var(--r3);background:var(--raised);border:1px solid var(--border)}
.plist-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;font-size:14px}
.plist-r+.plist-r{border-top:1px solid var(--border)}
.plist-r i{font-style:normal;color:var(--dim);font-size:12.5px}
.plist-r b{font-variant-numeric:tabular-nums;color:var(--sub);font-weight:600;white-space:nowrap}
.plist-r.miss span{color:var(--dim)}
.plist-r.miss b{color:var(--warning);font-weight:600;font-size:12px}
.btn.plog{margin-bottom:8px}
/* Import: a box to paste into, a file button beside the read button, then the meals it
   found as cards. */
.pitext{display:block;width:100%;min-height:200px;padding:14px;border-radius:var(--r3);resize:vertical;
  background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit;font-size:15px;line-height:1.5}
.pitext:focus{outline:none;border-color:var(--accent)}
.piacts{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin:12px 0 4px}
.piacts .btn{margin:0}
.pifile{position:relative;cursor:pointer}
.pifile input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
/* Reading a PDF, and the targets it sets (js/engine/pdfplan.js). */
.pibusy{display:flex;align-items:center;gap:10px;margin:var(--s4) 2px 0;font-size:14px;color:var(--sub)}
.pispin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);
  animation:pispin .8s linear infinite}
@keyframes pispin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pispin{animation-duration:2.4s}}
.pitg{margin:0 0 var(--s4);padding:6px 14px 0;border-radius:var(--r3);background:var(--raised);border:1px solid var(--border)}
.pitg-r{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:12px;padding:9px 0;font-size:14px}
.pitg-r+.pitg-r{border-top:1px solid var(--border)}
.pitg-r b{font-weight:700;font-variant-numeric:tabular-nums}
.pitg-r i{grid-column:1/-1;font-style:normal;font-size:12px;color:var(--dim)}
.pitg-r i:empty{display:none}
.pitg-use{display:flex;align-items:center;justify-content:space-between;gap:12px;width:calc(100% + 28px);margin:6px -14px 0;
  min-height:56px;padding:0 14px;border:none;border-top:1px solid var(--border);background:none;color:var(--text);
  font:inherit;font-weight:700;font-size:14.5px;text-align:start;cursor:pointer}
.tgl{position:relative;flex:0 0 48px;width:48px;height:28px;border-radius:14px;background:var(--border);
  transition:background var(--m-micro) var(--e-standard)}
.tgl i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:11px;background:#fff;
  transition:transform var(--m-micro) var(--e-standard)}
.tgl.on{background:var(--accent)}
/* The knob on the accent takes the ink made for it: white on a pale accent (Sage's
   sage-white in dark) barely shows. */
.tgl.on i{background:var(--onAccent)}
.tgl.on i{transform:translateX(20px)}
[dir="rtl"] .tgl.on i{transform:translateX(-20px)}
/* ---- Importing a training program (js/ui/views/timport.js) ------------------------
   The draft before it is a program: a summary, the name, the week, a card per day with
   a row per exercise, and the coach's notes folded away. A row is a button that opens
   its editor; what wants a look says so in the warning colour. */
.tisum{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:0 0 var(--s4);font-size:14px;color:var(--sub)}
.tisum b{color:var(--text);font-size:15px}
.tiwarn{color:var(--warning);font-style:normal;font-weight:600}
.tilbl{display:block;margin:0 2px 6px;font-size:12px;font-weight:600;color:var(--dim)}
.tiin,.tiday{width:100%;min-height:46px;padding:10px 14px;border-radius:var(--r2);border:1px solid var(--border);
  background:var(--raised);color:var(--text);font:inherit;font-size:16px}
.tiin:focus,.tiday:focus{outline:none;border-color:var(--accent)}
.ticard{margin:0 0 var(--s4);padding:12px 14px;border-radius:var(--r3);background:var(--surface);border:1px solid var(--border)}
.ticard-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ticard-h .tiday{flex:1;min-width:0;font-weight:700;background:transparent;border-color:transparent;padding-inline:4px}
.ticard-h .tiday:focus{border-color:var(--accent);background:var(--raised)}
.ticard-x{flex:none;width:44px;height:44px;border:0;border-radius:22px;background:none;color:var(--dim);font-size:16px}
.tifocus{margin:0 4px 8px;font-size:12.5px;color:var(--dim)}
.tirow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border:0;border-top:1px solid var(--border);
  background:none;color:var(--text);font:inherit;text-align:start}
.tirow .thumbwrap,.tirow .thumb{flex:none;border-radius:10px}
.tirow-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tirow-t b{font-size:15px;font-weight:600;line-height:1.3}
.tirow-raw{font-size:12px;color:var(--dim)}
.tirow-s{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.tirow-n{font-size:12.5px;color:var(--dim);line-height:1.4}
.tirow-c{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.tirow-c:empty{display:none}
.tirow-c i{font-style:normal;color:var(--accentHi)}
.tirow-c i.tiwarn{color:var(--warning)}
.tirow .ico-chev{flex:none;color:var(--dim)}
.ticard .dadd{margin-top:6px;min-height:48px}
.tiwk{padding-block:4px}
.tiwk-r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-size:15px}
.tiwk-r+.tiwk-r{border-top:1px solid var(--border)}
.tiwk-r select{max-width:60%;min-height:40px;padding:6px 10px;border-radius:var(--r1);border:1px solid var(--border);
  background:var(--raised);color:var(--text);font:inherit;font-size:14px}
.tiact{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.tiact+.tiact{border-top:1px solid var(--border)}
.tiact span{display:flex;flex-direction:column;gap:2px}
.tiact i{font-style:normal;font-size:12.5px;color:var(--dim)}
.tinotes{margin:0 0 var(--s4);padding:12px 14px;border-radius:var(--r3);background:var(--raised);border:1px solid var(--border)}
.ticard .tinotes{margin:8px 0 0;padding:10px 12px}
.tinotes summary{cursor:pointer;font-weight:600;font-size:14px;min-height:28px;display:flex;align-items:center;gap:8px}
.tinotes summary .num{color:var(--dim);font-weight:500}
.tinotes h3{margin:14px 0 4px;font-size:13px;font-weight:700;color:var(--sub)}
.tinotes p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--sub)}
.tinotes .bnote{margin-top:12px;text-align:start}
/* Its editor sheet. */
.tiswap{width:auto;margin:10px 0 4px}
.tigrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.tif{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--dim)}
.tif input{min-height:46px;padding:8px 12px;border-radius:var(--r2);border:1px solid var(--border);background:var(--raised);
  color:var(--text);font:inherit;font-size:16px;font-variant-numeric:tabular-nums}
.tif input:focus,.tinote:focus{outline:none;border-color:var(--accent)}
.titgls{margin:12px 0 0;border-radius:var(--r2);border:1px solid var(--border);background:var(--raised);padding:0 12px}
.tit{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:0;border:0;
  background:none;color:var(--text);font:inherit;font-size:15px;text-align:start}
.tit+.tit{border-top:1px solid var(--border)}
.tinote{width:100%;padding:10px 12px;border-radius:var(--r2);border:1px solid var(--border);background:var(--raised);
  color:var(--text);font:inherit;font-size:15px;line-height:1.45;resize:vertical}
.tiacts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.tiacts .btn{margin:0}
/* An imported exercise's cue under its name, its alternative, and the day's notes. */
.ex-cue{margin:10px 0 0;font-size:13.5px;line-height:1.45;color:var(--sub)}
.exalt{display:inline-block;margin-top:10px;font-size:13.5px;min-height:32px}
.daynotes{margin:0 0 12px;padding:10px 14px;border-radius:var(--r3);background:var(--raised);border:1px solid var(--border)}
.daynotes summary{cursor:pointer;font-weight:600;font-size:14px;min-height:28px;display:flex;align-items:center}
.daynotes p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--sub)}
/* The plan check (js/ui/views/pcheck.js): a finding says what, why, and one fix. */
.pcf{margin:0 0 12px;padding:14px 14px 12px;border-radius:var(--r5);border:1px solid var(--border);background:var(--raised);
  box-shadow:inset 3px 0 0 var(--dim)}
[dir="rtl"] .pcf{box-shadow:inset -3px 0 0 var(--dim)}
.pcf.sev3{box-shadow:inset 3px 0 0 var(--accent)}
.pcf.sev2{box-shadow:inset 3px 0 0 var(--warning)}
[dir="rtl"] .pcf.sev3{box-shadow:inset -3px 0 0 var(--accent)}
[dir="rtl"] .pcf.sev2{box-shadow:inset -3px 0 0 var(--warning)}
.pcf-k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pcf h3{margin:0 0 6px;font-size:16px;line-height:1.3}
.pcf p{margin:0;font-size:13.5px;line-height:1.5;color:var(--sub)}
.pcf-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pcf-acts .btn{width:auto;margin:0}
.pchome .pcf{margin-bottom:4px}
.linkbtn.pcmore{display:block;margin:2px 4px 12px;font-size:13.5px}
.pcrow{display:flex;align-items:center;gap:10px;width:100%;margin:14px 0 0;padding:12px 14px;border-radius:var(--r3);
  border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;text-align:start}
.pcrow span:nth-child(2){flex:1}
.pcrow-d{flex:none;width:8px;height:8px;border-radius:4px;background:var(--ok)}
.pcrow.has .pcrow-d{background:var(--warning)}
.pcrow .ico-chev{color:var(--dim)}
/* Nothing to say: one quiet line, not a card. */
.pcquiet{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;font-size:14px;line-height:1.45;color:var(--sub)}
.pcquiet .ico{flex:none;width:16px;height:16px;color:var(--ok)}
.pcagain{display:block;margin:0 2px 16px;padding:0}
/* The rest of the advice, one tap away. */
.btn.pcmore{margin:2px 0 14px}
/* The assessment (js/ui/views/assess.js): one question a screen, then the plan. */
.as-prog{height:4px;border-radius:2px;background:var(--bar-track);overflow:hidden;margin:6px 0 6px}
.as-prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width var(--m-base,240ms) var(--e-standard)}
.as-count{margin:0 0 14px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.as-hero{padding:6px 2px 4px}
.as-hero h1{font-family:var(--display);font-size:clamp(24px,7vw,30px);line-height:1.12;margin:4px 0 8px}
.as-q{font-family:var(--display);font-size:21px;line-height:1.2;margin:4px 0 6px}
.as-sub{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--sub)}
.as-l{margin:16px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.as-note{margin:12px 2px 0;font-size:12.5px;line-height:1.5;color:var(--dim)}
.aschips{display:flex;flex-wrap:wrap;gap:8px}
.aschip{min-height:42px;padding:0 16px;border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:14px;font-weight:600;transition:transform var(--m-press) var(--e-standard)}
.aschip.on{background:rgba(var(--accent-rgb),.16);border-color:var(--accent-edge);color:var(--text)}
:root:not(.tch) .aschip:active,.aschip.tapd{transform:scale(.96)}
.ascards{display:flex;flex-direction:column;gap:8px}
.ascard{display:flex;flex-direction:column;gap:3px;width:100%;padding:13px 14px;border-radius:var(--r3);border:1px solid var(--border);
  background:var(--surface);color:var(--text);text-align:start;transition:transform var(--m-press) var(--e-standard)}
.ascard b{font-size:15.5px;font-weight:700}
.ascard span{font-size:13px;line-height:1.4;color:var(--sub)}
.ascard.on{background:rgba(var(--accent-rgb),.12);border-color:var(--accent-edge);box-shadow:inset 3px 0 0 var(--accent)}
[dir="rtl"] .ascard.on{box-shadow:inset -3px 0 0 var(--accent)}
:root:not(.tch) .ascard:active,.ascard.tapd{transform:scale(.985)}
.as-in{margin-top:14px}
.as-in label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim)}
.as-in input{width:100%;min-width:0;font-size:17px;font-weight:600;text-align:center}
.as-nav{display:flex;gap:10px;margin-top:22px}
.as-nav .btn{flex:1;width:auto;min-width:0;margin:0}
.as-nav .btn.g{flex:0 0 auto;min-width:96px}
.as-done{margin:6px 0 12px;padding:12px 14px;border-radius:var(--r3);background:var(--okSoft);border:1px solid var(--ok);font-size:14px;line-height:1.45}
.ascard2{margin:0 0 var(--s4);padding:14px 14px 12px;border-radius:var(--r5);border:1px solid var(--border);box-shadow:var(--shadow-card);
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--raised)}
.ascard2 h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.as-kcal{display:flex;align-items:baseline;gap:6px}
.as-kcal b{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.as-kcal span{color:var(--sub);font-weight:600}
.as-why{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--sub)}
.as-macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:12px}
.as-macros div{padding:9px 10px;border-radius:var(--r3);background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.as-macros b{font-size:16px;font-variant-numeric:tabular-nums}
.as-macros span{font-size:11.5px;color:var(--dim)}
.as-split{display:flex;flex-direction:column;gap:4px}
.as-split b{font-size:18px}
.as-split span{font-size:13px;line-height:1.45;color:var(--sub)}
.as-alt{margin-top:10px}
.as-alt .aschip{min-height:36px;font-size:13px;padding:0 12px}
.as-days{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--hair)}
.as-days div{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--hair);font-size:14px}
.as-days span{color:var(--dim);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.as-vol{display:flex;flex-direction:column;gap:7px}
.as-vr{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.as-vr i{position:relative;height:8px;border-radius:4px;background:var(--bar-track);overflow:hidden}
.as-vr em{position:absolute;top:0;bottom:0;background:rgba(var(--accent-rgb),.18)}
.as-vr i b{position:absolute;inset-inline-start:0;top:2px;bottom:2px;border-radius:2px;background:var(--ok)}
.as-vr.low i b,.as-vr.high i b{background:var(--warning)}
.as-vr .num{text-align:end;font-variant-numeric:tabular-nums;color:var(--sub)}
.as-swaps{margin:0;padding-inline-start:18px;font-size:13px;line-height:1.6;color:var(--sub)}
.as-swaps b{color:var(--text);font-weight:600}
.pgen-acts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.pgen-acts .btn{width:auto;margin:0;padding:0 16px;min-height:40px}
.pgen-tg{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
/* The warm-up step before the first exercise, and the cool-down card on the
   Workout complete sheet (js/ui/views/warmup.js). */
.wu{position:relative;isolation:isolate;overflow:hidden;margin:4px 0 var(--s4);padding:18px 14px 14px;border-radius:var(--r5);
  border:1px solid var(--border);box-shadow:var(--shadow-card);
  background:radial-gradient(90% 60% at 100% 0%,rgba(var(--glow-rgb),.16),transparent 60%),
    linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--raised)}
.wu-head{padding:0 2px 6px}
.wu-head h1{font-family:var(--display);font-size:clamp(22px,6.6vw,27px);line-height:1.12;margin:2px 0 4px}
.wu-head .sub{margin:0;font-size:13.5px;color:var(--sub)}
.wu-step{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.wu-sh{display:flex;align-items:center;gap:10px;margin:0 2px 6px;font-weight:700;font-size:15px}
.wu-sh b{flex:none;width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;background:var(--accent-tint);color:var(--accentHi);border:1px solid var(--accent-edge)}
.wu-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.wu-row+.wu-row{border-top:1px solid var(--hair)}
.wu-tick{flex:none;width:32px;height:32px;border-radius:16px;padding:0;border:1px solid var(--border);background:transparent;
  color:transparent;display:flex;align-items:center;justify-content:center;transition:transform var(--m-press) var(--e-standard)}
.wu-tick svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.wu-row.did .wu-tick{background:var(--ok);border-color:var(--ok);color:#fff}
:root:not(.tch) .wu-tick:active,.wu-tick.tapd{transform:scale(.88)}
.wu-ex{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:2px 0;border:0;background:transparent;color:inherit;text-align:start}
.wu-ex .thumbwrap,.wu-ex .thumb{flex:none;border-radius:10px}
.wu-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.wu-n{font-size:14.5px;font-weight:600;line-height:1.3}
.wu-d{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.wu-row.did .wu-n{color:var(--sub)}
:root:not(.tch) .wu-ex:active .wu-n,.wu-ex.tapd .wu-n{color:var(--accentHi)}
.wu-txt{flex:1;margin:0;font-size:13.5px;line-height:1.45;color:var(--sub)}
/* The hold timer fills from the start edge as it counts. */
.wu-hold{--p:0;flex:none;position:relative;overflow:hidden;isolation:isolate;min-width:76px;height:34px;padding:0 10px;
  border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  transition:transform var(--m-press) var(--e-standard)}
.wu-hold svg{width:13px;height:13px;fill:currentColor}
.wu-hold::before{content:"";position:absolute;z-index:-1;inset:0;background:var(--accent-tint);transform-origin:0 50%;transform:scaleX(var(--p))}
[dir="rtl"] .wu-hold::before{transform-origin:100% 50%}
.wu-hold.run{border-color:var(--accent-edge);color:var(--accentHi)}
.wu-hold.run svg{display:none}
:root:not(.tch) .wu-hold:active,.wu-hold.tapd{transform:scale(.94)}
.wu-ramp{display:flex;flex-wrap:wrap;gap:6px;margin:4px 2px 2px}
.wu-rs{padding:6px 10px;border-radius:var(--rpill);background:var(--surface);border:1px solid var(--border);font-size:13px;
  color:var(--sub);font-variant-numeric:tabular-nums}
.wu-rs b{color:var(--text);font-weight:700}
.wu-rs.work{background:var(--accent-tint);border-color:var(--accent-edge)}
.wu-note{margin:6px 2px 0;font-size:12.5px;line-height:1.45;color:var(--dim)}
.wu-why{margin:16px 2px 14px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;line-height:1.5;color:var(--dim)}
/* The warm-up as cards (js/ui/views/warmup.js vWarm): a header with its progress, one
   card per step, Start pinned at the bottom. */
.wu.wu2{overflow:visible;padding:0;margin:var(--s1) 0 0;border:0;background:none;box-shadow:none}
.wu.wu2::before,.wu.wu2::after{display:none}
.wu2 .wu-head{padding:var(--s1) var(--s1) var(--s3)}
.wu2 .wu-head .shk{color:var(--dim)}
.wu-prog{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);font-size:13px;font-weight:700;color:var(--sub)}
.wu-prog i{flex:1;height:6px;border-radius:var(--rpill);background:var(--bar-track);overflow:hidden}
.wu-prog b{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width var(--m-data) var(--e-standard)}
.wu2 .wu-card{margin:0 0 var(--s3);padding:var(--s3) var(--s3) var(--s2);border:1px solid var(--card-edge);border-radius:var(--r4);
  background:var(--card);box-shadow:inset 0 1px 0 var(--hair-hi)}
.wu2 .wu-card .wu-sh{margin:0 0 var(--s2)}
.wu2 .wu-row{padding:var(--s2) 0;min-height:52px}
.wu2 .wu-n{font-size:15.5px}
.wu2 .wu-d{font-size:13px}
.wu2 .wu-ramp{margin:0 0 var(--s2)}
.wu2 details.wu-why{margin:var(--s1) 0 0;padding:0;border:0}
.wu2 .wu-why summary{display:inline-flex;align-items:center;min-height:var(--hit);list-style:none;color:var(--accentHi);font-weight:700;font-size:14px;cursor:pointer}
.wu2 .wu-why summary::-webkit-details-marker{display:none}
.wu2 .wu-why p{margin:0 0 var(--s2);font-size:13.5px;line-height:1.5;color:var(--sub)}
.wu-foot{position:sticky;bottom:0;z-index:5;margin:var(--s2) calc(var(--s4) * -1) 0;padding:var(--s3) var(--s4) max(var(--s3),env(safe-area-inset-bottom));
  background:var(--wk-page,var(--bg))}
.wu-foot::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:var(--s5);pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--wk-page,var(--bg)))}
.wu-foot .wu-then{margin:0 0 var(--s2)}
.wu-acts{display:flex;gap:var(--s2)}
.wu-acts .wu-go{flex:1;margin:0}
.wu-acts .wu-skip{flex:none;width:auto;margin:0;padding:0 var(--s4)}

.wu-skip{margin-top:8px}
.cd{margin-top:14px;padding:12px 12px 6px;border-radius:var(--r3);background:var(--surface);border:1px solid var(--border);text-align:start}
.cd-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.cd-m{letter-spacing:0;text-transform:none;font-weight:600}
.cd-sub{margin:4px 0 4px;font-size:12.5px;line-height:1.45;color:var(--sub)}
.cd .wu-hold{background:var(--raised)}
.drow-note{display:block;margin-top:3px;font-size:12px;line-height:1.4;color:var(--dim)}
.drow-wk{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--accentHi)}
.bmeta{margin:6px 2px 12px;font-size:13px;color:var(--dim)}
.bnotes{margin-top:var(--s4)}
.plist-note{display:block;margin-top:2px;font-size:12px;color:var(--dim)}
.picard{margin:0 0 10px;padding:12px 14px 6px;border-radius:var(--r3);background:var(--raised);border:1px solid var(--border)}
.picard-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.picard-h b{font-family:var(--display);font-size:16px}
.picard-h span{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
/* Editing the draft: the meal's name is a field, each food a button (its amount) with
   an ✕, each unmatched line a Find. */
.picard-h.ticard-h{align-items:center;gap:6px}
.picard-h .tiday{font-family:var(--display);font-size:16px}
.picard-k{flex:none;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.pied{align-items:center;gap:6px;padding:0}
.pied>span{flex:1;min-width:0;padding:8px 0}
.pied-b{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-height:44px;
  padding:8px 0;border:0;background:none;color:var(--text);font:inherit;font-size:14px;text-align:start}
.pied-b:disabled{opacity:1}
.pied-b i{font-style:normal;color:var(--dim);font-size:12.5px}
.pied-b b{font-variant-numeric:tabular-nums;color:var(--sub);font-weight:600;white-space:nowrap}
.pied-x{flex:none;width:40px;height:40px;border:0;border-radius:20px;background:none;color:var(--dim);font-size:14px}
.pied .ptodo-b{flex:none;width:auto;margin:0}
.picard .piadd{min-height:44px;margin:6px 0 8px}
.pitg-v{display:flex;align-items:baseline;gap:6px}
.pitg-v input{width:90px;min-height:38px;padding:4px 10px;border-radius:var(--r1);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:700;text-align:end;font-variant-numeric:tabular-nums}
.pitg-v input:focus{outline:none;border-color:var(--accent)}
.pitg-v em{font-style:normal;font-size:12.5px;color:var(--dim);min-width:22px}
.picard .plist-r{font-size:13.5px;padding:7px 0}
/* A line an import could not match, waiting with Find. */
.drow.ptodo{align-items:center}
.drow.ptodo .drow-n{white-space:normal;color:var(--sub);font-weight:600}
.btn.ptodo-b{width:auto;margin:0 12px 0 0;padding:0 16px;min-height:36px;flex:0 0 auto}
[dir="rtl"] .btn.ptodo-b{margin:0 0 0 12px}
/* A meal of the user's own wears its place in the day where the named four have a glyph. */
.fmt-no{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  font-family:var(--display);font-weight:800;font-size:13px;color:var(--sub);
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
/* A meal with a plan and nothing logged: a small ring where the tick will go. */
.fmt-plan{position:absolute;top:8px;inset-inline-end:8px;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--dim)}
.fmt-ok{position:absolute;top:6px;inset-inline-end:6px;width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--ok);color:#fff}
.fmt-ok svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn.fadd{margin:8px 0 var(--s5);border-radius:var(--rpill);background:linear-gradient(180deg,var(--accent),var(--accent-deep));
  box-shadow:0 12px 28px -12px var(--accent-glow);text-transform:none;font-size:16px;letter-spacing:0}
.btn.fadd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---- meal detail */
.mealbanner{background:var(--surface);padding:20px var(--gutter);
  margin-inline:calc(-1 * var(--gutter));margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.mealbanner-k{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.mealbanner-v{font-family:var(--display);font-weight:800;font-size:36px;color:var(--figure);
  margin-top:4px;font-variant-numeric:tabular-nums;line-height:1}
.mealbanner-m{display:flex;gap:12px;font-size:13px;color:var(--dim);flex-shrink:0;
  font-variant-numeric:tabular-nums}

.fitemrow{display:flex;align-items:stretch;background:var(--surface);
  border-radius:12px;overflow:hidden;margin-bottom:12px}
.fitemrow-b{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;
  gap:12px;background:none;border:none;color:var(--text);text-align:start;padding:16px}
.fitemrow-n{font-weight:700;font-size:15px}
.fitemrow-m{font-size:12px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.fitemrow-k{font-weight:700;font-size:15px;flex-shrink:0;font-variant-numeric:tabular-nums}
/* The frame shows this revealed by a swipe. It is a permanent button instead: the app
   has no list-swipe anywhere else, and a delete that has to be discovered by dragging
   is a delete some users never find. Quiet until pressed: a column of red blocks made
   a meal read as a list of warnings. */
.fitemrow-x{flex:0 0 48px;background:none;border:none;border-inline-start:1px solid var(--hair);color:var(--faint);
  display:flex;align-items:center;justify-content:center}
:root:not(.tch) .fitemrow-x:active,.fitemrow-x.tapd{background:var(--danger);color:#fff}
.fitemrow-x .ico-trash{width:20px;height:20px;flex-basis:20px}

/* ================= Rest — canvas screen 5, set completion (node 2:1149)
   The rest surface already existed; this is the frame applied to it. What the frame
   adds is the confirmation banner, the smaller ring, and controls that are icons
   rather than words. What it leaves out — the total beside the digits, the superset
   label, the RPE target — is kept, because each is a figure the frame had no data
   for and the screen is the only place it appears. */
.ico-check{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='18' height='18' viewBox='0 0 18 18' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M14.9994 4.5L6.75023 12.7494L3.0006 8.99967' stroke='%2310B981' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}
.ico-pause{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cg%3E%3Cpath d='M18.0007 3H15.0003C14.448 3 14.0002 3.44772 14.0002 4V20C14.0002 20.5523 14.448 21 15.0003 21H18.0007C18.553 21 19.0008 20.5523 19.0008 20V4C19.0008 3.44772 18.553 3 18.0007 3Z' stroke='%23F3F4F6' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M8.99966 3H5.99931C5.44697 3 4.9992 3.44772 4.9992 4V20C4.9992 20.5523 5.44697 21 5.99931 21H8.99966C9.552 21 9.99977 20.5523 9.99977 20V4C9.99977 3.44772 9.552 3 8.99966 3Z' stroke='%23F3F4F6' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}

/* "SET 2 COMPLETE" — the receipt for the set just logged, which the surface never
   gave before. It sits at the top edge, out of the timer's way. */
.restbanner{position:absolute;top:0;left:0;right:0;height:44px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--okSoft);color:var(--ok);
  font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.04em}
.restbanner{text-transform:uppercase}
.restbanner .ico-check{width:18px;height:18px;flex-basis:18px}
/* The banner and the footer are pinned to the edges, so the centred column reserves
   their height rather than sliding under them on a short screen. */
.restwrap:not(.done){padding-top:68px;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-y:auto;
  /* The frame packs the scaffold under the banner and pins the footer, rather than
     centring the column — centred, the reserved footer space pushed everything high
     and left a gap under the banner. */
  justify-content:flex-start}
.restwrap.done .restbanner{display:none}

.restwrap:not(.done) .restlabel{color:var(--dim);letter-spacing:.14em;font-size:12px}
.restwrap:not(.done) .restsub{color:var(--text);font-size:16px;font-weight:700;
  font-family:var(--display)}

/* 170px ring inside a 180px box, as the frame draws it. */
.ringwrap{position:relative;width:180px;height:180px;margin:32px 0}
.ringwrap svg{width:180px;height:180px;transform:rotate(-90deg);display:block}
.restdig{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1;
  font-family:var(--display);font-variant-numeric:tabular-nums}
.resttot{font-size:11px;color:var(--dim);margin-top:2px;text-transform:uppercase;
  letter-spacing:.06em;font-variant-numeric:tabular-nums}

.restctl{display:flex;align-items:center;gap:16px;margin-top:0}
/* "−30s" begins with a neutral character, which an RTL paragraph reorders to "30s−".
   The pills keep their own direction; their positions still mirror with the row. */
.restctl .rbtn:not(.main){direction:ltr}
/* The ±30s pills of the frame: shorter and lighter than the button they replace. */
.restwrap:not(.done) .rbtn{height:44px;min-width:66px;padding:0 16px;border-radius:22px;
  font-size:14px}
/* Scoped away from .done, whose one button is a wide "I am ready" pill and would
   otherwise be turned into a 60px circle by this rule. */
.restwrap:not(.done) .rbtn.main{width:60px;min-width:60px;height:60px;border-radius:30px;
  padding:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 26px rgba(var(--glow-rgb),.34)}
.restwrap:not(.done) .rbtn.main .ico{width:24px;height:24px;flex-basis:24px}

.upnext{margin-top:32px;border-radius:8px;padding:16px}
.upnext .ul{font-size:11px;letter-spacing:.06em;color:var(--dim);font-weight:400}
.upnext .uv{font-size:16px;font-weight:700;font-family:var(--display)}

/* The frame seats the skip link in its own bordered footer at the foot of the screen
   rather than floating it under the card. */
.restfoot{position:absolute;left:0;right:0;bottom:0;padding:24px 24px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);display:flex;justify-content:center}
.restwrap.done .restfoot{display:none}
.restskip{margin-top:0;color:var(--accentHi);font-size:14px;font-weight:700;
  text-decoration:underline;min-height:44px}

/* ================= Exercise detail — canvas screen 6 (node 2:1182)
   The frame is drawn as a full screen with a back arrow and a pinned footer. It stays
   a sheet here: it opens from the ⓘ mid-workout and from the picker, and a route would
   have to unmount the logger to show it. The sheet head's ✕ and ★ are the frame's back
   and star, in the one place a long exercise name cannot shove them around. */
.ico-cdown{--ico:url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' overflow='visible' width='16' height='16' viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='M4 6L8 10L12 6' stroke='%238E8E93' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E")}

.exd-sub{font-size:13px;color:var(--dim);margin:4px 0 16px}

/* Primary / Secondary / Equipment as labelled chips. This replaces both the old pill
   row and the two Primary/Secondary rows under the photographs, which carried exactly
   the same three facts a second time. */
.exd-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.exd-chip{background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:6px 10px;font-size:12px;color:var(--dim)}
.exd-chip b{font-weight:700;color:var(--text)}

/* The frame's two 130px panels. It draws a bar-and-arm diagram inside each; the app
   has the library's own photograph of that position, which is what the diagram stands
   in for, so the photograph fills the panel and the label sits under it. */
.exd-form{display:flex;gap:12px;margin-bottom:20px}
.exd-form figure{flex:1;min-width:0;margin:0;height:130px;background:var(--raised);
  border:1px solid var(--border);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column}
.exd-form img{flex:1;min-height:0;width:100%;object-fit:cover;display:block;background:#fff}
.exd-form figcaption{flex:0 0 auto;font-size:11px;color:var(--text);text-align:center;
  padding:8px 6px;letter-spacing:.06em}

.exd-h{font-family:var(--display);font-weight:800;font-size:16px;margin:0 0 12px}
.exd-steps{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.exd-step{display:flex;gap:12px;align-items:flex-start}
/* 24px ringed numeral, accent-soft fill inside an accent border. */
.exd-num{flex:0 0 24px;width:24px;height:24px;border-radius:12px;
  background:var(--accentSoft);border:1px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:12px;color:var(--text)}
.exd-step p{flex:1;min-width:0;margin:0;font-size:13px;line-height:18px}

/* One row for tips and mistakes together, ruled above and below as the frame has it,
   in place of the grey button that used to toggle them. */
.exd-tips{display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;background:none;border:0;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);border-radius:0;
  margin:24px calc(-1 * var(--s4)) 0;padding:20px var(--s4);
  color:var(--text);text-align:start}
.exd-tips-l{display:flex;align-items:center;gap:8px;
  font-family:var(--display);font-weight:800;font-size:14px}
.exd-tips-l i{font-style:normal;color:var(--gold);font-weight:400}
.exd-tips .ico-cdown{color:var(--dim);transition:transform var(--m-micro) var(--e-standard)}
.exd-tips[aria-expanded="true"] .ico-cdown{transform:rotate(180deg)}
:root.reduced .exd-tips .ico-cdown{transition:none}
.exd-miss{padding-top:16px}
.exd-miss div{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:13px}
.exd-miss b{color:var(--accentHi);font-weight:700;flex:0 0 auto}

/* The frame pins ADD TO WORKOUT to the foot of the screen. Inside a sheet it sits at
   the end of the content, and it appears only when there is a day open to add to —
   the same sheet opens mid-set from the logger, where adding is not what it means. */
.exd-add{margin-top:24px}

/* ================= Exercise replacement — canvas screen 7 (node 2:1244)
   The frame is the picker in replace mode, so this is the picker sheet with the
   frame's three additions: the row naming what is being replaced, a second filter
   row for equipment, and a Swap affordance on each result. */

/* What you are replacing, stated before the list of what you could replace it with.
   The picker never said, so "Replace exercise" was the only clue on screen. */
.exswapfrom{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:16px}
.exswapfrom-k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.exswapfrom-n{font-family:var(--display);font-weight:700;font-size:15px;margin-top:2px}
.exswapfrom-b{flex-shrink:0;background:var(--accentSoft);color:var(--text);
  border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.06em}

/* Two rows, not the frame's one. It draws the muscle pill and two equipment pills
   side by side; they filter different things, and mixed into a single unlabelled row
   there is nothing to say why turning one off widens the list and the other narrows
   it. Same pills, same scroll, one row each. */

/* The frame gives every result an explicit Swap button. A button inside the row
   button is not valid, and two targets stacked on one row is worse to hit than one,
   so this is a label styled as the frame's button — the whole row remains the tap. */
.exswap{flex-shrink:0;background:var(--raised);border:1px solid var(--border);
  border-radius:4px;padding:6px 12px;
  font-family:var(--display);font-weight:700;font-size:12px;color:var(--accentHi)}
:root:not(.tch) .item:active .exswap,.item.tapd .exswap{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}

/* ================= Workout complete — canvas screen 8 (node 2:1311)
   Measured off the 2× frame export, so every figure here is half what that file
   shows. It stays a sheet, like screens 6 and 7: finishSession() opens it, and a
   route would have to unmount the logger underneath to show it. */
.ico-award{--ico:url("data:image/svg+xml,%3C!-- lucide-static v1.48.0 'award' — ISC licence. The frame's medal glyph; the rest of this folder is the same Lucide set, exported from Figma. Used as a CSS mask, so the stroke colour here is irrelevant — only its alpha coverage is. --%3E%3Csvg preserveAspectRatio='none' overflow='visible' width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg%3E%3Cpath d='m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526' stroke='%23F3F4F6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='12' cy='8' r='6' stroke='%23F3F4F6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E")}

/* The medal. The green tick this replaces was the pre-Figma design's; the frame
   rings it in accent over accent-soft{text-align:center;margin-bottom:20px}





/* Four tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}





/* The record. Gold{display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1.5px solid var(--gold);border-radius:8px;

/* The frame pins these under a rule at the foot of the screen. */
.wc-foot{border-top:1px solid var(--border);
  margin:0 calc(-1 * var(--s4));padding:20px var(--s4) 0}



/* ================= Exercise library — canvas screen 9 (node 2:1360)
   Measured off the 2× PNG export at 804×1748 and halved; the Figma connector was
   still capped. Same caveat as screen 8: spacing is read to a couple of pixels
   rather than taken literally. */

/* Title, subtitle and the favourites star, which is where the frame puts it. The
   shared head() renders a BUNYAN watermark in that corner instead, so this screen
   has its own header rather than a watermark with a star stacked on it. */
.libhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin-bottom:16px}
.libhead h1{margin:0}
.libhead .sub{margin:5px 0 0;color:var(--dim);font-size:14px}

/* The frame's search field: the icon lives inside it, in accent. The bare input this
   replaces gave no hint of what could be searched. */
.libq{position:relative;margin-bottom:12px}
.libq .ico-search{position:absolute;inset-inline-start:14px;top:50%;margin-top:-8px;
  color:var(--accent);pointer-events:none}
.libq input{width:100%;height:48px;border-radius:12px;padding-inline:40px 14px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:15px}
.libq input::placeholder{color:var(--dim)}

.libfilters{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
/* The frame's selected pill is outlined in accent, not filled — filled is what this
   app's .pill.a does, and the two together would have read as two different states.
   Scoped here so the filled pill everywhere else is untouched. */
.libfilters .pill{flex-shrink:0;border:1px solid var(--border);min-height:44px;
  padding:0 16px;display:flex;align-items:center;border-radius:22px;
  /* The base pill is an 11px uppercase tag. These are filter controls meant to be
     read, which is how the frame draws them — sentence case, legible size. */
  font-size:13px;font-weight:600;letter-spacing:0;text-transform:none}
.libfilters .pill.a{background:transparent;border-color:var(--accent);color:var(--accentHi)}

/* "Chest Exercises (4)" — the filter and the count, which the tiny "N of M shown"
   line it replaces said less clearly and in the wrong place. */
.libcount{font-family:var(--display);font-weight:800;font-size:20px;margin:16px 0 12px}

.librow{display:flex;align-items:center;gap:16px;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px;margin-bottom:10px;color:var(--text)}
.librow .thumbwrap,.librow .thumb,.librow .thumb.ph{border-radius:8px;flex-shrink:0}
/* Spans, so they need telling they are blocks — inline they ran the name and the
   detail together on one line and collapsed the row onto the thumbnail. */
.librow-t{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.librow-n{display:block;font-family:var(--display);font-weight:700;font-size:17px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.librow-s{display:block;font-size:13px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The equipment is the one part of that line the frame colours — it is what decides
   whether you can do the exercise at all. */
.librow-s b{font-weight:400;color:var(--sub)}
.librow .ico-chev{color:var(--dim);flex-shrink:0}
[dir="rtl"] .librow .ico-chev{transform:scaleX(-1)}

/* ================= Profile and its settings (js/ui/views/profile.js, js/ui/settings.js)
   One grammar, as a phone's own settings have: groups of rows on a card, a small
   heading over each, a footnote under it where one is needed. A row's trailing part
   says what it is: a switch flips, a segmented control shows every choice, a tick
   marks the chosen one in a longer list, a chevron goes somewhere. Glyph tiles carry
   the theme's highlight colour, not the accent; the accent is the switch that is on,
   the chosen segment, and the main button. */
.sg{margin:22px 0 0}
.sg-h{margin:0 0 8px;padding-inline-start:4px;font-family:inherit;font-size:11.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
[dir="rtl"] .sg-h{letter-spacing:0;font-size:12.5px}
.sg-list{border-radius:var(--r4);border:1px solid var(--border);background:var(--raised);overflow:hidden}
/* On the page (not in a sheet) the rows are glass: the card's translucent fill under a

   work on each scrolled frame. Blur is kept for what floats over content. */
#app .sg-list{box-shadow:inset 0 1px 0 var(--hair-hi),0 10px 30px -18px rgba(0,0,0,.45)}
#app .sg-list .srow{border-bottom-color:var(--card-edge)}
#app .srow .gtile{border-radius:50%;color:var(--accentHi);
  background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.16),transparent 55%),rgba(var(--accent-rgb),.14);
  box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.28),inset 0 1px 0 rgba(255,255,255,.18)}

#app button.srow:not(.srow-pick):active,#app button.srow.tapd{background:rgba(var(--accent-rgb),.08)}
.sg-f{margin:8px 4px 0;font-size:12.5px;line-height:1.55;color:var(--dim)}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:0;padding:10px 14px;border:0;

  transition:background var(--m-micro) var(--e-standard)}
.srow:last-child{border-bottom:0}
button.srow:not(.srow-pick):active,button.srow.tapd{background:var(--surface)}
.srow-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srow-n{font-size:15px;font-weight:600;line-height:1.3}
.srow-s{font-size:12.5px;line-height:1.4;color:var(--dim)}
.srow-v{flex:none;max-width:45%;font-size:14px;color:var(--dim);text-align:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .ico-chev{flex:none;color:var(--dim)}
.srow .tgl{flex:none}
.srow .gtile{width:34px;height:34px;border-radius:10px}

.gtile.warn{color:var(--warning);background:rgba(var(--warning-rgb),.12);box-shadow:inset 0 0 0 1px rgba(var(--warning-rgb),.28)}
/* A choice among a few: the name over a full-width segmented control. */
.srow-pick{flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px 14px;cursor:default}
.srow-pick .seg{margin:0}
/* A longer choice: the chosen row ticked in the accent. */
.srow-opt .srow-n{font-weight:500}
.srow-opt.on .srow-n{font-weight:700}
.srow-tick{flex:none;display:grid;place-items:center;width:24px;height:24px;color:var(--accentHi)}
.srow-tick .gl{width:20px;height:20px;stroke-width:2.2}
.srow-play{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:var(--rpill);

.srow-play .gl{width:16px;height:16px}
/* Destructive: its own card, apart from the safe rows, in the danger colour. */
.srow-danger{color:var(--danger)}
.srow-danger .srow-n{font-weight:700}
.srow-danger .gtile{color:var(--danger);background:rgba(var(--danger-rgb),.1);box-shadow:inset 0 0 0 1px rgba(var(--danger-rgb),.24)}
.sg-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised)}

.sacts .btn{flex:1 1 auto;width:auto;margin:0}
/* A monogram: the person's initials on a tile, in the highlight colour. */
.pmono{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--surface);

.pmono.lg{width:60px;height:60px;border-radius:18px;font-size:22px}
.srow.on .pmono{box-shadow:inset 0 0 0 1.5px var(--accent-edge)}

/* Who this is: a monogram, the name, the goal and the program, and three figures. */
.pid{position:relative;isolation:isolate;border-radius:var(--r5);border:1px solid var(--border);background:var(--raised);box-shadow:var(--shadow-card);overflow:hidden}
/* Contour lines behind the whole card, still and faint: texture, never read. */
.pid-bg{position:absolute;z-index:-1;top:-74px;right:-130px;width:540px;height:auto;opacity:.13;pointer-events:none;stroke-width:1.1}

.pid-hero{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 16px 14px;text-align:center}

.pid-av{position:relative;display:grid;place-items:center;width:156px;height:156px;margin:0;padding:0;border:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(var(--glow-rgb),.20),transparent 72%);cursor:pointer;
  transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .pid-av:active,.pid-av.tapd{transform:scale(.96)}
.pid-av:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.pid-orbit{position:absolute;inset:0;width:100%;height:100%;stroke-width:1.2;animation:pidTurn 80s linear infinite}
.pid-orbit .a{opacity:.85}
.pid-orbit .e{transform-box:view-box;transform-origin:80px 80px}
.pid-orbit.draw .e{animation:artEmber .9s var(--e-standard) .9s forwards,pidTurn 14s linear .9s infinite}

.pid-top{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;margin:0;padding:2px 8px;border:0;background:none;color:var(--text);

.pid-n{max-width:100%;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pid-edit{display:inline-flex;align-items:center;gap:2px;margin-top:8px;padding:6px 8px 6px 14px;border-radius:var(--rpill);

[dir="rtl"] .pid-edit{padding:6px 14px 6px 8px}
.pid-edit .ico-chev{width:16px;height:16px;color:var(--dim)}
:root:not(.tch) .pid-top:active .pid-edit,.pid-top.tapd .pid-edit{background:rgba(var(--accent-rgb),.2)}

/* Backup: how old the last one is, and what a backup holds, counted. */
.bk-card{margin:16px 0 0;padding:14px;border-radius:var(--r4);border:1px solid var(--border);background:var(--raised)}
.bk-card.warn{border-color:rgba(var(--warning-rgb),.45)}

  font-size:14.5px;font-weight:600;cursor:pointer;list-style:none}

.pglbl h2{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin:0}

.pgstat-k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.pgstat-v{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
  margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
.pgstat-v span,.pgbig span,.pgcomp-v span{font-family:inherit;font-size:13px;font-weight:600;color:var(--dim);
  margin-inline-start:3px;letter-spacing:0;white-space:nowrap}
.pgstat-d{font-size:12.5px;color:var(--dim);margin-top:6px}
.pgd{font-variant-numeric:tabular-nums;color:var(--dim)}
.pgd.ok{color:var(--ok)}
.pgcard{background:var(--raised);border:1px solid var(--border);border-radius:var(--r3);padding:20px;margin-bottom:var(--s3)}
.pgcard>.btn{margin-top:14px}
.pgcard-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pgcard-h h3{font-size:16px;margin:0}
.pgcard-h span{font-size:12.5px;color:var(--dim);text-align:end}
.pgbig{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.05;
  margin-top:4px;color:var(--text);font-variant-numeric:tabular-nums}
.pgbig.w,.pgbig.a{color:var(--text)}
.pgsub{font-size:13px;color:var(--dim);margin-top:6px}
.pgnote{font-size:12.5px;color:var(--dim);margin:10px 0 0}
.pgnone{font-size:13.5px;color:var(--dim);margin:10px 0 0;line-height:1.45}
.pgdash{display:inline-block;width:18px;border-top:1.5px dashed var(--dim);vertical-align:middle;margin-inline-end:6px}
/* The chart. Its box is stretched to the card, so strokes do not scale with it. */
.pgchart{margin:14px 0 0}
.pgchart svg{display:block;width:100%;height:120px;overflow:visible}
.pgchart-g{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}
.pgchart-a{fill:var(--accent);opacity:.1}
.pgchart-r{stroke:var(--dim);stroke-width:1.2;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.pgchart-l{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke}
.pgchart-p,.pgchart-po{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.pgchart-po{stroke:var(--text);stroke-width:9}
.pgchart-p{stroke:var(--accent);stroke-width:5.5}
.pgaxis{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);margin-top:8px}
/* Rows: records, workouts, top lifts, the day card. */
.pgrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:14px 16px;margin-bottom:8px;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);text-align:start}
:root:not(.tch) button.pgrow:active,button.pgrow.tapd{background:var(--surface)}
.pgrow.on{border-color:var(--accent)}
.pgrow-t{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.pgrow-k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.pgrow-n{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;min-width:0}
.pgrow-n>span{min-width:0;overflow-wrap:anywhere}
.pgrow-s{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.pgrow-e{font-size:13px;color:var(--dim);white-space:nowrap;flex-shrink:0}
.pgrow-v{font-weight:700;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.pgrow .ico-chev{color:var(--dim);flex-shrink:0}
.pgbadge{flex-shrink:0;padding:2px 6px;border-radius:4px;background:var(--gold);color:var(--bg);
  font-size:10.5px;font-weight:800;letter-spacing:.06em}
.pgpick{margin:var(--s4) 0 var(--s3)}
/* Share of working sets by muscle group. */
.pgshare-r{display:grid;grid-template-columns:minmax(0,7.5em) 1fr 3em;align-items:center;gap:12px;min-height:32px}
.pgshare-r>span{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgshare-r .bar{height:8px;margin:0;background:var(--surface);border-radius:4px}
.pgshare-r .bar i{height:8px;border-radius:4px;background:var(--accent)}
.pgshare-r b{text-align:end;font-size:13.5px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
/* Body. */
.pgwhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pgwd{font-size:13.5px;text-align:end;padding-top:2px}
.pgm{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;margin-bottom:8px;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r2)}
.pgm>span:first-child{flex:1;min-width:0;font-size:15.5px}
.pgm b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pgm-d{min-width:68px;text-align:end;font-size:13px}
.pgm.tall>span:first-child{display:flex;flex-direction:column;gap:2px}
.pgm small{font-size:12.5px;color:var(--dim)}
.pgm b.acc{color:var(--text)}
.pgcomp{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pgcomp-e{text-align:end}
.pgcomp-v{font-family:var(--display);font-size:30px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.pgtrack{height:10px;border-radius:5px;background:var(--surface);overflow:hidden;margin-top:14px}
.pgtrack i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.pgtrack.sm{height:5px;margin-top:10px}
.pgtrack.c i{background:var(--text)}
.pgtrack.f i{background:var(--dim)}
/* Progress photos: an add tile, then the photos newest first. */
.pgphotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pgaddph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:150px;border:1px dashed var(--border);border-radius:var(--r2);background:var(--raised);
  color:var(--dim);font-weight:600;cursor:pointer}
.pgaddph .ico{width:24px;height:24px;flex-basis:24px}
.pgaddph.sm{min-height:0;aspect-ratio:3/4;font-size:12.5px;text-align:center;padding:6px}
.pgfile{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.pgph{position:relative;display:block;padding:0;border:1px solid var(--border);border-radius:var(--r2);
  overflow:hidden;background:var(--surface);aspect-ratio:3/4}
.pgph img{display:block;width:100%;height:100%;object-fit:cover}
.pgph span{position:absolute;inset-inline-start:6px;bottom:6px;padding:2px 6px;border-radius:4px;
  background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600}
.pgph-sk{aspect-ratio:3/4;border-radius:var(--r2)}
.pgphoto-img{display:block;width:100%;height:auto;border-radius:var(--r2);margin:4px 0 12px}
/* Nutrition. */
.pgmacs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.pgmac{background:var(--raised);border:1px solid var(--border);border-radius:var(--r3);padding:14px 12px;min-width:0}
.pgmac-k{font-size:13px;color:var(--dim)}
.pgmac-v{font-family:var(--display);font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.pgmac-s{font-size:12.5px;color:var(--dim);margin-top:2px}
.pgadh{display:flex;align-items:center;justify-content:space-between;gap:16px}
.pgring{flex-shrink:0;width:64px;height:64px}
.pgring svg{width:100%;height:100%}
.pgring-t{fill:none;stroke:var(--surface);stroke-width:5}
.pgring-v{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
[dir="rtl"] .pglbl h2,[dir="rtl"] .pgstat-k,[dir="rtl"] .pgrow-k,[dir="rtl"] .pgbadge{letter-spacing:0}
@media (max-width:360px){

  .pgmacs{grid-template-columns:1fr}
  .pgbig{font-size:34px}
}
/* Icon discs are quiet everywhere: the inner surface, a hairline ring, the icon in
   sub. Red is kept for what you act on and where you are (the main button, the active
   tab, today, a selection), so a screen of metric cards no longer reads as a screen
   of alarms. The hero's badge is the one red disc on a screen. */
/* ---- Progress, redesign frames -------------------------------------------------
   Key metrics, exercise progress and the rest share one card surface (a faint top
   light over --raised, the card shadow) and one badge: an accent disc with a glyph,
   the dock's active state made solid. */
.pgcard,.pgstat,.pgkm-c,.pgpr,.pgex,.pginsight,.pgm,.pgrow{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--raised);
  box-shadow:var(--shadow-card)}
.pgki{flex:0 0 36px;width:36px;height:36px;border-radius:var(--rpill);display:inline-flex;align-items:center;justify-content:center;
  color:var(--sub);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.pgki svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pgkm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.pgkm-c{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px;border-radius:var(--r3);text-align:start;
  border:1px solid var(--border);color:var(--text);transition:transform var(--m-press) var(--e-standard)}
:root:not(.tch) .pgkm-c:active,.pgkm-c.tapd{transform:scale(.97)}
.pgkm-c:focus-visible{outline:2px solid var(--accentHi);outline-offset:2px}
.pgkm-h{display:flex;align-items:center;gap:10px;min-width:0}
.pgkm-k{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgkm-v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.pgkm-v small{font-family:inherit;font-size:13px;font-weight:600;color:var(--dim);margin-inline-start:3px}
.pgkm-s{font-size:12px;color:var(--dim);min-height:16px}
.pgspark{display:block;width:100%;height:28px;margin-top:2px;overflow:visible}
.pgspark path{fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pgspark.ok path{stroke:var(--ok)}
.pgbars{display:flex;align-items:flex-end;gap:5px;height:28px;margin-top:2px}
.pgbars i{flex:1;border-radius:3px;background:var(--bar-track)}
.pgbars i.now{background:var(--accent)}
.pgcard-i{display:flex;align-items:center;gap:10px}
.pgcard-i .pgki{flex-basis:32px;width:32px;height:32px}
.pgcard-i .pgki svg{width:17px;height:17px}
.pgcard-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pgcard-r b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;color:var(--text)}
.pgmeas-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}
.pgmeas-c{display:flex;flex-direction:column;gap:4px;min-width:0;padding:0 12px}
.pgmeas-c:first-child{padding-inline-start:0}
.pgmeas-c+.pgmeas-c{border-inline-start:1px solid var(--border)}
.pgmeas-c span:first-child{font-size:12.5px;color:var(--dim)}
.pgmeas-c b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.pgmeas-c .pgd{font-size:12px}
/* The closing banner over the rider. */
.pgbanner{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;
  min-height:84px;margin-top:var(--s5);padding:16px 18px;border-radius:var(--r4);text-align:start;color:var(--text);
  border:1px solid var(--accent-edge);background:linear-gradient(90deg,rgba(var(--accent-rgb),.35),rgba(20,20,26,.2) 60%),var(--raised)}
.pgbanner img{position:absolute;z-index:-1;inset-inline-start:0;top:0;width:42%;height:100%;object-fit:cover;object-position:52% 30%;
  mix-blend-mode:screen;opacity:.75;pointer-events:none;
  -webkit-mask:linear-gradient(90deg,#000 50%,transparent);mask:linear-gradient(90deg,#000 50%,transparent)}
[dir="rtl"] .pgbanner img{transform:scaleX(-1);-webkit-mask:linear-gradient(270deg,#000 50%,transparent);mask:linear-gradient(270deg,#000 50%,transparent)}
.pgbanner-t{flex:1;display:flex;flex-direction:column;gap:3px;padding-inline-start:30%}
.pgbanner-t b{font-family:var(--display);font-size:16px}
.pgbanner-t span{font-size:12.5px;color:var(--sub)}
.pgbanner .ico-chev{color:var(--text)}
/* Strength: the filter, record cards, exercise rows, the insight. */
.pghalf{margin-top:12px}
.pgprs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;margin:0 -2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pgprs::-webkit-scrollbar{display:none}
.pgprs.more{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
[dir="rtl"] .pgprs.more{-webkit-mask-image:linear-gradient(270deg,#000 82%,transparent);mask-image:linear-gradient(270deg,#000 82%,transparent)}
