<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bunyan">
<meta name="theme-color" content="#0D0D0D">
<title>Bunyan — Train · Fuel · Progress</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* ---- type: the two faces the Bunyan design is set in ---------------------------
   Outfit for titles and display numbers, Manrope for everything else — the pairing
   every frame in the Figma file uses. Both are SIL Open Font License (licences in
   fonts/), self-hosted rather than loaded from Google so the app still has its
   typography offline, which is the whole point of a PWA. Latin subset only: neither
   face has Arabic glyphs, so RTL keeps its own system stack further down.

   Manrope is a variable font, so one file carries every weight the design uses
   (400-700). Outfit is the variable file too, declared for 700-800: 700 for titles and
   figures, 800 for the splash wordmark, which is the only ExtraBold in the design.
   Nothing may ask Outfit for more than 800, or the browser fakes the weight. */
@font-face{font-family:"Manrope";src:url(fonts/manrope-latin.woff2) format("woff2");
  font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Outfit";src:url(fonts/outfit-latin.woff2) format("woff2");
  font-weight:700 800;font-style:normal;font-display:swap}
:root{
  /* ---- surfaces and text: the Bunyan Figma file ------------------------------
     Taken from the design itself (Figma file q6AJ6YJmBYfU35RktEfQOg, the bunyan-home
     frame), not mixed by eye. It replaces the Base Web grey ramp that stood in before
     the original design was reachable. The design has no Figma variables, so these
     are the literal values its frames use.

     The design grounds on a warm near-black rather than true black, with cards one
     step up and inner elements (chips, idle day dots) one step above that. Its text
     is a warm off-white rather than pure white, which is most of why it reads as
     Bunyan rather than as a generic dark UI. */
  --bg:#0b0b0c;                 /* page ground */
  --surface:#1c1c22;            /* chips, idle markers, inner elements */
  --raised:#141418;             /* cards and the nav bar */
  --border:#25252c;
  --text:#faf6ee;               /* primary */
  --sub:#d5d1c9;                /* secondary body text: subtitles, stat lines */
  --dim:#888580;                /* tertiary: dates, durations, meta, idle nav */
  --faint:#888580;

  /* ---- accent -----------------------------------------------------------------
     #e31b23 is the design's red and it is used here as a FILL — buttons, the ring,
     the active nav icon, borders — which is what it does in every frame.

     It is deliberately NOT used for small red text, although the frames use it that
     way ("5/7 Days Active", the session badge). Measured, #e31b23 is 3.92:1 on the
     card and 4.15:1 on the page ground, both under WCAG AA for text that size.
     accentHi stays #F83446, which reads as the same red at a glance and measures
     5.57:1. That is the one place this file departs from the design on purpose. */
  --accent:#e31b23; --accentHi:#F83446; --onAccent:#faf6ee;
  --accentSoft:rgba(227,27,35,.12);   /* the design's badge and avatar fill */

  /* Semantic, and reserved. Green is completed states only; gold is earned only. */
  --ok:#1A8D3E; --okSoft:#0E2415; --gold:#C9A227;
  --navbg:#141418; --navtext:#888580; --navon:#faf6ee;
  /* The ember wash behind the top of every screen, as the redesign frames have it:
     one soft red glow under the header, fading out long before the content. */
  --glow:rgba(227,27,35,.16);
  /* The primary fill runs from the brand red down to this, so its label sits on red
     that holds 4.5:1 (it measured 3.50:1 where the fill began at accentHi). */
  --accent-deep:#b3131b;
  /* Macros: one palette everywhere, validated as a categorical set on the dark grounds
     (colour-blind separation ≥ 8, normal vision ≥ 15). Protein keeps the brand red;
     carbs and fat stay clear of ok (done) and gold (earned), which are reserved. */
  --mac-p:#f83446; --mac-c:#22a6b3; --mac-f:#7f78f2;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r1:8px; --r2:12px; --r3:14px;
  /* ---- the dock and the surfaces that borrow from it --------------------------
     One visual language, taken from the floating dock: large radii, a translucent
     dark surface with a hairline edge, depth from a soft shadow rather than from
     borders, and the accent as a tinted glow rather than a fill. Components that are
     the same kind of control — segmented tabs, range chips, the date navigator —
     read these rather than carrying their own numbers.

     Radii run 8 / 12 / 14 (--r1–r3, cards and fields), 18 for controls inside a
     surface, 28 for floating surfaces, and a pill. */
  --r4:18px; --r5:28px; --rpill:999px;
  --glass:rgba(22,22,28,.78);            /* floating surfaces over content */
  --glass-solid:rgba(22,22,28,.96);      /* the same where blur is unavailable */
  --hair:rgba(255,255,255,.08);          /* the hairline edge on glass */
  --hair-hi:rgba(255,255,255,.14);       /* its lit top edge */
  --dock-hair:rgba(255,255,255,.08);     /* the dock's own, the same in both themes */
  --shadow-float:0 18px 48px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.28);
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
  --accent-tint:rgba(227,27,35,.16);     /* a selected state's fill */
  --accent-edge:rgba(248,52,70,.30);     /* its edge */
  --accent-glow:rgba(248,52,70,.22);     /* its glow */
  --ico-size:24px; --hit:44px;
  --seg-track:rgba(255,255,255,.04);    /* the recessed track under a segmented control */
  --bar-track:rgba(255,255,255,.14);    /* an unlit bar in a mini chart */
  /* The dock's geometry, and the one reserve every screen keeps for it. The dock
     floats --dock-lift above the bottom edge, which is the safe area on a phone with
     a home indicator and 12px on anything else; --navh is everything from the bottom
     of the viewport to the top of the dock. The body pads by it, and the toast and
     the floating add button sit above it, so no screen carries its own number. */
  --dock-h:64px; --dock-mx:16px;
  --dock-lift:max(12px, env(safe-area-inset-bottom));
  --navh:calc(var(--dock-h) + var(--dock-lift));
  /* The workout bar above the dock (see "The workout bar"). While it shows, --navh
     grows by it, so the page, the toast and anything else that clears the dock clear
     the bar too. */
  --wbar-h:48px; --wbar-gap:8px;
  /* Motion tokens. js/ui/motion.js writes all fourteen of these onto documentElement at
     boot and whenever the in-app animation toggle changes, and an inline property beats
     a stylesheet rule, so these values apply only to the first paint before the module
     runs — and to any load where it fails to.

     They are kept byte-for-byte identical to DUR and EASE in that module. They were not,
     for a while: nine of the thirteen were the pre-Phase-3 values, left behind when
     motion.js was introduced, while this comment claimed they matched. If you change a
     duration or a curve, change it in motion.js and mirror it here, or delete this block
     and accept one unstyled frame. Do not let them drift again. */
  --m-press:100ms; --m-micro:150ms; --m-pop:200ms; --m-comp:250ms;
  --m-sheet:300ms; --m-screen:300ms; --m-data:400ms; --m-reveal:500ms; --m-fade:200ms;
  --e-standard:cubic-bezier(0.2, 0, 0, 1); --e-decel:cubic-bezier(0.05, 0.7, 0.1, 1);
  --e-accel:cubic-bezier(0.3, 0, 0.8, 0.15); --e-spring:cubic-bezier(.2,.9,.3,1.06);
  --e-ios:cubic-bezier(0.22, 1, 0.36, 1);
}
[data-theme="light"]{
  /* Base Web light ramp, same source as the dark one above
     (baseweb/src/tokens/color-primitive-tokens.ts). Uber puts light UI on white with
     the grey ramp for surfaces, which is the inverse of the dark theme rather than a
     separately-tuned palette. */
  --bg:#FFFFFF;
  --surface:#F3F3F3;            /* gray50  */
  --raised:#E8E8E8;             /* gray100 */
  --border:#DDDDDD;             /* gray200 */
  --text:#000000;
  /* gray700/600, not the 600/400 that mirrors the dark theme: the light ramp is not
     symmetric in contrast, and gray400 on gray100 measures 1.99:1. */
  --dim:#5E5E5E;                /* gray700 */
  /* The design is dark-only and has no light values, so secondary text keeps the
     darkest light-theme tone that already passes AA rather than an invented one. */
  --sub:#5E5E5E;
  --faint:#727272;              /* gray600 */
  /* Accent darkened for contrast on white; the dark theme's #C41E2A fails on it. */
  --accent:#A5171F; --accentHi:#C41E2A; --onAccent:#FFFFFF; --accentSoft:#FBEAEB;
  --ok:#1A7F35; --okSoft:#E6F2E9; --gold:#8A6F16;
  --accent-deep:#8e121a;
  --mac-p:#c41e2a; --mac-c:#0a9396; --mac-f:#6d5fe6;
  /* Uber light UI is flat white. No wash. */
  --glow:transparent;
  /* The bar stays dark in both themes: it is chrome, not surface. */
  --navbg:#000000; --navtext:#8C8C8C; --navon:#FFFFFF;
  --seg-track:rgba(0,0,0,.05); --hair:rgba(0,0,0,.08); --bar-track:rgba(0,0,0,.10);
  /* So does the dock, and so the glass it is made of. */
  --glass:rgba(18,18,22,.84); --glass-solid:rgba(18,18,22,.97);
  --accent-tint:rgba(248,52,70,.18);
}
/* Kills double-tap-to-zoom, which has no place in an installed app, and with it
   Safari's ~300ms tap delay. Pinch-to-zoom is untouched. user-scalable=no in the
   viewport meta does not work: iOS has ignored it since iOS 10. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);
  background-image:radial-gradient(120% 60% at 50% -10%, var(--glow) 0%, transparent 62%);
  background-attachment:fixed;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
/* Reserve the dock's height plus breathing room, so the last card never sits under it.
   --navh already includes the safe area (through --dock-lift), so adding it again here
   would double-count. This is the only place the reserve is applied. */
body{padding-bottom:calc(var(--navh) + 20px)}
/* The document has to be at least as tall as the viewport, or a short screen — Home
   with nothing logged is the shortest — leaves the page shorter than the window. The
   nav is position:fixed and so is pinned either way in a compliant engine, but iOS
   Safari lays fixed elements out against the LARGE viewport while showing the SMALL
   one whenever the page cannot scroll, which is what put the bar above the bottom
   edge with a dead band beneath it. A page that always fills the viewport can always
   scroll the toolbar away, so the two viewports agree.

   100dvh is the dynamic viewport: it tracks the browser chrome collapsing instead of
   freezing at its largest. The 100vh line before it is the fallback for engines that
   do not know dvh — declaration order does the feature test, no @supports needed. */
html{min-height:100%}
body{min-height:100vh;min-height:100dvh}
/* The Home Screen app. iOS 26 standalone, with viewport-fit=cover and the translucent
   status bar this app uses, resolves 100%, 100svh and 100dvh to the screen height
   MINUS the top safe-area inset — about 50pt short. On a screen with little on it
   (Home, mostly) the document therefore ends above the bottom of the display, and
   iOS pins fixed elements to the end of the document rather than of the screen: the
   dock sat a status bar's height too high over a dead band, and dropped into place
   only when a long screen (Train) made the document taller than the display.

   100lvh is the one unit iOS reports as the full screen there, so the document is
   made at least that tall — in the installed app only. A Safari tab keeps 100dvh,
   because there the toolbar really does take that space. html.standalone is the
   same rule for iOS versions that do not match the display-mode query; app.js sets
   it from navigator.standalone before the first render. Nothing here positions the
   dock itself: it is still fixed to the bottom by CSS alone. */
@media (display-mode:standalone),(display-mode:fullscreen){
  html,body{min-height:100vh;min-height:100lvh}}
html.standalone,html.standalone body{min-height:100vh;min-height:100lvh}
/* The hidden attribute only carries `display:none` from the UA stylesheet, so any rule
   that sets display on the same element silently outranks it. That is what happened to
   the session's Paused label: .ss-paused{display:block} beat it, the attribute was
   applied correctly and ignored, and a running clock sat under the word PAUSED. Anything
   toggled with el.hidden needs this guard, so it lives here once rather than being
   rediscovered per component. */
[hidden]{display:none!important}
/* 24px side gutter, which every frame in the design uses. A token because anything
   that bleeds to the screen edge has to pull out by exactly this much. */
:root{--gutter:24px}
#app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) var(--gutter) 0}
button,input,select{font-family:inherit;font-size:16px}
input,select{background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--r1);padding:14px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
/* Titles are Outfit Bold in title case, as every frame sets them — "Good Morning,
   Khalid", "My Training", "Today's Meals". They were uppercase 800 before; the design
   never uppercases a title, only small labels and buttons. */
:root{--display:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
h1{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0;
  line-height:1.15}
.screen{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--s5)}
.screen .wm{font-size:12px;font-weight:800;letter-spacing:.26em;color:var(--accent);
  padding-top:8px;flex-shrink:0}
.screen .sub{margin:5px 0 0;color:var(--dim);font-size:14px}
.metric{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.02em;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1}
.overline{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin:var(--s5) 0 var(--s3)}
.stat{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{font-size:13px;color:var(--dim);font-weight:600;margin-left:3px}
h2{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
h3{font-family:var(--display);font-size:16px;font-weight:700;margin:0}
.sub{color:var(--dim);font-size:14.5px;margin:0 0 20px}
.tiny{font-size:12.5px;color:var(--faint)}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
/* Cards: radius 14 and 20px padding, as in the design. */
.card{background:var(--raised);border:1px solid var(--border);border-radius:var(--r3);
  padding:20px;margin-bottom:var(--s3)}
.card.hot{border-color:var(--accent)}
.tap{display:block;width:100%;text-align:left;color:var(--text);cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rowc{display:flex;align-items:center;gap:10px}
.sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:22px 0 9px}
/* The design's primary action: 48px, radius 8, Outfit Bold 15 in caps, an optional
   16px icon 8px before the label. min-height rather than height so a translated label
   that wraps grows the button instead of spilling out of it. */
.btn{width:100%;padding:0 18px;border-radius:var(--rpill);border:none;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:var(--onAccent);
  font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:0;
  text-transform:none;margin-top:var(--s2);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform var(--m-press) var(--e-standard), filter var(--m-press) var(--e-standard)}
/* The 48px floor belongs to the full-width primary action only. Scoped with :not()
   rather than overridden per variant, because zeroing it on .btn.sm would outrank
   .iconbtn's own 44px minimum on specificity and shrink the date-bar arrows. */
.btn:not(.sm):not(.d){min-height:52px}
.btn:active{transform:scale(.975);filter:brightness(1.12)}
.btn.g{background:var(--raised);border:1px solid var(--border);color:var(--text)}
.btn.o{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.btn.ok{background:var(--ok);color:#fff;border:none}
/* Destructive, for a sheet where the destructive option is NOT the primary one. The
   plain .btn is accent-filled and reads as "the thing to do"; on the leave-workout
   sheet the thing to do is keep the workout, so discarding cannot wear the same fill.
   Outlined in --accentHi, which measures 5.57 on the dark ground and 5.89 on the light
   one — both pass AA for text, which a filled accent would not at this size. */
.btn.danger{background:transparent;border:1px solid var(--accentHi);color:var(--accentHi)}
.btn.d{background:transparent;border:none;color:var(--faint);font-size:14px;padding:12px 0}
.btn.sm{width:auto;padding:9px 16px;font-size:14px;border-radius:var(--rpill);margin:0}
.pill{padding:6px 13px;border-radius:var(--rpill);background:var(--surface);
  border:1px solid var(--border);font-size:12.5px;font-weight:600;letter-spacing:0;
  text-transform:none;color:var(--dim);transition:transform var(--m-press) var(--e-standard)}
.pill:active{transform:scale(.94)}
.pill.a{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.gold{background:var(--accentSoft);color:var(--gold);font-weight:600}
.pill.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.big{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--raised);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:6px;border-radius:3px}
.steps{display:flex;align-items:center;gap:9px}
.stp{width:52px;height:52px;border-radius:13px;background:var(--raised);color:var(--text);
  border:1px solid var(--border);font-size:24px;font-weight:300;flex-shrink:0}
.stp:active{background:var(--accentSoft)}
.stv{flex:1;text-align:center}
.stn{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:transparent;border:none;text-align:center;width:100%;padding:0;color:var(--text);
  -moz-appearance:textfield}
.stn::-webkit-outer-spin-button,.stn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp{width:60px;height:60px}
.plan{background:var(--accentSoft);border-radius:12px;padding:11px 13px;margin-bottom:12px}
.thumb{border-radius:10px;object-fit:cover;background:#fff;flex-shrink:0}
.thumb.ph{display:flex;align-items:center;justify-content:center;background:var(--raised);
  color:var(--faint)}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.demo figure{margin:0}
.demo img{width:100%;border-radius:12px;background:#fff;display:block}
.demo figcaption{font-size:10.5px;color:var(--faint);text-align:center;margin-top:5px;
  letter-spacing:.08em;text-transform:uppercase}
.stu{font-size:10.5px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);text-align:center;padding:0 0 7px}
th:first-child,td:first-child{text-align:left;width:34px}
td{padding:7px 0;text-align:center;font-variant-numeric:tabular-nums;font-size:16px;
  border-top:1px solid var(--border)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:5px;border:1.5px solid var(--border)}
.dot.on{background:var(--ok);border-color:var(--ok)}
/* ---- The dock ----------------------------------------------------------------
   Fixed to the viewport and to nothing else: left, right and bottom are 0 and never
   change, it has no transform, no transition on its position and no will-change, and
   no script measures or moves it. The float above the home indicator is padding
   inside the fixed box (--dock-lift), so Safari's toolbar collapsing, a sheet locking
   the page, or the keyboard coming and going cannot leave it somewhere else.

   It is a direct child of <body>, beside #app rather than inside it: #app animates a
   transform on every tab change, and a transformed ancestor would turn "fixed" into
   "fixed to that ancestor". Keep it outside anything that transforms.

   While a text field has focus it fades out in place (body.kb, see syncKeyboard) —
   iOS would otherwise float a bottom-fixed bar over the keyboard. It fades, it does
   not slide, so there is no position for it to be left at. */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:0 var(--dock-mx) var(--dock-lift);pointer-events:none;
  transition:opacity var(--m-micro) var(--e-standard),visibility 0s}
body.kbleave nav,body.kbleave nav *{pointer-events:none!important}
body.kb nav{opacity:0;visibility:hidden;transition:opacity var(--m-micro) var(--e-standard),visibility 0s var(--m-micro)}
.dock{--i:0;position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  max-width:520px;height:var(--dock-h);margin:0 auto;padding:0 6px;
  border-radius:var(--r5);background:var(--glass-solid);
  border:1px solid var(--dock-hair);border-top-color:var(--hair-hi);
  box-shadow:var(--shadow-float);pointer-events:auto;isolation:isolate}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .dock{background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(22px);backdrop-filter:saturate(160%) blur(22px)}}
/* The dock keeps one order in both languages: Home at the left, Profile at the
   right. It is a row of places, not a line of text, and a thumb that has learnt where
   Train sits should find it there after switching to Arabic. direction:ltr fixes the
   grid's column order and the indicator's slide together; the labels are icons, so
   nothing inside needs to read right to left. */
.dock{direction:ltr}
/* One indicator, slid between the five cells by transform alone. Its cell is a fifth
   of the dock's inner width, so --i × 100% is exactly one item per step. */
.dock-ind{position:absolute;top:0;bottom:0;inset-inline-start:6px;width:calc((100% - 12px) / 5);
  transform:translateX(calc(var(--i) * 100%));pointer-events:none;z-index:0;
  transition:transform var(--m-screen) var(--e-ios)}
.dock-ind::before{content:"";position:absolute;inset:0;margin:auto;width:min(62px,90%);height:48px;
  border-radius:var(--rpill);background:var(--accent-tint);
  box-shadow:inset 0 0 0 1px var(--accent-edge),0 0 22px var(--accent-glow)}
.dock-b{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;
  min-width:var(--hit);min-height:var(--hit);height:100%;padding:0;margin:0;border:0;background:none;
  color:var(--navtext);cursor:pointer;

   The warrior and horse in shadow, the mark settling over it. Slow and atmospheric:
   a push-in that comes to rest, a mark that breathes, tracking that tightens. No
   fighting, no effects, nothing that reads as a game. */
/* The splash sits on the artwork's own black, not the app's #0b0b0c. intro.jpg's ground   measures about rgb(4,4,6) at every edge; on a lighter page the picture's bottom edge   showed as a line across the screen at y=583. Matching the art removes the step at   every screen size, and the splash still fades out into the app ground, so there is no   edge there either. */
/* The lockup sits low on purpose: the rider and horse own the upper two thirds, the
   mark sits over the rock and the ember glow at their feet. Centred, the mark landed
   on the horse and the two read as one confused shape. */
#splash{position:fixed;inset:0;z-index:400;background:#040406;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  animation:spOut .6s cubic-bezier(.4,0,.7,1) 3.05s forwards}
/* The artwork is square and the screen is tall, so it is sized to the width and set
   high rather than cover-cropped, which would cut the rider in half. Its own ground is
   near-black, so it blends into the splash background with no visible edge.
   If intro.jpg is missing the composition still holds on the ember glow alone. */

  background-image:url("intro.jpg");
  background-repeat:no-repeat;
  background-position:center 18%;
  background-size:min(130%,640px) auto;
  /* Feathered so the square artwork dissolves into the ground instead of showing
     its edge as a seam across the screen. */
  -webkit-mask-image:radial-gradient(74% 64% at 50% 42%,#000 54%,transparent 100%);
  mask-image:radial-gradient(74% 64% at 50% 42%,#000 54%,transparent 100%);
  opacity:0;transform:scale(1.12);
  animation:spArt 2.7s cubic-bezier(.16,.72,.24,1) .12s forwards}
#splash .sp-glow{position:absolute;left:50%;top:60%;width:132vw;height:132vw;
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,rgba(214,36,48,.34),rgba(4,4,6,0) 70%);
  animation:spGlowIn 1.9s ease .25s forwards, spBreathe 5s ease-in-out 2s infinite alternate}
/* Open through the middle so the rider reads, closed at the edges and the foot so the
   frame stays in shadow and the tagline stays legible. */

  background:radial-gradient(138% 92% at 50% 44%,rgba(4,4,6,0) 48%,
      rgba(4,4,6,.62) 80%,#040406 100%),
    linear-gradient(180deg,rgba(4,4,6,.62) 0%,rgba(4,4,6,0) 22%,
      rgba(4,4,6,0) 56%,rgba(4,4,6,.78) 86%,#040406 100%)}
#splash .sp-embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  animation-iteration-count:infinite}

   frame veil, the text shadows below, and the mark's own glow. */

  opacity:0;transform:translateY(14px) scale(.82);
