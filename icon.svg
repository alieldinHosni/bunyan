<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#231E17"/><stop offset="1" stop-color="#0D0B08"/>
  </linearGradient>
  <linearGradient id="brass" x1="0.1" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#F5DEA4"/><stop offset="0.34" stop-color="#D9B860"/>
    <stop offset="0.62" stop-color="#B4902F"/><stop offset="1" stop-color="#7E6417"/>
  </linearGradient>
  <linearGradient id="brassEdge" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#FBEBC4"/><stop offset="0.5" stop-color="#C9A227"/>
    <stop offset="1" stop-color="#6E5714"/>
  </linearGradient>
  <pattern id="girih" width="56" height="56" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#C9A227" stroke-width="1.6" opacity="0.34">
      <path d="M28 3 L37 19 L53 28 L37 37 L28 53 L19 37 L3 28 L19 19 Z"/>
    </g>
  </pattern>
  <clipPath id="archIn">
    <path d="M198 398 L198 232 L222 232 L222 194 L256 154 L290 194 L290 232 L314 232 L314 398 Z"/>
  </clipPath>
</defs>

<rect width="512" height="512" rx="114" fill="url(#stone)"/>

<!-- girih rosette field, alive on the poster, silent on the home screen -->
<g clip-path="url(#archIn)"><rect x="180" y="140" width="160" height="270" fill="url(#girih)"/></g>

<!-- outer arch: faceted, mitred, kufic -->
<path d="M146 398 L146 214 L188 214 L188 166 L256 88 L324 166 L324 214 L366 214 L366 398"
      fill="none" stroke="url(#brass)" stroke-width="23" stroke-linejoin="miter" stroke-miterlimit="8"/>

<!-- inner arch: the nested second line -->
<path d="M198 398 L198 232 L222 232 L222 194 L256 154 L290 194 L290 232 L314 232 L314 398"
      fill="none" stroke="url(#brassEdge)" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="8"/>

<!-- crescent -->
<g transform="translate(22 -6) rotate(-24 256 258)">
  <path d="M256 210 A 46 46 0 1 0 256 302 A 57 57 0 0 1 256 210 Z" fill="url(#brass)"/>
</g>

<!-- barbells: plates step down toward the arch -->
<g fill="url(#brass)">
  <rect x="40" y="212" width="17" height="84" rx="3"/>
  <rect x="65" y="224" width="14" height="60" rx="3"/>
  <rect x="86" y="234" width="11" height="40" rx="3"/>
  <rect x="97" y="247" width="60" height="14" rx="3"/>
  <rect x="455" y="212" width="17" height="84" rx="3"/>
  <rect x="433" y="224" width="14" height="60" rx="3"/>
  <rect x="415" y="234" width="11" height="40" rx="3"/>
  <rect x="355" y="247" width="60" height="14" rx="3"/>
</g>

<!-- foundation: bunyan is a thing built course upon course -->
<path d="M132 396 L380 396 L368 418 L144 418 Z" fill="url(#brass)"/>
<path d="M104 428 L408 428 L396 450 L116 450 Z" fill="#8C6E1B"/>
</svg>
